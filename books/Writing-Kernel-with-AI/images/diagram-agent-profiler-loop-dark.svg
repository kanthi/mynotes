<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Autonomous kernel optimization loop showing specification and hardware constraints fed to an LLM kernel agent, compiled and verified against a numerical oracle and anti-reward-hacking harness, profiled with Nsight Compute, and fed back to the agent" color-scheme="dark">
<rect width="820" height="320" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Closed-Loop Agent + Hardware Profiler Kernel Optimization</text>
<rect x="28" y="64" width="160" height="78" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="108" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">Spec + HW Card</text>
<text x="108" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">PyTorch ref + shapes</text>
<text x="108" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">SMEM / banks / MMA</text>
<rect x="224" y="60" width="164" height="86" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="306" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">LLM Kernel Agent</text>
<text x="306" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">CUDA / Triton / CuTe</text>
<text x="306" y="130" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#9fb0c3">proposes candidate</text>
<rect x="424" y="64" width="170" height="78" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="509" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">Verifier &amp; Sanitizer</text>
<text x="509" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">compile + FP64 oracle</text>
<text x="509" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ff7b6b">anti-hack checks</text>
<rect x="630" y="64" width="164" height="78" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="712" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">Profiler (NCU)</text>
<text x="712" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">TFLOP/s, HBM BW</text>
<text x="712" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">stalls, bank conflicts</text>
<rect x="260" y="198" width="410" height="58" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="465" y="222" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Feedback Archive (Best-N Candidates + Counters)</text>
<text x="465" y="242" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">feeds exact stall reasons &amp; compiler errors back into the next mutation step</text>
<line x1="188" y1="103" x2="222" y2="103" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="388" y1="103" x2="422" y2="103" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="594" y1="103" x2="628" y2="103" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="712" y1="142" x2="630" y2="196" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="198" x2="306" y2="148" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="292" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">never reward raw wall-clock speed without isolated verification and hardware counter telemetry</text>
</svg>

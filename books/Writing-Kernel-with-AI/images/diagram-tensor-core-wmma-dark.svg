<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="Tensor Core WMMA warp-cooperative matrix multiply-accumulate showing 32 threads loading 16x16 FP16 fragments A and B into a Tensor Core to accumulate into an FP32 16x16 matrix C" color-scheme="dark">
<rect width="820" height="310" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Warp-Cooperative Tensor Core Execution (WMMA / MMA)</text>
<rect x="28" y="64" width="166" height="66" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="111" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Fragment A (16x16)</text>
<text x="111" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">FP16 / BF16 (row_major)</text>
<rect x="28" y="156" width="166" height="66" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="111" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Fragment B (16x16)</text>
<text x="111" y="204" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">FP16 / BF16 (col_major)</text>
<rect x="256" y="88" width="256" height="106" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="384" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Tensor Core (32-thread Warp)</text>
<text x="384" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#e6edf5">D = A * B + C</text>
<text x="384" y="164" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">wmma::mma_sync / ptx mma.sync</text>
<text x="384" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">8,192 FLOPs per 16x16x16 tile</text>
<rect x="572" y="106" width="220" height="72" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="682" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Accumulator D (16x16)</text>
<text x="682" y="156" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">FP32 precision in registers</text>
<line x1="194" y1="97" x2="254" y2="122" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="194" y1="189" x2="254" y2="162" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="512" y1="142" x2="570" y2="142" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="274" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">low-precision inputs maximize throughput; FP32 accumulation preserves numerical stability</text>
</svg>

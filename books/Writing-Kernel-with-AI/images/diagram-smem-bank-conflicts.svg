<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="Shared memory bank conflicts showing 32 threads colliding on Bank 0 in a 32x32 column read versus conflict-free Bank 0..31 diagonal striping in a padded 32x33 tile or XOR swizzle" color-scheme="light">
<rect width="820" height="310" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Shared Memory Bank Conflicts: [32][32] vs. [32][33] Pad</text>
<rect x="28" y="56" width="366" height="202" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
<text x="211" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#c0392b">float tile[32][32] — 32-Way Conflict</text>
<text x="211" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">Column read: tile[0..31][0] all map to Bank 0</text>
<rect x="52" y="118" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="97" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T0 -> [0][0]</text>
<rect x="52" y="154" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="97" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T1 -> [1][0]</text>
<rect x="52" y="190" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="97" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T31->[31][0]</text>
<rect x="236" y="144" width="132" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="302" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#c0392b">Bank 0</text>
<text x="302" y="186" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#5a6b7d">32 serial cycles!</text>
<line x1="142" y1="132" x2="234" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="142" y1="168" x2="234" y2="170" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="142" y1="204" x2="234" y2="178" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="426" y="56" width="366" height="202" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.8"/>
<text x="609" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2a36">float tile[32][33] — Conflict-Free (1 Cycle)</text>
<text x="609" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">+1 pad shifts each row by +1 bank (or use XOR swizzle)</text>
<rect x="450" y="118" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="495" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T0 -> [0][0]</text>
<rect x="450" y="154" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="495" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T1 -> [1][0]</text>
<rect x="450" y="190" width="90" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="495" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">T31->[31][0]</text>
<rect x="634" y="118" width="132" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="700" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">Bank 0</text>
<rect x="634" y="154" width="132" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="700" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">Bank 1</text>
<rect x="634" y="190" width="132" height="28" rx="4" fill="#ffffff" stroke="#3b5b85"/>
<text x="700" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">Bank 31</text>
<line x1="540" y1="132" x2="632" y2="132" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="540" y1="168" x2="632" y2="168" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="540" y1="204" x2="632" y2="204" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#b)"/>
<text x="410" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">bank(addr) = (addr / 4 bytes) mod 32; XOR swizzle col' = col ^ row avoids extra memory overhead</text>
</svg>

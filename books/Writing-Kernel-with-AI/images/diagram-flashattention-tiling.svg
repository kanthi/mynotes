<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Comparison of standard attention writing O(N^2) S and P matrices to HBM versus FlashAttention streaming Q, K, and V tiles through on-chip SRAM with online softmax rescaling and a single HBM output write" color-scheme="light">
<rect width="820" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Standard Attention (HBM-Bound) vs. FlashAttention (SRAM-Fused)</text>
<rect x="28" y="54" width="764" height="84" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="46" y="76" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#1f2a36">Standard Attention — O(N^2) HBM Traffic</text>
<rect x="46" y="88" width="122" height="36" rx="5" fill="#ffffff" stroke="#3b5b85"/>
<text x="107" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">S = Q K^T</text>
<rect x="202" y="88" width="142" height="36" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="273" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">HBM Write/Read S</text>
<rect x="378" y="88" width="122" height="36" rx="5" fill="#ffffff" stroke="#3b5b85"/>
<text x="439" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">P = Softmax(S)</text>
<rect x="534" y="88" width="142" height="36" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="605" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">HBM Write/Read P</text>
<rect x="704" y="88" width="72" height="36" rx="5" fill="#ffffff" stroke="#3b5b85"/>
<text x="740" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#1f2a36">O = PV</text>
<line x1="168" y1="106" x2="200" y2="106" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="344" y1="106" x2="376" y2="106" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="106" x2="532" y2="106" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="676" y1="106" x2="702" y2="106" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="28" y="160" width="764" height="114" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="46" y="182" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#1f2a36">FlashAttention — Fused On-Chip SRAM Tiling (O(N) HBM Memory)</text>
<rect x="46" y="198" width="146" height="56" rx="6" fill="#ffffff" stroke="#3b5b85"/>
<text x="119" y="222" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2a36">Load Q_i to SRAM</text>
<text x="119" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#5a6b7d">outer loop (FA2)</text>
<rect x="228" y="198" width="320" height="56" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="388" y="220" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2a36">Stream K_j, V_j -> S_ij = Q_i K_j^T</text>
<text x="388" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Online Softmax: rescale (m, l, O) in registers</text>
<rect x="584" y="198" width="190" height="56" rx="6" fill="#ffffff" stroke="#3b5b85"/>
<text x="679" y="222" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#1f2a36">Final O_i / l_i -> HBM</text>
<text x="679" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#5a6b7d">1 write; S &amp; P never touch HBM</text>
<line x1="192" y1="226" x2="226" y2="226" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="548" y1="226" x2="582" y2="226" stroke="#3b5b85" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">exact mathematical attention without materializing the N x N score matrix in global memory</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="Shared memory bank conflicts showing 32 threads colliding on Bank 0 in a 32x32 column read versus conflict-free Bank 0..31 diagonal striping in a padded 32x33 tile or XOR swizzle" color-scheme="dark">
<rect width="820" height="310" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b6b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Shared Memory Bank Conflicts: [32][32] vs. [32][33] Pad</text>
<rect x="28" y="56" width="366" height="202" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
<text x="211" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#ff7b6b">float tile[32][32] — 32-Way Conflict</text>
<text x="211" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">Column read: tile[0..31][0] all map to Bank 0</text>
<rect x="52" y="118" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="97" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T0 -> [0][0]</text>
<rect x="52" y="154" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="97" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T1 -> [1][0]</text>
<rect x="52" y="190" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="97" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T31->[31][0]</text>
<rect x="236" y="144" width="132" height="52" rx="6" fill="#11161d" stroke="#ff7b6b" stroke-width="2"/>
<text x="302" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#ff7b6b">Bank 0</text>
<text x="302" y="186" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#9fb0c3">32 serial cycles!</text>
<line x1="142" y1="132" x2="234" y2="162" stroke="#ff7b6b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="142" y1="168" x2="234" y2="170" stroke="#ff7b6b" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="142" y1="204" x2="234" y2="178" stroke="#ff7b6b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="426" y="56" width="366" height="202" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.8"/>
<text x="609" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">float tile[32][33] — Conflict-Free (1 Cycle)</text>
<text x="609" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">+1 pad shifts each row by +1 bank (or use XOR swizzle)</text>
<rect x="450" y="118" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="495" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T0 -> [0][0]</text>
<rect x="450" y="154" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="495" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T1 -> [1][0]</text>
<rect x="450" y="190" width="90" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="495" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">T31->[31][0]</text>
<rect x="634" y="118" width="132" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="700" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Bank 0</text>
<rect x="634" y="154" width="132" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="700" y="172" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Bank 1</text>
<rect x="634" y="190" width="132" height="28" rx="4" fill="#11161d" stroke="#7fa7d9"/>
<text x="700" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Bank 31</text>
<line x1="540" y1="132" x2="632" y2="132" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="540" y1="168" x2="632" y2="168" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="540" y1="204" x2="632" y2="204" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#b)"/>
<text x="410" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">bank(addr) = (addr / 4 bytes) mod 32; XOR swizzle col' = col ^ row avoids extra memory overhead</text>
</svg>

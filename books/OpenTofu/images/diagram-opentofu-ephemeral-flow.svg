<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="OpenTofu ephemeral value flow showing ephemeral variable or ephemeral resource opened in memory, passed into a provider block or write-only attribute with version trigger, while state and plan store null" color-scheme="light">
<rect width="820" height="320" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Ephemeral Values &amp; Write-Only Attributes (Zero State Persistence)</text>
<rect x="28" y="64" width="210" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="133" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2a36">ephemeral source</text>
<text x="133" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">ephemeral var or block</text>
<rect x="286" y="56" width="236" height="88" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="404" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">In-Memory Run Only</text>
<text x="404" y="106" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">locals / provider / *_wo</text>
<text x="404" y="124" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">closed when run exits</text>
<rect x="572" y="64" width="220" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="682" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Cloud API / Vault</text>
<text x="682" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">receives secret_wo</text>
<rect x="240" y="198" width="330" height="62" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="405" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">State File &amp; Saved Plan</text>
<text x="405" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">secret_wo = null; secret_wo_version = 2</text>
<line x1="238" y1="100" x2="284" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="522" y1="100" x2="570" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="404" y1="144" x2="404" y2="196" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="478" y="176" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">secret never written</text>
<text x="410" y="294" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">bump *_wo_version to trigger rotation; state tracks only the version integer</text>
</svg>

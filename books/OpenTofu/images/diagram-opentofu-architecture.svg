<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="OpenTofu execution architecture showing HCL configuration files loaded by the tofu core graph and planner, which reads and writes state, invokes provider plugins over gRPC, and reconciles cloud or local APIs" color-scheme="light">
<rect width="820" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">OpenTofu Core Execution Architecture</text>
<rect x="28" y="64" width="166" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="111" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">HCL Configuration</text>
<text x="111" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">*.tf / *.tofu / *.tfvars</text>
<rect x="242" y="56" width="186" height="88" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="335" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">OpenTofu Core (tofu)</text>
<text x="335" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">builds resource DAG</text>
<text x="335" y="124" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">computes plan &amp; diffs</text>
<rect x="478" y="64" width="148" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="552" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Provider Plugins</text>
<text x="552" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">AWS / GCP / Random</text>
<rect x="664" y="64" width="130" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="729" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Target APIs</text>
<text x="729" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Cloud / On-Prem</text>
<rect x="200" y="206" width="270" height="64" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="335" y="232" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">State Backend + Lock</text>
<text x="335" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">S3 / GCS / Azure / Local (optional AES-GCM)</text>
<line x1="194" y1="100" x2="240" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="428" y1="100" x2="476" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="452" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">gRPC</text>
<line x1="626" y1="100" x2="662" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="335" y1="144" x2="335" y2="204" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="382" y="178" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">read / write</text>
<text x="410" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">init downloads plugins; plan diffs config vs refreshed state; apply converges reality</text>
</svg>

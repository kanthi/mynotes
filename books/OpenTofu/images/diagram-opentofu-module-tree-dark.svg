<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="OpenTofu module composition showing a root module with its own backend and providers passing input variables into network, data, and app child modules and wiring outputs between them" color-scheme="dark">
<rect width="820" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Root Module &amp; Child Module Composition</text>
<rect x="190" y="52" width="440" height="64" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="410" y="78" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Root Module (roots/app-prod)</text>
<text x="410" y="98" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">owns backend, state, provider configs, and pinned module versions</text>
<rect x="44" y="182" width="220" height="82" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="154" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">module.network</text>
<text x="154" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">in: cidr, azs</text>
<text x="154" y="246" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">out: vpc_id, subnet_ids</text>
<rect x="300" y="182" width="220" height="82" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="410" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">module.database</text>
<text x="410" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">in: subnet_ids</text>
<text x="410" y="246" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">out: endpoint</text>
<rect x="556" y="182" width="220" height="82" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="666" y="208" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">module.service</text>
<text x="666" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">in: vpc_id, endpoint</text>
<text x="666" y="246" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">out: service_url</text>
<line x1="290" y1="116" x2="175" y2="180" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="116" x2="410" y2="180" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="530" y1="116" x2="645" y2="180" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="264" y1="223" x2="298" y2="223" stroke="#7fa7d9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<line x1="520" y1="223" x2="554" y2="223" stroke="#7fa7d9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="410" y="302" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">children never declare backends; root passes explicit inputs and wires outputs across</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="OpenTofu variable precedence and module dataflow from defaults, TF_VAR environment variables, tfvars files, and CLI flags into validated variables, locals, resources, and module outputs" color-scheme="dark">
<rect width="820" height="310" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Variable Precedence &amp; Module Dataflow</text>
<rect x="26" y="58" width="214" height="176" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="133" y="82" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Input Precedence (low -> high)</text>
<text x="42" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">1. variable default</text>
<text x="42" y="130" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">2. TF_VAR_&lt;name&gt;</text>
<text x="42" y="152" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">3. terraform.tfvars</text>
<text x="42" y="174" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">4. *.auto.tfvars</text>
<text x="42" y="196" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">5. -var-file / -var</text>
<text x="42" y="218" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#ff7b6b">last value wins</text>
<rect x="278" y="106" width="132" height="78" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
<text x="344" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">var.*</text>
<text x="344" y="156" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">type + validation</text>
<rect x="444" y="106" width="132" height="78" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="510" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">local.*</text>
<text x="510" y="156" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">private transforms</text>
<rect x="610" y="68" width="182" height="66" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="701" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">resource / data</text>
<text x="701" y="116" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">managed objects</text>
<rect x="610" y="162" width="182" height="66" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="701" y="190" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">output.*</text>
<text x="701" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">public module API</text>
<line x1="240" y1="145" x2="276" y2="145" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="145" x2="442" y2="145" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="576" y1="130" x2="608" y2="105" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="701" y1="134" x2="701" y2="160" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="282" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">callers pass variables and read outputs; internal locals and resource names stay private</text>
</svg>

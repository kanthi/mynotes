<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="Git hosting platform architecture showing ingress, web API, Git RPC storage, database, object storage, and CI runners" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="290" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Self-Hosted Git Forge Architecture (GitLab / Forgejo / Gitea Pattern)</text>
  <rect x="30" y="70" width="165" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="112.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Ingress Layer</text>
  <text x="112.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">HTTPS Smart Git</text>
  <text x="112.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SSH (sshd/internal)</text>
  <text x="112.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Reverse Proxy</text>
  <rect x="235" y="70" width="185" height="95" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="327.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Web / API App</text>
  <text x="327.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">AuthN/RBAC/OAuth</text>
  <text x="327.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">PRs, Issues, Hooks</text>
  <text x="327.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Webhook Dispatch</text>
  <rect x="460" y="70" width="160" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="540.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Git Storage RPC</text>
  <text x="540.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Bare .git repos</text>
  <text x="540.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Gitaly / Direct FS</text>
  <text x="540.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Packfile cache</text>
  <rect x="655" y="70" width="135" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="722.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">CI Runners</text>
  <text x="722.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Ephemeral jobs</text>
  <text x="722.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Container build</text>
  <text x="722.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Artifact upload</text>
  <rect x="235" y="200" width="185" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="327.5" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">PostgreSQL + Redis</text>
  <text x="327.5" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Metadata, users, queues</text>
  <rect x="460" y="200" width="330" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="625.0" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Object Storage (S3 / MinIO)</text>
  <text x="625.0" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Git LFS, CI artifacts, container packages</text>
  <line x1="195" y1="117" x2="235" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">auth</text>
  <line x1="420" y1="117" x2="460" y2="117" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="440" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">rpc</text>
  <line x1="620" y1="117" x2="655" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="637" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">clone</text>
  <line x1="327" y1="165" x2="327" y2="200" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">sql</text>
  <line x1="540" y1="165" x2="540" y2="200" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">lfs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 295" role="img" aria-label="Comparison of push-based CI deployment versus pull-based GitOps reconciliation" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="295" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Push-Based CI Deployment vs. Pull-Based GitOps Reconciliation</text>
  <rect x="30" y="65" width="365" height="185" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="212.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Push Model (External CI)</text>
  <text x="212.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">CI holds cluster-admin kubeconfig/token</text>
  <text x="212.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Runs kubectl apply / helm upgrade on push</text>
  <text x="212.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">No continuous drift correction after job exits</text>
  <text x="212.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Wider blast radius if CI runner is compromised</text>
  <rect x="425" y="65" width="365" height="185" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="607.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Pull Model (GitOps Controller)</text>
  <text x="607.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Flux / Argo CD runs inside the cluster</text>
  <text x="607.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Pulls signed Git commits + compares live state</text>
  <text x="607.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Continuous reconciliation heals manual drift</text>
  <text x="607.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Cluster credentials never leave the cluster</text>
  <text x="410" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7d">Git becomes the single source of truth; rollback is simply git revert.</text>
</svg>

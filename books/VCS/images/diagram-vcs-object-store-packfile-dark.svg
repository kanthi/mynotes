<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 285" role="img" aria-label="Git object store showing loose zlib objects, git gc repacking, and packfile delta compression" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="285" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Git Object Store: Content Addressing and Packfile Delta Compression</text>
  <rect x="30" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="140.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Loose Object (.git/objects)</text>
  <text x="140.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">header: 'blob 12\0' + data</text>
  <text x="140.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SHA-1/256 -&gt; ab/cdef...</text>
  <text x="140.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">zlib compressed file</text>
  <rect x="300" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="410.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">git gc / repack</text>
  <text x="410.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Sorts objects by path/size</text>
  <text x="410.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Computes delta chains</text>
  <text x="410.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Writes .pack + .idx</text>
  <rect x="570" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="680.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Packfile + Index</text>
  <text x="680.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">pack-*.idx (binary search)</text>
  <text x="680.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">pack-*.pack (base + deltas)</text>
  <text x="680.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">multi-pack-index (MIDX)</text>
  <line x1="250" y1="117" x2="300" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">pack</text>
  <line x1="520" y1="117" x2="570" y2="117" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="545" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">emit</text>
  <rect x="30" y="200" width="760" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="410.0" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Object Relationship Graph</text>
  <text x="410.0" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Commit -&gt; Root Tree -&gt; Subtrees &amp; Blobs (exact byte snapshots; identical files deduplicate automatically)</text>
</svg>

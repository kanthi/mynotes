<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 225" role="img" aria-label="Argo Rollouts canary traffic splitting with automated Prometheus AnalysisRun promotion or abort" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="225" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Argo Rollouts Progressive Delivery: Weighted Canary + Automated Analysis</text>
  <rect x="30" y="75" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="112.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Ingress / Mesh</text>
  <text x="112.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Istio / NGINX / GW</text>
  <text x="112.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Shifts traffic:</text>
  <text x="112.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">5% -&gt; 25% -&gt; 100%</text>
  <rect x="245" y="50" width="180" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="335.0" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Stable ReplicaSet</text>
  <text x="335.0" y="94" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">v1 (95% traffic)</text>
  <text x="335.0" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Proven healthy</text>
  <rect x="245" y="135" width="180" height="65" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="335.0" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Canary ReplicaSet</text>
  <text x="335.0" y="179" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">v2 (5% traffic)</text>
  <text x="335.0" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Under observation</text>
  <rect x="480" y="75" width="150" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="555.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">AnalysisRun</text>
  <text x="555.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Queries Prometheus</text>
  <text x="555.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Error rate &lt; 1%</text>
  <text x="555.0" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">p99 latency &lt; 250ms</text>
  <rect x="670" y="75" width="125" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="732.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Decision</text>
  <text x="732.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Pass -&gt; Promote</text>
  <text x="732.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Fail -&gt; Auto-Abort</text>
  <text x="732.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">0% Canary</text>
  <line x1="195" y1="105" x2="245" y2="85" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">95%</text>
  <line x1="195" y1="135" x2="245" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="218" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">5%</text>
  <line x1="425" y1="160" x2="480" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="452" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">metrics</text>
  <line x1="630" y1="122" x2="670" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">gate</text>
</svg>

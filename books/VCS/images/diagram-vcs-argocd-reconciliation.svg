<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" role="img" aria-label="Argo CD architecture showing Git repository, Repo Server, Application Controller reconciliation loop, and Kubernetes cluster" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="255" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Argo CD Control Plane and Continuous Reconciliation Loop</text>
  <rect x="30" y="70" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="112.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Git Repository</text>
  <text x="112.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Desired manifests</text>
  <text x="112.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Helm / Kustomize</text>
  <text x="112.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Signed commits</text>
  <rect x="235" y="70" width="175" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="322.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Repo Server</text>
  <text x="322.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Clones &amp; caches Git</text>
  <text x="322.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Renders YAML</text>
  <text x="322.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Redis manifest cache</text>
  <rect x="450" y="70" width="180" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="540.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">App Controller</text>
  <text x="540.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Diffs Desired vs Live</text>
  <text x="540.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Sync Waves &amp; Hooks</text>
  <text x="540.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Self-Heal + Prune</text>
  <rect x="670" y="70" width="120" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="730.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Kubernetes</text>
  <text x="730.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Live Cluster</text>
  <text x="730.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Deployments</text>
  <text x="730.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Health Status</text>
  <line x1="195" y1="117" x2="235" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">fetch</text>
  <line x1="410" y1="117" x2="450" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">render</text>
  <line x1="630" y1="117" x2="670" y2="117" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="650" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">sync</text>
  <path d="M 730 165 L 730 215 L 540 215 L 540 165" fill="none" stroke="#3b5b85" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="635" y="233" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Watch live cluster state (OutOfSync / Degraded)</text>
</svg>

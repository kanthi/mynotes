<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="Git hosting platform architecture showing ingress, web API, Git RPC storage, database, object storage, and CI runners" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="290" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Self-Hosted Git Forge Architecture (GitLab / Forgejo / Gitea Pattern)</text>
  <rect x="30" y="70" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="112.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Ingress Layer</text>
  <text x="112.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">HTTPS Smart Git</text>
  <text x="112.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SSH (sshd/internal)</text>
  <text x="112.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Reverse Proxy</text>
  <rect x="235" y="70" width="185" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="327.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Web / API App</text>
  <text x="327.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">AuthN/RBAC/OAuth</text>
  <text x="327.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">PRs, Issues, Hooks</text>
  <text x="327.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Webhook Dispatch</text>
  <rect x="460" y="70" width="160" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="540.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Git Storage RPC</text>
  <text x="540.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Bare .git repos</text>
  <text x="540.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Gitaly / Direct FS</text>
  <text x="540.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Packfile cache</text>
  <rect x="655" y="70" width="135" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="722.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">CI Runners</text>
  <text x="722.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Ephemeral jobs</text>
  <text x="722.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Container build</text>
  <text x="722.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Artifact upload</text>
  <rect x="235" y="200" width="185" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="327.5" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">PostgreSQL + Redis</text>
  <text x="327.5" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Metadata, users, queues</text>
  <rect x="460" y="200" width="330" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="625.0" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Object Storage (S3 / MinIO)</text>
  <text x="625.0" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Git LFS, CI artifacts, container packages</text>
  <line x1="195" y1="117" x2="235" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">auth</text>
  <line x1="420" y1="117" x2="460" y2="117" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="440" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">rpc</text>
  <line x1="620" y1="117" x2="655" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="637" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">clone</text>
  <line x1="327" y1="165" x2="327" y2="200" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">sql</text>
  <line x1="540" y1="165" x2="540" y2="200" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558" y="186" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">lfs</text>
</svg>

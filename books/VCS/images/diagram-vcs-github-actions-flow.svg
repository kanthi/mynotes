<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="GitHub Actions execution flow from trigger event through workflow YAML and ephemeral runner to artifacts" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="235" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">GitHub Actions Execution Model: Event to Ephemeral Runner</text>
  <rect x="30" y="75" width="155" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="107.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Trigger Event</text>
  <text x="107.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">push / pull_request</text>
  <text x="107.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">schedule / dispatch</text>
  <text x="107.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">workflow_call</text>
  <rect x="225" y="75" width="175" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="312.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Workflow YAML</text>
  <text x="312.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">.github/workflows/*</text>
  <text x="312.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">permissions + env</text>
  <text x="312.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">needs: DAG order</text>
  <rect x="440" y="75" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="522.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Ephemeral Runner</text>
  <text x="522.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Fresh VM/Container</text>
  <text x="522.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Matrix fan-out</text>
  <text x="522.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Step 1 -&gt; Step N</text>
  <rect x="645" y="75" width="145" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="717.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Outputs</text>
  <text x="717.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Cache / Artifacts</text>
  <text x="717.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">OIDC Cloud Auth</text>
  <text x="717.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Release / Deploy</text>
  <line x1="185" y1="122" x2="225" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">match</text>
  <line x1="400" y1="122" x2="440" y2="122" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="420" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">assign</text>
  <line x1="605" y1="122" x2="645" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">publish</text>
  <text x="410" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7d">Pin third-party actions by full commit SHA and scope GITHUB_TOKEN permissions to least privilege.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 225" role="img" aria-label="Argo Rollouts canary traffic splitting with automated Prometheus AnalysisRun promotion or abort" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="225" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Argo Rollouts Progressive Delivery: Weighted Canary + Automated Analysis</text>
  <rect x="30" y="75" width="165" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="112.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Ingress / Mesh</text>
  <text x="112.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Istio / NGINX / GW</text>
  <text x="112.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Shifts traffic:</text>
  <text x="112.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">5% -&gt; 25% -&gt; 100%</text>
  <rect x="245" y="50" width="180" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="335.0" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Stable ReplicaSet</text>
  <text x="335.0" y="94" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">v1 (95% traffic)</text>
  <text x="335.0" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Proven healthy</text>
  <rect x="245" y="135" width="180" height="65" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="335.0" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Canary ReplicaSet</text>
  <text x="335.0" y="179" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">v2 (5% traffic)</text>
  <text x="335.0" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Under observation</text>
  <rect x="480" y="75" width="150" height="95" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="555.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">AnalysisRun</text>
  <text x="555.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Queries Prometheus</text>
  <text x="555.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Error rate &lt; 1%</text>
  <text x="555.0" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">p99 latency &lt; 250ms</text>
  <rect x="670" y="75" width="125" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="732.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Decision</text>
  <text x="732.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Pass -&gt; Promote</text>
  <text x="732.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Fail -&gt; Auto-Abort</text>
  <text x="732.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">0% Canary</text>
  <line x1="195" y1="105" x2="245" y2="85" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">95%</text>
  <line x1="195" y1="135" x2="245" y2="160" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="218" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">5%</text>
  <line x1="425" y1="160" x2="480" y2="135" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="452" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">metrics</text>
  <line x1="630" y1="122" x2="670" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">gate</text>
</svg>

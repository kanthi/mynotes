<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="Comparison of three-way merge commit versus linear rebase replay" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="290" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Three-Way Merge Commit vs. Linear Rebase Replay</text>
  <rect x="30" y="65" width="365" height="200" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="212.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Three-Way Merge (Preserves Topology)</text>
  <text x="212.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Base (B) + main (M) + feat (F) -&gt; Merge (X)</text>
  <text x="212.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">X has two parents: M and F</text>
  <text x="212.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero history rewriting; safe on shared branches</text>
  <rect x="425" y="65" width="365" height="200" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="607.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Rebase (Linearizes History)</text>
  <text x="607.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Replays F1, F2 as new commits F1', F2' onto M</text>
  <text x="607.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">New commit hashes; single parent chain</text>
  <text x="607.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Clean git bisect; never rebase shared main</text>
  <circle cx="80" cy="215" r="14" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/><text x="80" y="219" text-anchor="middle" font-size="11" fill="#e6edf5">B</text>
  <circle cx="170" cy="185" r="14" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/><text x="170" y="189" text-anchor="middle" font-size="11" fill="#e6edf5">M</text>
  <circle cx="170" cy="240" r="14" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/><text x="170" y="244" text-anchor="middle" font-size="11" fill="#e6edf5">F</text>
  <circle cx="280" cy="215" r="16" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.5"/><text x="280" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#ff7b6b">X</text>
  <line x1="94" y1="210" x2="156" y2="190" stroke="#7fa7d9" stroke-width="2"/>
  <line x1="94" y1="220" x2="156" y2="235" stroke="#ff7b6b" stroke-width="2"/>
  <line x1="184" y1="190" x2="264" y2="210" stroke="#7fa7d9" stroke-width="2"/>
  <line x1="184" y1="235" x2="264" y2="220" stroke="#ff7b6b" stroke-width="2"/>
  <circle cx="480" cy="215" r="14" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/><text x="480" y="219" text-anchor="middle" font-size="11" fill="#e6edf5">B</text>
  <circle cx="565" cy="215" r="14" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/><text x="565" y="219" text-anchor="middle" font-size="11" fill="#e6edf5">M</text>
  <circle cx="650" cy="215" r="14" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/><text x="650" y="219" text-anchor="middle" font-size="11" fill="#ff7b6b">F1'</text>
  <circle cx="735" cy="215" r="14" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/><text x="735" y="219" text-anchor="middle" font-size="11" fill="#ff7b6b">F2'</text>
  <line x1="494" y1="215" x2="551" y2="215" stroke="#7fa7d9" stroke-width="2"/>
  <line x1="579" y1="215" x2="636" y2="215" stroke="#ff7b6b" stroke-width="2"/>
  <line x1="664" y1="215" x2="721" y2="215" stroke="#ff7b6b" stroke-width="2"/>
</svg>

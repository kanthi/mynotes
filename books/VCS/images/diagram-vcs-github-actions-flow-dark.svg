<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="GitHub Actions execution flow from trigger event through workflow YAML and ephemeral runner to artifacts" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="235" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">GitHub Actions Execution Model: Event to Ephemeral Runner</text>
  <rect x="30" y="75" width="155" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="107.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Trigger Event</text>
  <text x="107.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">push / pull_request</text>
  <text x="107.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">schedule / dispatch</text>
  <text x="107.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">workflow_call</text>
  <rect x="225" y="75" width="175" height="95" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="312.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Workflow YAML</text>
  <text x="312.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">.github/workflows/*</text>
  <text x="312.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">permissions + env</text>
  <text x="312.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">needs: DAG order</text>
  <rect x="440" y="75" width="165" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="522.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Ephemeral Runner</text>
  <text x="522.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Fresh VM/Container</text>
  <text x="522.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Matrix fan-out</text>
  <text x="522.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Step 1 -&gt; Step N</text>
  <rect x="645" y="75" width="145" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="717.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Outputs</text>
  <text x="717.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Cache / Artifacts</text>
  <text x="717.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">OIDC Cloud Auth</text>
  <text x="717.5" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Release / Deploy</text>
  <line x1="185" y1="122" x2="225" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">match</text>
  <line x1="400" y1="122" x2="440" y2="122" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="420" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">assign</text>
  <line x1="605" y1="122" x2="645" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">publish</text>
  <text x="410" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9fb0c3">Pin third-party actions by full commit SHA and scope GITHUB_TOKEN permissions to least privilege.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="Git bisect binary search workflow showing good, midpoint, bad commits and exit code contract" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="270" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Git Bisect: O(log2 N) Automated Regression Hunting</text>
  <rect x="30" y="70" width="160" height="80" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="110.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Good (v1.0)</text>
  <text x="110.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">exit 0 (pass)</text>
  <text x="110.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">known healthy</text>
  <rect x="230" y="70" width="160" height="80" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="310.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Midpoint #1</text>
  <text x="310.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">git bisect run</text>
  <text x="310.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">test script</text>
  <rect x="430" y="70" width="160" height="80" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="510.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Midpoint #2</text>
  <text x="510.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">narrows range</text>
  <text x="510.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">by half each step</text>
  <rect x="630" y="70" width="160" height="80" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="710.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Bad (HEAD)</text>
  <text x="710.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">exit 1 (fail)</text>
  <text x="710.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">regression present</text>
  <line x1="190" y1="110" x2="230" y2="110" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">ok</text>
  <line x1="390" y1="110" x2="430" y2="110" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="410" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">narrow</text>
  <line x1="590" y1="110" x2="630" y2="110" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">bad</text>
  <rect x="30" y="185" width="760" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="410.0" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Exit Code Contract for git bisect run &lt;script&gt;</text>
  <text x="410.0" y="229" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">0 = good commit  |  1..127 (except 125) = bad commit  |  125 = untestable (skip)  |  1,000 commits -&gt; ~10 steps</text>
</svg>

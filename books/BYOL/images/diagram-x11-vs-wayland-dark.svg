<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Comparison of X11 client-server display architecture with separate compositor versus Wayland unified display server and compositor sharing DMA-BUF buffers directly with clients" color-scheme="dark">
<rect width="820" height="320" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">X11 Architecture vs. Wayland Compositor Architecture</text>
<rect x="28" y="54" width="366" height="206" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="211" y="78" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">X11 (Extra Hops, Global Input)</text>
<rect x="52" y="96" width="110" height="44" rx="6" fill="#11161d" stroke="#7fa7d9"/>
<text x="107" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">X Client App</text>
<rect x="242" y="96" width="128" height="44" rx="6" fill="#11161d" stroke="#ff7b6b" stroke-width="1.8"/>
<text x="306" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Xorg Server</text>
<rect x="122" y="182" width="176" height="48" rx="6" fill="#11161d" stroke="#7fa7d9"/>
<text x="210" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">External Compositor</text>
<line x1="162" y1="118" x2="240" y2="118" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="290" y1="140" x2="245" y2="180" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="426" y="54" width="366" height="206" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
<text x="609" y="78" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Wayland (Direct, Isolated, Tear-Free)</text>
<rect x="450" y="96" width="124" height="44" rx="6" fill="#11161d" stroke="#7fa7d9"/>
<text x="512" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Wayland Client</text>
<rect x="616" y="96" width="152" height="58" rx="6" fill="#11161d" stroke="#ff7b6b" stroke-width="1.8"/>
<text x="692" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#e6edf5">Compositor</text>
<text x="692" y="138" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#9fb0c3">Sway / KWin / Mutter</text>
<rect x="520" y="186" width="210" height="44" rx="6" fill="#11161d" stroke="#7fa7d9"/>
<text x="625" y="212" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">Linux DRM / KMS + libinput</text>
<line x1="574" y1="118" x2="614" y2="118" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="665" y1="154" x2="640" y2="184" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="292" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Wayland clients render via EGL/Vulkan into DMA-BUF; compositor owns KMS scanout and input isolation</text>
</svg>

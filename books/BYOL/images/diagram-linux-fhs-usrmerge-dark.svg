<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Modern Linux Filesystem Hierarchy Standard with usr-merge showing /bin, /sbin, and /lib symlinked into /usr alongside /etc config, /var mutable state, /proc and /sys virtual filesystems, and /boot ESP" color-scheme="dark">
<rect width="820" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Modern Linux Root Filesystem (FHS + /usr-merge)</text>
<rect x="330" y="48" width="160" height="44" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="410" y="75" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#e6edf5">/ (root)</text>
<rect x="26" y="132" width="178" height="122" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="115" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">/usr (read-only OS)</text>
<text x="42" y="178" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/usr/bin   (&lt;- /bin)</text>
<text x="42" y="198" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/usr/sbin  (&lt;- /sbin)</text>
<text x="42" y="218" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/usr/lib   (&lt;- /lib)</text>
<text x="42" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/usr/share (arch-indep)</text>
<rect x="224" y="132" width="172" height="122" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="310" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">/etc &amp; /var</text>
<text x="240" y="178" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/etc  host config</text>
<text x="240" y="198" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/var/log  logs</text>
<text x="240" y="218" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/var/lib  pkg db</text>
<text x="240" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/home  user data</text>
<rect x="416" y="132" width="186" height="122" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="509" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Kernel Virtual FS</text>
<text x="432" y="178" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/proc  procfs (PIDs)</text>
<text x="432" y="198" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/sys   sysfs (hw/kobj)</text>
<text x="432" y="218" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/dev   devtmpfs nodes</text>
<text x="432" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">/run   tmpfs runtime</text>
<rect x="622" y="132" width="172" height="122" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="708" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">/boot &amp; /efi</text>
<text x="638" y="178" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">vmlinuz (kernel)</text>
<text x="638" y="198" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">initramfs.img</text>
<text x="638" y="218" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">EFI/BOOT/*.efi</text>
<text x="638" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">FAT32 ESP partition</text>
<line x1="360" y1="92" x2="135" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="390" y1="92" x2="315" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430" y1="92" x2="500" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460" y1="92" x2="690" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="294" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">isolating vendor binaries in /usr enables atomic snapshots, dm-verity, and immutable roots</text>
</svg>

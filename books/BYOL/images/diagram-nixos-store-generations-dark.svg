<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="NixOS declarative store and generation architecture showing flake.nix and flake.lock evaluating into immutable /nix/store/hash-name derivations, linked into versioned system generations with atomic rollback via /run/current-system" color-scheme="dark">
<rect width="820" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">NixOS Functional Store &amp; Atomic System Generations</text>
<rect x="26" y="60" width="176" height="84" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="114" y="88" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">flake.nix + .lock</text>
<text x="114" y="108" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">pinned nixpkgs rev</text>
<text x="114" y="126" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">+ custom OS modules</text>
<rect x="244" y="54" width="252" height="106" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="370" y="80" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">/nix/store (Immutable RO)</text>
<text x="260" y="102" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">/nix/store/a1b2...-linux-6.12</text>
<text x="260" y="120" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">/nix/store/c3d4...-glibc-2.40</text>
<text x="260" y="138" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">/nix/store/e5f6...-nixos-sys-42</text>
<rect x="542" y="56" width="250" height="46" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="667" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#e6edf5">system-41-link (previous)</text>
<rect x="542" y="114" width="250" height="46" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
<text x="667" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#ff7b6b">system-42-link (active)</text>
<rect x="220" y="206" width="440" height="58" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="440" y="230" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">/run/current-system -> symlink flip (atomic)</text>
<text x="440" y="250" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">boot menu lists every generation; rollback flips symlink back with zero re-install</text>
<line x1="202" y1="102" x2="242" y2="102" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="496" y1="90" x2="540" y2="80" stroke="#7fa7d9" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="496" y1="126" x2="540" y2="136" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="667" y1="160" x2="580" y2="204" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">entire OS closure (kernel, initrd, systemd units, /etc, packages) is one pure derivation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="Two-pass cross-toolchain bootstrap showing Pass 1 Binutils and freestanding GCC building Linux headers and target libc, followed by Pass 2 full GCC and libstdc++ isolated from the host OS" color-scheme="dark">
<rect width="820" height="310" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Two-Pass Cross-Toolchain Bootstrap (Breaking Host Contamination)</text>
<rect x="24" y="64" width="136" height="74" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="92" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">1. Binutils Pass 1</text>
<text x="92" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">cross as / ld</text>
<text x="92" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">--with-sysroot</text>
<rect x="184" y="64" width="138" height="74" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="253" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">2. GCC Pass 1</text>
<text x="253" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">C-only, no libc</text>
<text x="253" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">--without-headers</text>
<rect x="346" y="60" width="146" height="82" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="419" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">3. Headers + libc</text>
<text x="419" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">Linux UAPI headers</text>
<text x="419" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#ff7b6b">glibc / musl -> sysroot</text>
<rect x="516" y="64" width="134" height="74" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="583" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">4. GCC Pass 2</text>
<text x="583" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">C + C++ + libstdc++</text>
<text x="583" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">linked to new libc</text>
<rect x="674" y="64" width="122" height="74" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="735" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">5. Clean Chroot</text>
<text x="735" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">zero host /lib</text>
<text x="735" y="128" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9fb0c3">self-hosted OS</text>
<line x1="160" y1="101" x2="182" y2="101" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="322" y1="101" x2="344" y2="101" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="492" y1="101" x2="514" y2="101" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="650" y1="101" x2="672" y2="101" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="130" y="188" width="560" height="58" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="410" y="212" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">Sanity Gate: readelf -l a.out | grep 'program interpreter'</text>
<text x="410" y="232" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">must resolve to your target dynamic linker (ld-linux / ld-musl), never the host's /lib64</text>
<text x="410" y="282" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">bootstrap breaks the circular dependency between compiler and C library cleanly</text>
</svg>

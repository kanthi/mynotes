<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Rust storage architecture with sqlx connection pool, Redis cache-aside, and embedded WAL KV store" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="240" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Rust Backend Storage Architecture: Pooled SQL, Cache-Aside, and Local WAL</text>
  <rect x="30" y="70" width="185" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="122.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Axum Workers</text>
  <text x="122.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Shared Arc&lt;AppState&gt;</text>
  <text x="122.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Bounded concurrency</text>
  <text x="122.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Compile-time SQL</text>
  <rect x="260" y="45" width="245" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="382.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Redis / Valkey Cache</text>
  <text x="382.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Cache-aside + TTL + Singleflight</text>
  <rect x="260" y="130" width="245" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="382.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">sqlx::PgPool (Max Conns)</text>
  <text x="382.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Prepared statements + Tx locks</text>
  <rect x="555" y="70" width="235" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="672.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Persistence Engines</text>
  <text x="672.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">PostgreSQL Primary/Replica</text>
  <text x="672.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">or Embedded redb / WAL</text>
  <text x="672.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">ACID durable commits</text>
  <line x1="215" y1="100" x2="260" y2="80" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">hit?</text>
  <line x1="215" y1="135" x2="260" y2="160" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="236" y="164" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">miss</text>
  <line x1="505" y1="160" x2="555" y2="130" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">SQL</text>
</svg>

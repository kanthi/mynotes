<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" role="img" aria-label="Rust async await poll loop across Tokio executor, pinned Future state machine, OS reactor, and Waker" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="255" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Rust Async/Await Execution: Poll-Driven State Machine and Reactor</text>
  <rect x="30" y="70" width="175" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="117.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Executor (Tokio)</text>
  <text x="117.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Polls ready tasks</text>
  <text x="117.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Work-stealing queue</text>
  <text x="117.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Calls Future::poll()</text>
  <rect x="245" y="70" width="185" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="337.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Pinned Future</text>
  <text x="337.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Compiler state machine</text>
  <text x="337.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Returns Pending or</text>
  <text x="337.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Poll::Ready(val)</text>
  <rect x="470" y="70" width="150" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="545.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">OS Reactor</text>
  <text x="545.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">epoll / kqueue /</text>
  <text x="545.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">io_uring socket</text>
  <text x="545.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">readiness watch</text>
  <rect x="660" y="70" width="130" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="725.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Waker</text>
  <text x="725.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">waker.wake()</text>
  <text x="725.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Re-enqueues task</text>
  <text x="725.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">into Executor</text>
  <line x1="205" y1="110" x2="245" y2="110" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="225" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">poll</text>
  <line x1="430" y1="110" x2="470" y2="110" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">register</text>
  <line x1="620" y1="110" x2="660" y2="110" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">ready</text>
  <path d="M 725 175 L 725 215 L 117 215 L 117 175" fill="none" stroke="#ff7b6b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <text x="420" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">Zero busy-waiting: task sleeps until OS I/O triggers Waker</text>
</svg>

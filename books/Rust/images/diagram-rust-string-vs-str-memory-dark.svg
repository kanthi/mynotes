<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Memory layout comparison of Rust String, borrowed &amp;str slice, and static string literal" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="240" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Memory Layout: String vs. &amp;str vs. &amp;'static str</text>
  <rect x="30" y="65" width="220" height="115" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="140.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">String (Owned, 24 B)</text>
  <text x="140.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">ptr -&gt; Heap buffer</text>
  <text x="140.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">len: 5, cap: 8</text>
  <text x="140.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Growable via push_str</text>
  <text x="140.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Owns heap memory</text>
  <rect x="300" y="65" width="220" height="115" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="410.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">&amp;str (Borrowed, 16 B)</text>
  <text x="410.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">ptr -&gt; UTF-8 slice</text>
  <text x="410.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">len: 5 (no capacity)</text>
  <text x="410.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Points to Heap or Binary</text>
  <text x="410.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero-cost slicing</text>
  <rect x="570" y="65" width="220" height="115" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="680.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Read-Only Binary (.rodata)</text>
  <text x="680.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Literal: "hello"</text>
  <text x="680.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Lives for 'static</text>
  <text x="680.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Baked into executable</text>
  <text x="680.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Never freed</text>
  <line x1="300" y1="145" x2="250" y2="145" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">borrows</text>
  <line x1="520" y1="122" x2="570" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">or literal</text>
  <text x="410" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9fb0c3">Accept &amp;str in function parameters so callers can pass &amp;String, &amp;str slices, or string literals without allocating.</text>
</svg>

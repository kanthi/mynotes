<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Rust lifetime region intersection showing how borrow checker constrains returned references" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="230" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Rust Lifetimes: Compile-Time Region Constraints (Zero Runtime Cost)</text>
  <rect x="30" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="140.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Outer Scope 'a</text>
  <text x="140.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">let s1 = String::from("long");</text>
  <text x="140.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Lives lines 1..10</text>
  <rect x="300" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="410.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Inner Scope 'b</text>
  <text x="410.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">let s2 = String::from("hi");</text>
  <text x="410.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Lives lines 3..6</text>
  <rect x="570" y="65" width="220" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="680.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">longest&lt;'x&gt;(&amp;'x, &amp;'x) -&gt; &amp;'x</text>
  <text x="680.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">'x = intersection('a, 'b)</text>
  <text x="680.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Return ref valid only</text>
  <text x="680.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">while BOTH inputs live</text>
  <line x1="250" y1="117" x2="300" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">'a: 'b</text>
  <line x1="520" y1="117" x2="570" y2="117" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="545" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">constrain</text>
  <text x="410" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9fb0c3">Lifetime annotations never extend how long a value lives—they describe relationships so borrowck rejects dangling pointers.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="Rust observability pipeline using tracing subscriber layers exporting logs, Prometheus metrics, and OTLP spans" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Rust Observability Pipeline: tracing Subscriber Layers to Telemetry Backends</text>
  <rect x="30" y="70" width="195" height="100" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="127.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Instrumented Service</text>
  <text x="127.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">#[tracing::instrument]</text>
  <text x="127.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Structured spans/events</text>
  <text x="127.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">metrics::histogram!</text>
  <rect x="275" y="70" width="225" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="387.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">tracing_subscriber Registry</text>
  <text x="387.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">EnvFilter (RUST_LOG)</text>
  <text x="387.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">JSON fmt Layer -&gt; stdout</text>
  <text x="387.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">OTLP Layer -&gt; Collector</text>
  <rect x="550" y="45" width="240" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="670.0" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Prometheus / VictoriaMetrics</text>
  <text x="670.0" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">RED metrics: Rate, Errors, Duration</text>
  <rect x="550" y="115" width="240" height="55" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="670.0" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Tempo / Jaeger / Loki</text>
  <text x="670.0" y="159" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Distributed traces + JSON logs</text>
  <line x1="225" y1="120" x2="275" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="250" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">spans</text>
  <line x1="500" y1="95" x2="550" y2="72" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">/metrics</text>
  <line x1="500" y1="135" x2="550" y2="142" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="525" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">OTLP</text>
</svg>

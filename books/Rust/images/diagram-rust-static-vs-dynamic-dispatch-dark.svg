<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Comparison of Rust static dispatch monomorphization versus dynamic dispatch vtable fat pointers" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="250" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Static Dispatch (Monomorphization) vs. Dynamic Dispatch (&amp;dyn Trait)</text>
  <rect x="30" y="65" width="360" height="160" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="210.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Static Dispatch: fn draw&lt;T: Shape&gt;(s: &amp;T)</text>
  <text x="210.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Compiler generates draw::&lt;Circle&gt; &amp; draw::&lt;Rect&gt;</text>
  <text x="210.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero indirection; fully inlinable by LLVM</text>
  <text x="210.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Larger binary size if instantiated many times</text>
  <text x="210.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Preferred default for hot loops</text>
  <rect x="430" y="65" width="360" height="160" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="610.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Dynamic Dispatch: fn draw(s: &amp;dyn Shape)</text>
  <text x="610.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Fat pointer (16 B): [data_ptr | vtable_ptr]</text>
  <text x="610.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Single compiled function; indirect call via vtable</text>
  <text x="610.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Enables heterogeneous Vec&lt;Box&lt;dyn Shape&gt;&gt;</text>
  <text x="610.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Requires dyn-compatible (object-safe) trait</text>
</svg>

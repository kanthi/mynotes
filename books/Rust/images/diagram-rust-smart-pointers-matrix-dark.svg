<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" role="img" aria-label="Matrix of Rust smart pointers Box, Rc/RefCell, Arc/Mutex, and Weak" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/>
    </marker>
  </defs>
  <rect width="820" height="215" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Choosing a Rust Smart Pointer by Ownership and Threading Needs</text>
  <rect x="30" y="65" width="170" height="125" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="115.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Box&lt;T&gt;</text>
  <text x="115.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Single owner</text>
  <text x="115.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Heap allocation</text>
  <text x="115.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Recursive types</text>
  <text x="115.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero atomic cost</text>
  <rect x="225" y="65" width="170" height="125" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="310.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Rc&lt;T&gt; / RefCell&lt;T&gt;</text>
  <text x="310.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Single-threaded</text>
  <text x="310.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Shared ownership</text>
  <text x="310.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Interior mutability</text>
  <text x="310.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Runtime borrow check</text>
  <rect x="420" y="65" width="175" height="125" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="507.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Arc&lt;T&gt; / Mutex&lt;T&gt;</text>
  <text x="507.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Multi-threaded</text>
  <text x="507.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Atomic refcount</text>
  <text x="507.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Sync + Send safe</text>
  <text x="507.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Locking mutability</text>
  <rect x="620" y="65" width="170" height="125" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="705.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Weak&lt;T&gt;</text>
  <text x="705.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Non-owning ref</text>
  <text x="705.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Breaks Rc/Arc cycles</text>
  <text x="705.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">.upgrade() -&gt; Option</text>
  <text x="705.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">No memory leaks</text>
</svg>

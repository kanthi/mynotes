<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" role="img" aria-label="Matrix of Rust smart pointers Box, Rc/RefCell, Arc/Mutex, and Weak" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="215" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Choosing a Rust Smart Pointer by Ownership and Threading Needs</text>
  <rect x="30" y="65" width="170" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="115.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Box&lt;T&gt;</text>
  <text x="115.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Single owner</text>
  <text x="115.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Heap allocation</text>
  <text x="115.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Recursive types</text>
  <text x="115.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Zero atomic cost</text>
  <rect x="225" y="65" width="170" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="310.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Rc&lt;T&gt; / RefCell&lt;T&gt;</text>
  <text x="310.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Single-threaded</text>
  <text x="310.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Shared ownership</text>
  <text x="310.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Interior mutability</text>
  <text x="310.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Runtime borrow check</text>
  <rect x="420" y="65" width="175" height="125" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="507.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Arc&lt;T&gt; / Mutex&lt;T&gt;</text>
  <text x="507.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Multi-threaded</text>
  <text x="507.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Atomic refcount</text>
  <text x="507.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Sync + Send safe</text>
  <text x="507.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Locking mutability</text>
  <rect x="620" y="65" width="170" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="705.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Weak&lt;T&gt;</text>
  <text x="705.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Non-owning ref</text>
  <text x="705.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Breaks Rc/Arc cycles</text>
  <text x="705.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">.upgrade() -&gt; Option</text>
  <text x="705.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">No memory leaks</text>
</svg>

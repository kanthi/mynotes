<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Rust Result error propagation with ? operator From conversion, thiserror libraries, and anyhow binaries" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="820" height="200" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Rust Recoverable Error Flow with Result&lt;T, E&gt; and the ? Operator</text>
  <rect x="30" y="70" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="112.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Low-Level Call</text>
  <text x="112.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">fs::read_to_string()</text>
  <text x="112.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Returns Result&lt;String,</text>
  <text x="112.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">io::Error&gt;</text>
  <rect x="235" y="70" width="175" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="322.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">? Desugaring</text>
  <text x="322.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Ok(v) -&gt; unwrap v</text>
  <text x="322.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Err(e) -&gt; return</text>
  <text x="322.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Err(From::from(e))</text>
  <rect x="450" y="70" width="165" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="532.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Domain Error Enum</text>
  <text x="532.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">thiserror #[from]</text>
  <text x="532.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Io(io::Error)</text>
  <text x="532.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Parse(ParseIntError)</text>
  <rect x="655" y="70" width="135" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="722.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">App Boundary</text>
  <text x="722.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">anyhow::Result</text>
  <text x="722.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">.context("...")</text>
  <text x="722.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Log &amp; exit</text>
  <line x1="195" y1="117" x2="235" y2="117" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="215" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">?</text>
  <line x1="410" y1="117" x2="450" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">From</text>
  <line x1="615" y1="117" x2="655" y2="117" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">wrap</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="Distributed resilience patterns showing consistent hash ring, circuit breaker state machine, and jittered retry" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Distributed Resilience: Consistent Hashing, Circuit Breaker, and Backoff</text>
  <rect x="30" y="70" width="215" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="137.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Consistent Hash Ring</text>
  <text x="137.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Virtual nodes (vnodes)</text>
  <text x="137.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Minimal key movement</text>
  <text x="137.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">on node add/remove</text>
  <rect x="295" y="70" width="230" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="410.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Circuit Breaker FSM</text>
  <text x="410.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Closed -&gt; Open (fail&gt;=N)</text>
  <text x="410.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Open -&gt; HalfOpen (cooldown)</text>
  <text x="410.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Fast-fail protects peers</text>
  <rect x="575" y="70" width="215" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="682.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Jittered Backoff</text>
  <text x="682.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Full jitter: rand(0, cap)</text>
  <text x="682.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Prevents thundering herd</text>
  <text x="682.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Respects deadline budget</text>
  <line x1="245" y1="122" x2="295" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">route</text>
  <line x1="525" y1="122" x2="575" y2="122" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="550" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">guard</text>
  <text x="410" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9fb0c3">Never retry without jitter and a global timeout budget—unbounded retries amplify outages.</text>
</svg>

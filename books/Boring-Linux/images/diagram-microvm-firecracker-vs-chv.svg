<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Side-by-side architecture comparison of Firecracker (jailer sandbox, API/VMM/vCPU threads, VirtIO-MMIO, sub-10ms UFFD snapshots) and Cloud Hypervisor (VirtIO-PCI/MSI-X, ACPI hotplug, VFIO GPU passthrough, vhost-user, io_uring, Intel TDX and AMD SEV-SNP)." color-scheme="light">
<title>Production Rust VMMs: Firecracker vs. Cloud Hypervisor</title><desc>Side-by-side architecture comparison of Firecracker (jailer sandbox, API/VMM/vCPU threads, VirtIO-MMIO, sub-10ms UFFD snapshots) and Cloud Hypervisor (VirtIO-PCI/MSI-X, ACPI hotplug, VFIO GPU passthrough, vhost-user, io_uring, Intel TDX and AMD SEV-SNP).</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3b82c4"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#5c6b7a"/>
  </marker>
  <style>
    .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #2a3542; }
    .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14.5px; fill: #5c6b7a; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #2a3542; }
    .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; fill: #5c6b7a; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #3d4f5f; }
    .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #3d4f5f; }
    .canvas { fill: #eef2f7; }
    .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
    .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
    .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
    .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.4; }
    .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.3; }
    .green { fill: #e3f2e8; stroke: #5c9e72; stroke-width: 1.5; }
    .amber { fill: #fdf3dc; stroke: #c49438; stroke-width: 1.5; }
    .rose { fill: #fae5e5; stroke: #c46b6b; stroke-width: 1.5; }
    .link { fill: none; stroke: #3b82c4; stroke-width: 1.8; stroke-linecap: round; }
    .link-dash { fill: none; stroke: #5c6b7a; stroke-width: 1.4; stroke-dasharray: 5 4; stroke-linecap: round; }
  </style>
</defs>
<rect class="canvas" width="960" height="620" rx="16"/>
<rect width="960" height="620" rx="16" fill="url(#grid)"/>
<rect class="frame" x="8" y="8" width="944" height="604" rx="12"/>
<text x="480" y="40" class="title" text-anchor="middle">Production Rust VMMs: Firecracker vs. Cloud Hypervisor</text>
<text x="480" y="66" class="subtitle" text-anchor="middle">Both share rust-vmm crates, but optimize for different cloud isolation and hardware profiles</text>
<rect class="rack" x="30" y="90" width="435" height="482" rx="12"/>
<text x="247" y="118" class="label" text-anchor="middle">Firecracker (~50k LoC Rust)</text>
<text x="247" y="138" class="small" text-anchor="middle">Multi-tenant serverless · &lt;5 MiB RSS · ~125 ms boot</text>
<rect class="rose" x="52" y="154" width="391" height="78" rx="10"/>
<text x="247.5" y="181.6" class="label" text-anchor="middle">Jailer Sandbox (per microVM)</text>
<text x="247.5" y="201.6" class="code-sm" text-anchor="middle">PID/Mount/Net ns · pivot_root + chroot · cgroups v2</text>
<text x="247.5" y="218.6" class="small" text-anchor="middle">3 per-thread seccomp-bpf allowlists (API / VMM / vCPU)</text>
<rect class="amber" x="52" y="246" width="122" height="82" rx="10"/>
<text x="113.0" y="275.6" class="label" text-anchor="middle">API Thread</text>
<text x="113.0" y="295.6" class="small" text-anchor="middle">REST over</text>
<text x="113.0" y="312.6" class="code-sm" text-anchor="middle">Unix sock</text>
<rect class="amber" x="186" y="246" width="123" height="82" rx="10"/>
<text x="247.5" y="275.6" class="label" text-anchor="middle">VMM Thread</text>
<text x="247.5" y="295.6" class="small" text-anchor="middle">Single epoll</text>
<text x="247.5" y="312.6" class="code-sm" text-anchor="middle">Rate limits</text>
<rect class="green" x="321" y="246" width="122" height="82" rx="10"/>
<text x="382.0" y="275.6" class="label" text-anchor="middle">vCPU × N</text>
<text x="382.0" y="295.6" class="code-sm" text-anchor="middle">KVM_RUN</text>
<text x="382.0" y="312.6" class="small" text-anchor="middle">No SMT</text>
<rect class="node" x="52" y="342" width="391" height="102" rx="10"/>
<text x="247.5" y="373.1" class="label" text-anchor="middle">Minimal Device Surface (No PCI / No ACPI on x86)</text>
<text x="247.5" y="393.1" class="code-sm" text-anchor="middle">VirtIO-MMIO: net, block, vsock (Unix mux), balloon, rng</text>
<text x="247.5" y="410.1" class="small" text-anchor="middle">16550A UART + minimal i8042 reset only</text>
<text x="247.5" y="427.1" class="small" text-anchor="middle">Direct vmlinux / PVH Linux boot only</text>
<rect class="bubble" x="52" y="458" width="391" height="96" rx="10"/>
<text x="247.5" y="486.1" class="label" text-anchor="middle">Sub-10 ms Snapshots</text>
<text x="247.5" y="506.1" class="code-sm" text-anchor="middle">vmstate + Full/Diff mem file (dirty log)</text>
<text x="247.5" y="523.1" class="small" text-anchor="middle">Lazy mmap / userfaultfd (UFFD) demand restore</text>
<text x="247.5" y="540.1" class="small" text-anchor="middle">VMGENID + virtio-rng reseed per clone</text>
<rect class="rack" x="495" y="90" width="435" height="482" rx="12"/>
<text x="712" y="118" class="label" text-anchor="middle">Cloud Hypervisor (~100k+ LoC Rust)</text>
<text x="712" y="138" class="small" text-anchor="middle">Kata Containers · Cloud VMs · GPU/VFIO · Confidential VMs</text>
<rect class="amber" x="517" y="154" width="391" height="78" rx="10"/>
<text x="712.5" y="181.6" class="label" text-anchor="middle">Control &amp;amp; Hypervisor Abstraction</text>
<text x="712.5" y="201.6" class="code-sm" text-anchor="middle">OpenAPI over Unix socket · ch-remote live resize</text>
<text x="712.5" y="218.6" class="small" text-anchor="middle">Supports Linux KVM &amp;amp; Microsoft MSHV backends</text>
<rect class="node" x="517" y="246" width="391" height="96" rx="10"/>
<text x="712.5" y="274.1" class="label" text-anchor="middle">Modern PCIe + Minimal ACPI (No Legacy PC)</text>
<text x="712.5" y="294.1" class="code-sm" text-anchor="middle">VirtIO-PCI + MSI-X (multi-queue net &amp;amp; blk)</text>
<text x="712.5" y="311.1" class="small" text-anchor="middle">ACPI MADT/MCFG/SRAT/GED → CPU &amp;amp; virtio-mem hotplug</text>
<text x="712.5" y="328.1" class="small" text-anchor="middle">Boot: Direct PVH / bzImage + UEFI (Linux &amp;amp; Windows)</text>
<rect class="green" x="517" y="356" width="391" height="96" rx="10"/>
<text x="712.5" y="384.1" class="label" text-anchor="middle">High-Performance I/O &amp;amp; Hardware Passthrough</text>
<text x="712.5" y="404.1" class="code-sm" text-anchor="middle">VFIO + virtio-iommu: GPUs, SR-IOV NICs, NVMe</text>
<text x="712.5" y="421.1" class="code-sm" text-anchor="middle">vhost-user: virtio-fs (virtiofsd), DPDK, SPDK</text>
<text x="712.5" y="438.1" class="small" text-anchor="middle">Native io_uring block engine + live migration</text>
<rect class="bubble" x="517" y="466" width="391" height="88" rx="10"/>
<text x="712.5" y="498.6" class="label" text-anchor="middle">Security &amp;amp; Confidential Computing</text>
<text x="712.5" y="518.6" class="small" text-anchor="middle">Per-thread seccomp-bpf + vhost-user isolation</text>
<text x="712.5" y="535.6" class="code-sm" text-anchor="middle">Intel TDX &amp;amp; AMD SEV-SNP encrypted attested VMs</text>
<text x="480" y="598" class="subtitle" text-anchor="middle">Choose Firecracker for extreme serverless density/minimalism; Cloud Hypervisor for PCI/hotplug/VFIO/TDX.</text>
</svg>
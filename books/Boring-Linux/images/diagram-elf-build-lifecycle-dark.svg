<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Complete ELF build lifecycle from C source through compiler, assembler, linker, and runtime loader" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">From Source to Process: The Complete ELF Compilation, Linking, and Load Lifecycle</text>
  <rect x="25" y="70" width="130" height="100" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="90.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">hello.c</text>
  <text x="90.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Preprocessor</text>
  <text x="90.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">C source</text>
  <rect x="185" y="70" width="130" height="100" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="250.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">hello.s / .o</text>
  <text x="250.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">ET_REL object</text>
  <text x="250.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Unresolved syms</text>
  <rect x="345" y="70" width="140" height="100" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="415.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Linker (ld/lld)</text>
  <text x="415.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Merges sections</text>
  <text x="415.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Applies relocs</text>
  <rect x="515" y="70" width="130" height="100" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="580.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">ELF Binary</text>
  <text x="580.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">ET_EXEC / ET_DYN</text>
  <text x="580.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">PT_LOAD + PT_INTERP</text>
  <rect x="675" y="70" width="120" height="100" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="735.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Running PID</text>
  <text x="735.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">execve + ld.so</text>
  <text x="735.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">_start -&gt; main</text>
  <line x1="155" y1="120" x2="185" y2="120" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">cc1/as</text>
  <line x1="315" y1="120" x2="345" y2="120" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
  <line x1="485" y1="120" x2="515" y2="120" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="500" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b"></text>
  <line x1="645" y1="120" x2="675" y2="120" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">execve</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="ELF dual view comparing Linking View with Sections versus Execution View with Segments" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="260" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">The ELF Dual View: Linking Representation (Sections) vs. Execution View (Segments)</text>
  <rect x="30" y="60" width="355" height="170" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="207.5" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Linking View (Relocatable .o / Linker)</text>
  <text x="207.5" y="104" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">ELF Header (e_shoff -&gt; Section Header Table)</text>
  <text x="207.5" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Section 1: .text (executable code)</text>
  <text x="207.5" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Section 2: .rodata (constants)</text>
  <text x="207.5" y="152" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Section 3: .data / .bss / .symtab / .rela.text</text>
  <text x="207.5" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Section Header Table (required for ld)</text>
  <rect x="435" y="60" width="355" height="170" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="612.5" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Execution View (Executable / .so / Kernel)</text>
  <text x="612.5" y="104" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">ELF Header (e_phoff -&gt; Program Header Table)</text>
  <text x="612.5" y="120" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Segment 1: PT_LOAD (PF_R | PF_X) -&gt; .text</text>
  <text x="612.5" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Segment 2: PT_LOAD (PF_R | PF_W) -&gt; .data/.bss</text>
  <text x="612.5" y="152" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Segment 3: PT_DYNAMIC / PT_INTERP / PT_GNU_RELRO</text>
  <text x="612.5" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Section Header Table optional at runtime!</text>
  <line x1="385" y1="145" x2="435" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="410" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">ld links</text>
</svg>

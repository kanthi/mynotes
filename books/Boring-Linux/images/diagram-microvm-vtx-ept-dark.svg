<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Left panel illustrates VMX Root and Non-Root transitions and the six regions of the 4 KiB VMCS. Right panel illustrates two-dimensional GVA to GPA to HPA translation via guest page tables and Intel EPT." color-scheme="dark">
<title>Intel VT-x Execution Model and Two-Dimensional EPT Paging</title><desc>Left panel illustrates VMX Root and Non-Root transitions and the six regions of the 4 KiB VMCS. Right panel illustrates two-dimensional GVA to GPA to HPA translation via guest page tables and Intel EPT.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#60a5fa"/>
  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9aa8b8"/>
  </marker>
  <style>
    .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #e8eef5; }
    .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14.5px; fill: #9aa8b8; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #e8eef5; }
    .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; fill: #9aa8b8; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #c5d0dc; }
    .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #c5d0dc; }
    .canvas { fill: #1c2129; }
    .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
    .rack { fill: #232a36; stroke: #566578; stroke-width: 1.4; }
    .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
    .bay { fill: #2a3140; stroke: #5a6b7d; stroke-width: 1.4; }
    .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.3; }
    .green { fill: #1f3328; stroke: #4e8f65; stroke-width: 1.5; }
    .amber { fill: #382f1e; stroke: #b88a32; stroke-width: 1.5; }
    .rose { fill: #3a2326; stroke: #b85c62; stroke-width: 1.5; }
    .link { fill: none; stroke: #60a5fa; stroke-width: 1.8; stroke-linecap: round; }
    .link-dash { fill: none; stroke: #9aa8b8; stroke-width: 1.4; stroke-dasharray: 5 4; stroke-linecap: round; }
  </style>
</defs>
<rect class="canvas" width="960" height="620" rx="16"/>
<rect width="960" height="620" rx="16" fill="url(#grid)"/>
<rect class="frame" x="8" y="8" width="944" height="604" rx="12"/>
<text x="480" y="40" class="title" text-anchor="middle">Intel VT-x Execution Model and Two-Dimensional EPT Paging</text>
<text x="480" y="66" class="subtitle" text-anchor="middle">Orthogonal VMX Root / Non-Root modes (left) and 2D GVA → GPA → HPA translation (right)</text>
<rect class="rack" x="30" y="90" width="435" height="482" rx="12"/>
<text x="247" y="118" class="label" text-anchor="middle">VT-x Transitions &amp; 4 KiB VMCS</text>
<rect class="node" x="54" y="134" width="175" height="110" rx="10"/>
<text x="141.5" y="169.2" class="label" text-anchor="middle">VMX Root</text>
<text x="141.5" y="191.2" class="small" text-anchor="middle">Ring 3: VMM</text>
<text x="141.5" y="209.2" class="small" text-anchor="middle">Ring 0: KVM</text>
<text x="141.5" y="227.2" class="code-sm" text-anchor="middle">(kvm_intel.ko)</text>
<rect class="green" x="265" y="134" width="175" height="110" rx="10"/>
<text x="352.5" y="169.2" class="label" text-anchor="middle">VMX Non-Root</text>
<text x="352.5" y="191.2" class="small" text-anchor="middle">Ring 3: Guest App</text>
<text x="352.5" y="209.2" class="small" text-anchor="middle">Ring 0: Guest OS</text>
<text x="352.5" y="227.2" class="code-sm" text-anchor="middle">(Unmodified)</text>
<path class="link" d="M229 168 H265" marker-end="url(#arrow)"/>
<text x="247" y="159" class="code-sm" text-anchor="middle">VMLAUNCH</text>
<path class="link" d="M265 212 H229" marker-end="url(#arrow)"/>
<text x="247" y="232" class="code-sm" text-anchor="middle">VM-Exit</text>
<rect class="amber" x="54" y="270" width="386" height="282" rx="10"/>
<text x="68" y="351.2" class="label" text-anchor="start">VMCS (accessed via VMREAD / VMWRITE)</text>
<text x="68" y="373.2" class="code-sm" text-anchor="start">1. Guest-State Area (CR0/3/4, RIP, RSP, segs, EFER)</text>
<text x="68" y="392.2" class="code-sm" text-anchor="start">2. Host-State Area (host CR3, RSP, RIP handler)</text>
<text x="68" y="411.2" class="code-sm" text-anchor="start">3. VM-Execution Controls (EPT, VPID, bitmaps)</text>
<text x="68" y="430.2" class="code-sm" text-anchor="start">4. VM-Exit Controls (64-bit host, ack IRQ)</text>
<text x="68" y="449.2" class="code-sm" text-anchor="start">5. VM-Entry Controls (IA-32e, IRQ injection)</text>
<text x="68" y="468.2" class="code-sm" text-anchor="start">6. VM-Exit Info (Exit Reason, Qualification, GPA)</text>
<text x="68" y="487.2" class="small" text-anchor="start">Note: GPRs (RAX-R15) saved by KVM asm trampoline</text>
<rect class="rack" x="495" y="90" width="435" height="482" rx="12"/>
<text x="712" y="118" class="label" text-anchor="middle">Two-Dimensional Address Translation</text>
<rect class="green" x="522" y="134" width="380" height="62" rx="10"/>
<text x="712.0" y="161.9" class="label" text-anchor="middle">1. Guest Virtual Address (GVA)</text>
<text x="712.0" y="182.9" class="code-sm" text-anchor="middle">Guest CR3 → PML4 → PDPT → PD → PT (4 levels)</text>
<path class="link" d="M712 196 V228" marker-end="url(#arrow)"/>
<text x="726" y="218" class="code-sm" text-anchor="start">each level yields a GPA</text>
<rect class="amber" x="522" y="232" width="380" height="62" rx="10"/>
<text x="712.0" y="259.9" class="label" text-anchor="middle">2. Guest Physical Address (GPA)</text>
<text x="712.0" y="280.9" class="small" text-anchor="middle">What guest Linux thinks is physical DRAM</text>
<path class="link" d="M712 294 V326" marker-end="url(#arrow)"/>
<text x="726" y="316" class="code-sm" text-anchor="start">hardware EPTP walk</text>
<rect class="node" x="522" y="330" width="380" height="74" rx="10"/>
<text x="712.0" y="355.4" class="label" text-anchor="middle">3. Extended Page Tables (EPT)</text>
<text x="712.0" y="376.4" class="code-sm" text-anchor="middle">EPT PML4 → EPT PDPT → EPT PD → EPT PT</text>
<text x="712.0" y="394.4" class="small" text-anchor="middle">Miss → Exit 48 (EPT Violation) or Exit 49 (MMIO)</text>
<path class="link" d="M712 404 V434" marker-end="url(#arrow)"/>
<rect class="bay" x="522" y="438" width="380" height="56" rx="10"/>
<text x="712.0" y="462.9" class="label" text-anchor="middle">4. Host Physical Address (HPA)</text>
<text x="712.0" y="483.9" class="small" text-anchor="middle">Actual DRAM frame on host motherboard</text>
<rect class="bubble" x="522" y="506" width="380" height="46" rx="10"/>
<text x="712.0" y="526.0" class="code" text-anchor="middle">Cold TLB miss = 4 + (5 × 4) = 24 mem reads</text>
<text x="712.0" y="544.0" class="small" text-anchor="middle">2 MiB / 1 GiB hugepages + VPID slash walk cost</text>
<text x="480" y="598" class="subtitle" text-anchor="middle">With EPT + VPID enabled, guest CR3 switches and page faults execute natively without VM-Exits.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="ELF Thread-Local Storage access models comparing Local-Exec, Initial-Exec, Local-Dynamic, and General-Dynamic" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">ELF Thread-Local Storage (TLS): Thread Pointer &amp; the Four Access Models</text>
  <rect x="25" y="65" width="175" height="125" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="112.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Local-Exec (LE)</text>
  <text x="112.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Main exec only</text>
  <text x="112.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Direct %fs:tpoff</text>
  <text x="112.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Fastest (1 insn)</text>
  <text x="112.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Static offset</text>
  <rect x="225" y="65" width="175" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="312.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Initial-Exec (IE)</text>
  <text x="312.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Startup .so libs</text>
  <text x="312.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">GOT holds tpoff</text>
  <text x="312.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">1 load + %fs add</text>
  <text x="312.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">No dlopen()</text>
  <rect x="425" y="65" width="175" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="512.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Local-Dynamic (LD)</text>
  <text x="512.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">dlopen() module</text>
  <text x="512.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">1 __tls_get_addr</text>
  <text x="512.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">for module base</text>
  <text x="512.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">+ local offsets</text>
  <rect x="625" y="65" width="170" height="125" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="710.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">General-Dynamic (GD)</text>
  <text x="710.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Most general PIC</text>
  <text x="710.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Calls __tls_get_addr</text>
  <text x="710.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">or TLSDESC per var</text>
  <text x="710.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Works everywhere</text>
</svg>

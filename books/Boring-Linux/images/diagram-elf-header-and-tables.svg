<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Elf64_Ehdr header fields pointing to Program Header Table, Section Header Table, and .shstrtab" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="240" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">ELF64 Header (64 Bytes): Pointers into Program and Section Header Tables</text>
  <rect x="30" y="65" width="225" height="135" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="142.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Elf64_Ehdr (Offset 0x0)</text>
  <text x="142.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_ident[16]: 7f 45 4c 46 ...</text>
  <text x="142.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_type / e_machine / e_entry</text>
  <text x="142.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_phoff, e_phentsize, e_phnum</text>
  <text x="142.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_shoff, e_shentsize, e_shnum</text>
  <text x="142.5" y="173" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_shstrndx -&gt; .shstrtab</text>
  <rect x="310" y="55" width="225" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="422.5" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Program Header Table</text>
  <text x="422.5" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_phnum x Elf64_Phdr (56 B)</text>
  <rect x="310" y="140" width="225" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="422.5" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Section Header Table</text>
  <text x="422.5" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">e_shnum x Elf64_Shdr (64 B)</text>
  <rect x="585" y="55" width="205" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="687.5" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Mapped Segments</text>
  <text x="687.5" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">PT_LOAD, PT_DYNAMIC, PT_NOTE</text>
  <rect x="585" y="140" width="205" height="65" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="687.5" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Sections + .shstrtab</text>
  <text x="687.5" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">sh_name indexes .shstrtab</text>
  <line x1="255" y1="100" x2="310" y2="88" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">e_phoff</text>
  <line x1="255" y1="160" x2="310" y2="172" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">e_shoff</text>
  <line x1="535" y1="88" x2="585" y2="88" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">p_offset</text>
  <line x1="535" y1="172" x2="585" y2="172" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="560" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">sh_offset</text>
</svg>

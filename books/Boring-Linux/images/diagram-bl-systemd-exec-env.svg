<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="systemd service execution environment, cgroup isolation, and exit status mapping" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">systemd Service Execution Environment and Exit Status Contract</text>
  <rect x="30" y="70" width="210" height="105" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="135.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Unit Configuration</text>
  <text x="135.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">EnvironmentFile=</text>
  <text x="135.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">WorkingDirectory=</text>
  <text x="135.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">DynamicUser=yes</text>
  <rect x="295" y="70" width="230" height="105" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="410.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Supervised Process</text>
  <text x="410.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Dedicated cgroup v2</text>
  <text x="410.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Clean $PATH &amp; limits</text>
  <text x="410.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Logs -&gt; journald</text>
  <rect x="580" y="70" width="210" height="105" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="685.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Exit Classification</text>
  <text x="685.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">0 -&gt; Clean success</text>
  <text x="685.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">1-255 -&gt; Failure</text>
  <text x="685.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">128+N -&gt; Signal N</text>
  <line x1="240" y1="122" x2="295" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="267" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">spawn</text>
  <line x1="525" y1="122" x2="580" y2="122" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="552" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">waitpid</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Multi-architecture Nix flake fan-out across x86_64-linux, aarch64-linux, and aarch64-darwin" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Multi-Architecture Nix Flake: forAllSystems Output Matrix</text>
  <rect x="30" y="70" width="205" height="105" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="132.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">flake.nix + flake.lock</text>
  <text x="132.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Single pinned nixpkgs</text>
  <text x="132.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Shared overlays &amp; lib</text>
  <rect x="295" y="45" width="225" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="407.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">x86_64-linux / aarch64-linux</text>
  <text x="407.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">packages, devShells, checks</text>
  <rect x="295" y="125" width="225" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="407.5" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">aarch64-darwin (macOS)</text>
  <text x="407.5" y="169" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">devShells, formatter, CLI</text>
  <rect x="580" y="70" width="210" height="105" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="685.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Unified CI Matrix</text>
  <text x="685.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">nix flake check</text>
  <text x="685.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Per-arch binary cache</text>
  <text x="685.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Identical tooling</text>
  <line x1="235" y1="100" x2="295" y2="72" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="263" y="75" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">linux</text>
  <line x1="235" y1="140" x2="295" y2="152" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="263" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">darwin</text>
  <line x1="520" y1="72" x2="580" y2="105" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="550" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>
  <line x1="520" y1="152" x2="580" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="550" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>

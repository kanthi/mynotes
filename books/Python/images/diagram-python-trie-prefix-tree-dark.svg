<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Trie prefix tree showing shared character edges for cat, car, and card" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="240" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Trie (Prefix Tree): Shared Prefix Edges for O(L) Autocomplete</text>
  <rect x="30" y="85" width="110" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="85.0" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Root ''</text>
  <text x="85.0" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">children: {c}</text>
  <rect x="185" y="85" width="110" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="240.0" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">'c'</text>
  <text x="240.0" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">children: {a}</text>
  <rect x="340" y="85" width="110" height="65" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="395.0" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">'a'</text>
  <text x="395.0" y="129" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">children: {r,t}</text>
  <rect x="500" y="45" width="125" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="562.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">'t' [END]</text>
  <text x="562.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">word: 'cat'</text>
  <rect x="500" y="130" width="125" height="65" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="562.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">'r' [END]</text>
  <text x="562.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">word: 'car'</text>
  <rect x="670" y="130" width="125" height="65" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="732.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">'d' [END]</text>
  <text x="732.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">word: 'card'</text>
  <line x1="140" y1="117" x2="185" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">c</text>
  <line x1="295" y1="117" x2="340" y2="117" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="317" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">a</text>
  <line x1="450" y1="102" x2="500" y2="77" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">t</text>
  <line x1="450" y1="132" x2="500" y2="160" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="472" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">r</text>
  <line x1="625" y1="162" x2="670" y2="162" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="647" y="152" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">d</text>
  <text x="410" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9fb0c3">Lookup &amp; prefix search take O(L) time (key length), independent of total dictionary size N.</text>
</svg>

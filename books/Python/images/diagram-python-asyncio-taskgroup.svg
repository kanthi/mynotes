<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Python asyncio TaskGroup structured concurrency and cancellation propagation" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="240" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Structured Concurrency with asyncio.TaskGroup (Python 3.11+)</text>
  <rect x="30" y="70" width="200" height="110" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="130.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">async with TaskGroup()</text>
  <text x="130.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Owner scope block</text>
  <text x="130.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Waits for ALL tasks</text>
  <text x="130.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">before exiting block</text>
  <rect x="290" y="50" width="220" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="400.0" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Task A (fetch_user)</text>
  <text x="400.0" y="94" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Running -&gt; Cancelled</text>
  <text x="400.0" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">if sibling raises!</text>
  <rect x="290" y="130" width="220" height="65" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="400.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Task B (fetch_orders)</text>
  <text x="400.0" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Raises ValueError</text>
  <text x="400.0" y="190" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Triggers group cancel</text>
  <rect x="570" y="70" width="220" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="680.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">ExceptionGroup</text>
  <text x="680.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Aggregates failures</text>
  <text x="680.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Handle selectively with</text>
  <text x="680.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">except* ValueError:</text>
  <line x1="230" y1="105" x2="290" y2="82" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">spawn</text>
  <line x1="230" y1="135" x2="290" y2="160" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">spawn</text>
  <line x1="510" y1="160" x2="570" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="540" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">bubble</text>
</svg>

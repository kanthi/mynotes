<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Python asyncio TaskGroup structured concurrency and cancellation propagation" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="240" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Structured Concurrency with asyncio.TaskGroup (Python 3.11+)</text>
  <rect x="30" y="70" width="200" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="130.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">async with TaskGroup()</text>
  <text x="130.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Owner scope block</text>
  <text x="130.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Waits for ALL tasks</text>
  <text x="130.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">before exiting block</text>
  <rect x="290" y="50" width="220" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="400.0" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Task A (fetch_user)</text>
  <text x="400.0" y="94" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Running -&gt; Cancelled</text>
  <text x="400.0" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">if sibling raises!</text>
  <rect x="290" y="130" width="220" height="65" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="400.0" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Task B (fetch_orders)</text>
  <text x="400.0" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Raises ValueError</text>
  <text x="400.0" y="190" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Triggers group cancel</text>
  <rect x="570" y="70" width="220" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="680.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">ExceptionGroup</text>
  <text x="680.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Aggregates failures</text>
  <text x="680.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Handle selectively with</text>
  <text x="680.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">except* ValueError:</text>
  <line x1="230" y1="105" x2="290" y2="82" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">spawn</text>
  <line x1="230" y1="135" x2="290" y2="160" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">spawn</text>
  <line x1="510" y1="160" x2="570" y2="130" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="540" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">bubble</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="CPython name bindings, PyObject reference counting, and cyclic garbage collector" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">CPython Memory Model: Name Bindings, PyObject Refcounts, and Cyclic GC</text>
  <rect x="30" y="65" width="200" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="130.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Namespace Frame</text>
  <text x="130.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">a -&gt; 0x7f10</text>
  <text x="130.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">b -&gt; 0x7f10</text>
  <text x="130.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">(names are pointers)</text>
  <rect x="285" y="65" width="230" height="110" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="400.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">PyObject (0x7f10)</text>
  <text x="400.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">ob_refcnt: 2</text>
  <text x="400.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">ob_type: list</text>
  <text x="400.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">payload: [1, 2, 3]</text>
  <rect x="570" y="65" width="220" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="680.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Reclamation Path</text>
  <text x="680.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">refcnt == 0 -&gt; instant free</text>
  <text x="680.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Reference cycles -&gt;</text>
  <text x="680.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Generational GC (0/1/2)</text>
  <line x1="230" y1="120" x2="285" y2="120" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="257" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">bind</text>
  <line x1="515" y1="120" x2="570" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="542" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">del/gc</text>
  <text x="410" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7d">Assignment never copies objects; it binds a name and increments ob_refcnt.</text>
</svg>

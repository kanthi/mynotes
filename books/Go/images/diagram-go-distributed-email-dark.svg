<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Distributed email service architecture with SMTP submission/MTA, spam and DKIM/SPF checks, durable outbound retry queue, sharded mailbox metadata store, object storage for MIME attachments, and IMAP/API sync." color-scheme="dark">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#e2e8f0}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#e2e8f0}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#94a3b8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#e2e8f0}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#94a3b8}
</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text class="title" x="20" y="28">Distributed Email Service: SMTP/IMAP, Queue &amp; Sharded Mailboxes</text>
<text class="sub" x="20" y="45">Outbound mail enters durable retry queues while inbound SMTP stores deduplicated MIME bodies in object storage and headers in sharded SQL</text>
<rect x="20" y="72" width="155" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="97.5" y="100.5" text-anchor="middle">Mail Client / Web</text>
<text class="mono-m" x="97.5" y="115.0" text-anchor="middle">SMTP Submit (587)</text>
<text class="note" x="97.5" y="129.5" text-anchor="middle">IMAP / HTTP Sync</text>
<rect x="215" y="72" width="185" height="78" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="307.5" y="100.5" text-anchor="middle">SMTP MTA &amp; Policy</text>
<text class="mono-m" x="307.5" y="115.0" text-anchor="middle">SPF · DKIM · DMARC</text>
<text class="note" x="307.5" y="129.5" text-anchor="middle">Spam &amp; size limits</text>
<rect x="440" y="72" width="215" height="78" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="547.5" y="100.5" text-anchor="middle">Durable Mail Queue</text>
<text class="note" x="547.5" y="115.0" text-anchor="middle">4xx -&gt; exp backoff</text>
<text class="mono-m" x="547.5" y="129.5" text-anchor="middle">5xx -&gt; bounce DSN</text>
<rect x="695" y="72" width="245" height="78" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="817.5" y="100.5" text-anchor="middle">Mailbox Store (Sharded)</text>
<text class="mono-m" x="817.5" y="115.0" text-anchor="middle">folders · flags · UIDs</text>
<text class="note" x="817.5" y="129.5" text-anchor="middle">Per-mailbox monotonic seq</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Object Storage (MIME / Blobs)</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Immutable raw RFC 5322 + files</text>
<text class="mono-m" x="162.5" y="270.5" text-anchor="middle">Content-addressed dedupe</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Search Index (Per-User)</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">Async indexed from mailbox log</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Subject, sender, body tokens</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Remote MX Delivery</text>
<text class="mono-m" x="805.0" y="256.0" text-anchor="middle">DNS MX lookup + STARTTLS</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Domain concurrency throttle</text>
<line x1="175" y1="111" x2="215" y2="111" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="400" y1="111" x2="440" y2="111" stroke="#fbbf24" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="420.0" y="103.0" text-anchor="middle">enqueue</text>
<line x1="655" y1="111" x2="695" y2="111" stroke="#4ade80" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="675.0" y="103.0" text-anchor="middle">local</text>
<line x1="307" y1="150" x2="200" y2="212" stroke="#94a3b8" stroke-width="1.55" marker-end="url(#ah-slate)"/>
<text class="note" x="230.0" y="178.0" text-anchor="middle">store MIME</text>
<line x1="755" y1="150" x2="560" y2="212" stroke="#60a5fa" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-blue)"/>
<text class="note" x="640.0" y="178.0" text-anchor="middle">index</text>
<line x1="580" y1="150" x2="755" y2="212" stroke="#f87171" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="695.0" y="178.0" text-anchor="middle">outbound MX</text>
</svg>

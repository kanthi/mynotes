<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-label="Enterprise real-time team messaging and collaboration hub architecture with sharded WebSocket gateways, monotonic per-channel message sequencer, Redis Pub/Sub routing, attachment DLP quarantine, and eDiscovery retention." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.sec{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:700;fill:#1f2933}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Enterprise Team Messaging &amp; Collaboration Hub (Slack / Teams Style)</text>
<text class="sub" x="20" y="45">Sharded WebSocket gateways, per-channel monotonic sequence IDs, ephemeral presence, and DLP attachment scanning</text>
<rect x="20" y="74" width="155" height="84" rx="7" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="97.5" y="106.0" text-anchor="middle">Desktop / Mobile</text>
<text class="note" x="97.5" y="120.0" text-anchor="middle">Persistent WS</text>
<text class="mono-m" x="97.5" y="134.0" text-anchor="middle">Sync cursor: seq</text>
<rect x="210" y="74" width="185" height="84" rx="7" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.7"/>
<text class="lbl" x="302.5" y="106.0" text-anchor="middle">Sharded WS Gateways</text>
<text class="note" x="302.5" y="120.0" text-anchor="middle">100k conns / Go pod</text>
<text class="mono-m" x="302.5" y="134.0" text-anchor="middle">Bounded send chan</text>
<rect x="430" y="74" width="210" height="84" rx="7" fill="#e3f6e8" stroke="#15803d" stroke-width="1.9"/>
<text class="lbl" x="535.0" y="106.0" text-anchor="middle">Message &amp;amp; Thread Svc ★</text>
<text class="mono-m" x="535.0" y="120.0" text-anchor="middle">Atomic channel_seq++</text>
<text class="note" x="535.0" y="134.0" text-anchor="middle">Idempotent client_msg_id</text>
<rect x="675" y="74" width="180" height="84" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="765.0" y="106.0" text-anchor="middle">Redis Pub/Sub Router</text>
<text class="mono-m" x="765.0" y="120.0" text-anchor="middle">chan:{workspace}:{ch}</text>
<text class="note" x="765.0" y="134.0" text-anchor="middle">Typing · Presence TTL</text>
<rect x="890" y="74" width="170" height="84" rx="7" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="975.0" y="106.0" text-anchor="middle">Peer WS Gateways</text>
<text class="note" x="975.0" y="120.0" text-anchor="middle">Push to online</text>
<text class="mono-m" x="975.0" y="134.0" text-anchor="middle">Push/APNs if offline</text>
<rect x="20" y="214" width="240" height="94" rx="7" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="140.0" y="244.0" text-anchor="middle">Sharded PostgreSQL (by workspace)</text>
<text class="mono-m" x="140.0" y="258.0" text-anchor="middle">channels · messages · threads</text>
<text class="mono-m" x="140.0" y="272.0" text-anchor="middle">channel_cursors(user_id, last_seq)</text>
<text class="note" x="140.0" y="286.0" text-anchor="middle">Unread badge = max_seq - last_seq</text>
<rect x="295" y="214" width="240" height="94" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="415.0" y="244.0" text-anchor="middle">Attachment DLP &amp;amp; AV Pipeline</text>
<text class="note" x="415.0" y="258.0" text-anchor="middle">Upload -&gt; Quarantine bucket</text>
<text class="mono-m" x="415.0" y="272.0" text-anchor="middle">Scan PII/Malware -&gt; Clean S3</text>
<text class="note" x="415.0" y="286.0" text-anchor="middle">Zero unverified downloads</text>
<rect x="570" y="214" width="235" height="94" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="687.5" y="244.0" text-anchor="middle">Kafka Event Bus</text>
<text class="mono-m" x="687.5" y="258.0" text-anchor="middle">channel-messages · audit-events</text>
<text class="note" x="687.5" y="272.0" text-anchor="middle">Search indexer · Bot webhooks</text>
<text class="note" x="687.5" y="286.0" text-anchor="middle">Partition key = channel_id</text>
<rect x="840" y="214" width="220" height="94" rx="7" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="950.0" y="244.0" text-anchor="middle">Retention &amp;amp; eDiscovery</text>
<text class="note" x="950.0" y="258.0" text-anchor="middle">Legal Hold blocks purge</text>
<text class="mono-m" x="950.0" y="272.0" text-anchor="middle">Export workspace JSONL/ZIP</text>
<text class="note" x="950.0" y="286.0" text-anchor="middle">Immutable compliance log</text>
<rect x="20" y="344" width="1040" height="114" rx="7" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="540.0" y="384.0" text-anchor="middle">Key Real-Time &amp;amp; Reliability Invariants</text>
<text class="note" x="540.0" y="398.0" text-anchor="middle">1. Strict per-channel ordering: every message gets a gap-free monotonic channel_seq inside a DB transaction; reconnects pull GET /messages?after_seq=N.</text>
<text class="note" x="540.0" y="412.0" text-anchor="middle">2. Ephemeral vs. durable split: typing indicators and online presence live ONLY in Redis TTL + Pub/Sub and never touch PostgreSQL.</text>
<text class="note" x="540.0" y="426.0" text-anchor="middle">3. Slow-client protection: each WS connection has a bounded Go channel (e.g. 64 frames); overflow disconnects the client so it reconnects cleanly via after_seq.</text>
<line x1="175" y1="116" x2="210" y2="116" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<line x1="395" y1="116" x2="430" y2="116" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="412.0" y="108.0" text-anchor="middle">send</text>
<line x1="640" y1="116" x2="675" y2="116" stroke="#dc2626" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="657.0" y="108.0" text-anchor="middle">pub</text>
<line x1="855" y1="116" x2="890" y2="116" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="872.0" y="108.0" text-anchor="middle">fanout</text>
<line x1="480" y1="158" x2="220" y2="214" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="325.0" y="182.0" text-anchor="middle">TX write</text>
<line x1="535" y1="158" x2="440" y2="214" stroke="#dc2626" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="470.0" y="192.0" text-anchor="middle">files</text>
<line x1="590" y1="158" x2="660" y2="214" stroke="#b45309" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
<text class="note" x="642.0" y="182.0" text-anchor="middle">outbox</text>
<line x1="805" y1="261" x2="840" y2="261" stroke="#64748b" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-slate)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Comparison of Unary, Server Streaming, Client Streaming, and Bi-Directional Streaming RPCs multiplexed over a single HTTP/2 TCP connection." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Four gRPC Streaming Patterns over HTTP/2</text>
<rect x="20" y="50" width="325" height="95" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="182.5" y="85.5" text-anchor="middle">1. Unary RPC</text>
<text class="l" x="182.5" y="101.5" text-anchor="middle">Client -&gt; 1 Req -&gt; Server -&gt; 1 Resp</text>
<text class="l" x="182.5" y="117.5" text-anchor="middle">e.g. GetTodo / CreateTodo</text>
<rect x="375" y="50" width="325" height="95" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="537.5" y="85.5" text-anchor="middle">2. Server Streaming</text>
<text class="l" x="537.5" y="101.5" text-anchor="middle">Client -&gt; 1 Req -&gt; Server == N Resps ==&gt;</text>
<text class="l" x="537.5" y="117.5" text-anchor="middle">e.g. WatchTodos / Log Tail</text>
<rect x="20" y="170" width="325" height="95" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="l" x="182.5" y="205.5" text-anchor="middle">3. Client Streaming</text>
<text class="l" x="182.5" y="221.5" text-anchor="middle">Client == N Chunks ==&gt; Server -&gt; 1 Summary</text>
<text class="l" x="182.5" y="237.5" text-anchor="middle">e.g. File Upload / Telemetry</text>
<rect x="375" y="170" width="325" height="95" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="537.5" y="205.5" text-anchor="middle">4. Bi-Directional Streaming</text>
<text class="l" x="537.5" y="221.5" text-anchor="middle">Client &lt;== Concurrent Send &amp; Recv ==&gt;</text>
<text class="l" x="537.5" y="237.5" text-anchor="middle">e.g. Chat / Live Sync</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Stock exchange architecture with FIX/binary order gateway, pre-trade risk checks, monotonic sequencer WAL, single-threaded deterministic price-time matching engine, and market data/execution publishers." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Deterministic Stock Exchange Matching Engine</text>
<text class="sub" x="20" y="45">Orders pass pre-trade risk checks, receive a monotonic sequence number in a WAL, and match deterministically in a single-threaded book</text>
<rect x="20" y="72" width="155" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="97.5" y="100.5" text-anchor="middle">Trading Clients</text>
<text class="mono-m" x="97.5" y="115.0" text-anchor="middle">FIX / Binary Gateway</text>
<text class="note" x="97.5" y="129.5" text-anchor="middle">Limit · Market · Cancel</text>
<rect x="215" y="72" width="175" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="302.5" y="100.5" text-anchor="middle">Pre-Trade Risk</text>
<text class="note" x="302.5" y="115.0" text-anchor="middle">Price collar · buying pwr</text>
<text class="note" x="302.5" y="129.5" text-anchor="middle">Rate &amp; fat-finger check</text>
<rect x="430" y="72" width="195" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="527.5" y="100.5" text-anchor="middle">Sequencer + WAL</text>
<text class="mono-m" x="527.5" y="115.0" text-anchor="middle">Assigns monotonic seq</text>
<text class="note" x="527.5" y="129.5" text-anchor="middle">Total order before match</text>
<rect x="665" y="72" width="275" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="802.5" y="100.5" text-anchor="middle">Matching Engine (1 Goroutine)</text>
<text class="note" x="802.5" y="115.0" text-anchor="middle">Price-Time Priority (FIFO)</text>
<text class="mono-m" x="802.5" y="129.5" text-anchor="middle">Deterministic in-RAM L2 Book</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Deterministic Replay &amp; Snapshots</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Replay WAL from seq 0 -&gt; bit-exact</text>
<text class="mono-m" x="162.5" y="270.5" text-anchor="middle">No time.Now() or rand in core</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Execution Reports (Drop Copy)</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">Ack · Partial Fill · Fill · Cancel</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Persisted to clearing ledger</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Market Data Feed (ITCH-like)</text>
<text class="mono-m" x="805.0" y="256.0" text-anchor="middle">L1 BBO + L2 Order Book deltas</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Fan-out decoupled from matcher</text>
<line x1="175" y1="111" x2="215" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="390" y1="111" x2="430" y2="111" stroke="#dc2626" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="410.0" y="103.0" text-anchor="middle">pass</text>
<line x1="625" y1="111" x2="665" y2="111" stroke="#b45309" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="645.0" y="103.0" text-anchor="middle">seq #</text>
<line x1="527" y1="150" x2="200" y2="212" stroke="#b45309" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
<text class="note" x="335.0" y="178.0" text-anchor="middle">WAL replay</text>
<line x1="750" y1="150" x2="520" y2="212" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="620.0" y="178.0" text-anchor="middle">fills</text>
<line x1="830" y1="150" x2="830" y2="212" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="865.0" y="184.0" text-anchor="middle">L1/L2 ticks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="Hybrid news feed fan-out architecture combining push fan-out-on-write and pull fan-out-on-read" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Hybrid News Feed Architecture: Fan-Out-on-Write + Celebrity Fan-Out-on-Read</text>
  <rect x="30" y="70" width="185" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="122.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Post Write Service</text>
  <text x="122.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Persists post + media</text>
  <text x="122.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Checks follower count</text>
  <text x="122.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">threshold (e.g. 50k)</text>
  <rect x="275" y="45" width="235" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="392.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Regular User: Fan-Out-on-Write</text>
  <text x="392.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Pushes post_id to follower Redis lists</text>
  <rect x="275" y="130" width="235" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="392.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Celebrity: Fan-Out-on-Read</text>
  <text x="392.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">No push storm; merged on read</text>
  <rect x="570" y="70" width="220" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="680.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Feed Aggregator</text>
  <text x="680.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Reads precomputed list</text>
  <text x="680.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">+ merges followed celebs</text>
  <text x="680.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Sub-50ms p99</text>
  <line x1="215" y1="100" x2="275" y2="75" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="243" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">&lt;50k</text>
  <line x1="215" y1="140" x2="275" y2="155" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="243" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">&gt;=50k</text>
  <line x1="510" y1="75" x2="570" y2="105" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="540" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b"></text>
  <line x1="510" y1="155" x2="570" y2="135" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Nearby friends architecture with WebSocket gateway, bidirectional friend authorization check, Redis TTL location store, per-user Pub/Sub channels, and cold location history sink." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Nearby Friends: Ephemeral Locations &amp; Authorized Pub/Sub</text>
<text class="sub" x="20" y="45">High-frequency user locations expire automatically in Redis TTL while authorized friend channels fan out updates over WebSockets</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">User A Mobile App</text>
<text class="note" x="102.5" y="115.0" text-anchor="middle">WS ping every 15-30s</text>
<text class="note" x="102.5" y="129.5" text-anchor="middle">Sharing opt-in flag</text>
<rect x="225" y="72" width="190" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="320.0" y="100.5" text-anchor="middle">WebSocket Gateway</text>
<text class="note" x="320.0" y="115.0" text-anchor="middle">Sticky user connections</text>
<text class="note" x="320.0" y="129.5" text-anchor="middle">Heartbeats + backpressure</text>
<rect x="455" y="72" width="215" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">Redis Location Cache</text>
<text class="mono-m" x="562.5" y="115.0" text-anchor="middle">SET loc:{uid} EX 600</text>
<text class="note" x="562.5" y="129.5" text-anchor="middle">Auto-expires stale users</text>
<rect x="710" y="72" width="230" height="78" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="825.0" y="100.5" text-anchor="middle">Redis Pub/Sub Channels</text>
<text class="mono-m" x="825.0" y="115.0" text-anchor="middle">PUBLISH user:{A} (lat,lng)</text>
<text class="note" x="825.0" y="129.5" text-anchor="middle">Online friends subscribe</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Social Graph &amp; Privacy DB</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Bidirectional friends + sharing</text>
<text class="mono-m" x="162.5" y="270.5" text-anchor="middle">Checked on subscribe + push</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Distance &amp; Privacy Filter</text>
<text class="mono-m" x="487.5" y="256.0" text-anchor="middle">Haversine &lt;= radius_m</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Drop updates on unfriend/mute</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Friend B Mobile App</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Receives live distance update</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Removes pin when TTL expires</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="205.0" y="103.0" text-anchor="middle">GPS</text>
<line x1="415" y1="111" x2="455" y2="111" stroke="#dc2626" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="435.0" y="103.0" text-anchor="middle">TTL write</text>
<line x1="670" y1="111" x2="710" y2="111" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="690.0" y="103.0" text-anchor="middle">publish</text>
<line x1="162" y1="212" x2="270" y2="150" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="190.0" y="178.0" text-anchor="middle">authz</text>
<path d="M 825 150 L 825 182 L 487 182 L 487 212" fill="none" stroke="#b45309" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="655.0" y="175.0" text-anchor="middle">fan-out</text>
<line x1="630" y1="252" x2="670" y2="252" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="650.0" y="244.0" text-anchor="middle">WS push</text>
</svg>

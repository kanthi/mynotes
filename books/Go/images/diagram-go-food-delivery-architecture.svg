<text class="title" x="20" y="28">Food Delivery Platform: High-Level Architecture</text>
<text class="sub" x="20" y="45">Three independent workflows (Customer, Restaurant, Delivery Partner) coordinated through stateless Go services, per-service databases, and Kafka events</text>

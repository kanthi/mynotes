<line x1="868" y1="616" x2="900" y2="616" stroke="#b45309" stroke-width="1.5" marker-end="url(#ah-amber)"/>
<rect x="20" y="530" width="360" height="126" rx="7" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.35"/>
<text class="lbl" x="200.0" y="569.0" text-anchor="middle">Core Architectural Invariants</text>
<text class="note" x="200.0" y="583.0" text-anchor="middle">1. No cross-service DB joins: call owner APIs or subscribe to events.</text>
<text class="note" x="200.0" y="597.0" text-anchor="middle">2. Checkout never trusts cache: Order Svc re-verifies prices &amp; stock.</text>
<text class="note" x="200.0" y="611.0" text-anchor="middle">3. Money moves only on verified HMAC webhooks or status API.</text>
<text class="note" x="200.0" y="625.0" text-anchor="middle">4. GPS stream (~100x order rate) bypasses Orders DB via Kafka+Redis.</text>
</svg>

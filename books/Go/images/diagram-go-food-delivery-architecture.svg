<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-label="High-level Food Delivery Platform architecture: Clients connect through DNS, CDN, WAF, L7 Load Balancer, and API Gateway to 12 independent Go microservices backed by Kafka, per-service PostgreSQL databases, Redis Cluster, Elasticsearch, S3 Object Storage, and external providers." color-scheme="light">

<text class="lbl" x="540.0" y="419.0" text-anchor="middle">Kafka Event Bus (Partitioned by tenant_id:entity_id) &amp;amp; Enterprise Security Invariants</text>
<text class="mono-m" x="540.0" y="433.0" text-anchor="middle">Topics: org-directory-events · post-events · group-acl-events · compliance-audit-events</text>
<text class="note" x="540.0" y="447.0" text-anchor="middle">1. Offboarding via SCIM revokes active sessions in Redis in &lt; 1s.  2. Secret group posts never leak into All-Company feeds or Search.</text>
<text class="note" x="540.0" y="461.0" text-anchor="middle">3. All-Company executive posts (&gt;10k staff) bypass push fan-out and merge lazily at read time with live group-membership checks.</text>

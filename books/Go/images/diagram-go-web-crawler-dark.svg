<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Bounded web crawler architecture with URL frontier, per-host politeness gates, robots.txt cache, bounded Go fetcher pool, HTML parser, content hash deduplicator, and persistent frontier store." color-scheme="dark">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#e2e8f0}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#e2e8f0}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#94a3b8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#e2e8f0}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#94a3b8}
</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text class="title" x="20" y="28">Bounded Polite Web Crawler Architecture</text>
<text class="sub" x="20" y="45">Seed URLs flow through canonicalization, per-host politeness queues, bounded Go fetch workers, content dedupe, and checkpointed frontier</text>
<rect x="20" y="72" width="145" height="76" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="92.5" y="99.5" text-anchor="middle">Seed &amp; Frontier</text>
<text class="note" x="92.5" y="114.0" text-anchor="middle">Per-host queues</text>
<text class="mono-m" x="92.5" y="128.5" text-anchor="middle">next_allowed_at</text>
<rect x="200" y="72" width="155" height="76" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="277.5" y="99.5" text-anchor="middle">Politeness Gate</text>
<text class="note" x="277.5" y="114.0" text-anchor="middle">robots.txt (RFC 9309)</text>
<text class="mono-m" x="277.5" y="128.5" text-anchor="middle">1 req/host/window</text>
<rect x="390" y="72" width="160" height="76" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="470.0" y="99.5" text-anchor="middle">Bounded Fetch Pool</text>
<text class="note" x="470.0" y="114.0" text-anchor="middle">N goroutines + timeout</text>
<text class="note" x="470.0" y="128.5" text-anchor="middle">Max body + redirect cap</text>
<rect x="585" y="72" width="165" height="76" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="667.5" y="99.5" text-anchor="middle">Parser &amp; Normalizer</text>
<text class="note" x="667.5" y="114.0" text-anchor="middle">Extract links · strip #</text>
<text class="note" x="667.5" y="128.5" text-anchor="middle">Content-Type guard</text>
<rect x="785" y="72" width="155" height="76" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="862.5" y="99.5" text-anchor="middle">Content Dedupe</text>
<text class="mono-m" x="862.5" y="114.0" text-anchor="middle">SHA-256 / SimHash</text>
<text class="note" x="862.5" y="128.5" text-anchor="middle">Skip duplicate bodies</text>
<rect x="20" y="210" width="260" height="82" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="lbl" x="150.0" y="240.5" text-anchor="middle">Durable Frontier Store (SQLite / PG)</text>
<text class="mono-m" x="150.0" y="255.0" text-anchor="middle">URL status · ETag · retry backoff</text>
<text class="note" x="150.0" y="269.5" text-anchor="middle">Crash recovery resumes unfinished hosts</text>
<rect x="330" y="210" width="280" height="82" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="470.0" y="240.5" text-anchor="middle">DNS Cache &amp; SSRF Guard</text>
<text class="note" x="470.0" y="255.0" text-anchor="middle">Block loopback / RFC 1918 / link-local</text>
<text class="mono-m" x="470.0" y="269.5" text-anchor="middle">Pin resolved IP on net.Dialer</text>
<rect x="660" y="210" width="280" height="82" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="800.0" y="240.5" text-anchor="middle">Page Store &amp; Metrics</text>
<text class="note" x="800.0" y="255.0" text-anchor="middle">Immutable blobs + crawl_pages metadata</text>
<text class="mono-m" x="800.0" y="269.5" text-anchor="middle">Frontier depth · 429/5xx · p99 fetch</text>
<line x1="165" y1="110" x2="200" y2="110" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="355" y1="110" x2="390" y2="110" stroke="#fbbf24" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<line x1="550" y1="110" x2="585" y2="110" stroke="#4ade80" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="567.0" y="102.0" text-anchor="middle">200 OK</text>
<line x1="750" y1="110" x2="785" y2="110" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<path d="M 667 148 L 667 178 L 92 178 L 92 148" fill="none" stroke="#60a5fa" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-blue)"/>
<text class="note" x="380.0" y="172.0" text-anchor="middle">new canonical URLs (deduped)</text>
<line x1="92" y1="210" x2="92" y2="148" stroke="#94a3b8" stroke-width="1.55" marker-end="url(#ah-slate)"/>
<text class="note" x="118.0" y="195.0" text-anchor="middle">reload</text>
<line x1="470" y1="148" x2="470" y2="210" stroke="#f87171" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="502.0" y="195.0" text-anchor="middle">dial check</text>
<line x1="862" y1="148" x2="862" y2="210" stroke="#4ade80" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="888.0" y="195.0" text-anchor="middle">persist</text>
</svg>

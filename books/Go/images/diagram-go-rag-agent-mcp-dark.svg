<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-label="User prompt enters bounded Go agent loop which calls LLM, executes local RAG vector search or remote MCP server tools, appends tool results, and returns final answer." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e2e8f0}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e2e8f0}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<text class="t" x="20" y="28">Bounded AI Agent Loop with RAG and MCP Tools</text>
<rect x="20" y="65" width="120" height="65" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="l" x="80.0" y="93.5" text-anchor="middle">User Goal</text>
<text class="l" x="80.0" y="109.5" text-anchor="middle">HTTP / UI</text>
<rect x="180" y="55" width="170" height="85" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="l" x="265.0" y="85.5" text-anchor="middle">Go Agent Loop</text>
<text class="l" x="265.0" y="101.5" text-anchor="middle">step 1..MaxSteps</text>
<text class="l" x="265.0" y="117.5" text-anchor="middle">ctx timeout</text>
<rect x="395" y="55" width="135" height="85" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="l" x="462.5" y="85.5" text-anchor="middle">LLM Provider</text>
<text class="l" x="462.5" y="101.5" text-anchor="middle">Tool Calls /</text>
<text class="l" x="462.5" y="117.5" text-anchor="middle">Final Answer</text>
<rect x="565" y="65" width="135" height="65" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="l" x="632.5" y="93.5" text-anchor="middle">Final Answer</text>
<text class="l" x="632.5" y="109.5" text-anchor="middle">JSON / SSE</text>
<rect x="180" y="190" width="220" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="l" x="290.0" y="221.0" text-anchor="middle">Vector DB (pgvector)</text>
<text class="l" x="290.0" y="237.0" text-anchor="middle">Semantic Note Search</text>
<rect x="440" y="190" width="260" height="70" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="l" x="570.0" y="221.0" text-anchor="middle">MCP Server (stdio / HTTP)</text>
<text class="l" x="570.0" y="237.0" text-anchor="middle">tools/list · tools/call</text>
<line x1="140" y1="97" x2="180" y2="97" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="350" y1="97" x2="395" y2="97" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="372.5" y="91.0" text-anchor="middle">msgs</text>
<line x1="530" y1="97" x2="565" y2="97" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="547.5" y="91.0" text-anchor="middle">stop</text>
<line x1="265" y1="140" x2="265" y2="190" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="265.0" y="159.0" text-anchor="middle">RAG</text>
<line x1="320" y1="140" x2="530" y2="190" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="425.0" y="159.0" text-anchor="middle">JSON-RPC</text>

</svg>
<text class="l" x="277.5" y="99.0" text-anchor="middle">1. INSERT bookings</text>
<text class="l" x="277.5" y="115.0" text-anchor="middle">2. INSERT outbox</text>
<rect x="405" y="60" width="125" height="70" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="l" x="467.5" y="91.0" text-anchor="middle">Outbox</text>
<text class="l" x="467.5" y="107.0" text-anchor="middle">Forwarder</text>

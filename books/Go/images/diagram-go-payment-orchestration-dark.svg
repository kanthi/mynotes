<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Payment orchestration system architecture with checkout idempotency key, payment state machine in PostgreSQL, PSP adapter with timeout handling, constant-time HMAC webhook handler, and settlement reconciler." color-scheme="dark">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#e2e8f0}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#e2e8f0}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#94a3b8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#e2e8f0}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#94a3b8}
</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text class="title" x="20" y="28">Payment Orchestration, Webhooks &amp; Settlement Reconciliation</text>
<text class="sub" x="20" y="45">Idempotent payment state machine isolates external PSP calls, verifies HMAC webhooks, and reconciles ambiguous outcomes</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Checkout Client</text>
<text class="mono-m" x="102.5" y="115.0" text-anchor="middle">Idempotency-Key</text>
<text class="note" x="102.5" y="129.5" text-anchor="middle">Integer minor units</text>
<rect x="225" y="72" width="195" height="78" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="322.5" y="100.5" text-anchor="middle">Payment Orchestrator</text>
<text class="note" x="322.5" y="115.0" text-anchor="middle">State machine + outbox</text>
<text class="mono-m" x="322.5" y="129.5" text-anchor="middle">CREATED -&gt; AUTHORIZED</text>
<rect x="460" y="72" width="205" height="78" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">PSP Adapter</text>
<text class="note" x="562.5" y="115.0" text-anchor="middle">Forward idempotency key</text>
<text class="note" x="562.5" y="129.5" text-anchor="middle">Strict ctx timeout</text>
<rect x="705" y="72" width="235" height="78" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="822.5" y="100.5" text-anchor="middle">External PSP (PCI)</text>
<text class="note" x="822.5" y="115.0" text-anchor="middle">Card / Bank / UPI</text>
<text class="mono-m" x="822.5" y="129.5" text-anchor="middle">Async HMAC webhook</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Payments &amp; Ledger DB (PG)</text>
<text class="mono-m" x="162.5" y="256.0" text-anchor="middle">payments · attempts · ledger</text>
<text class="note" x="162.5" y="270.5" text-anchor="middle">Never stores PAN or CVV</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">HMAC Webhook Receiver</text>
<text class="mono-m" x="487.5" y="256.0" text-anchor="middle">hmac.Equal + event_id UNIQUE</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Returns 200 on duplicate</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Reconciler &amp; Settlement</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Polls stuck PENDING intents</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Matches daily PSP CSV report</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="420" y1="111" x2="460" y2="111" stroke="#fbbf24" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<line x1="665" y1="111" x2="705" y2="111" stroke="#f87171" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="685.0" y="103.0" text-anchor="middle">charge</text>
<line x1="322" y1="150" x2="200" y2="212" stroke="#4ade80" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="238.0" y="178.0" text-anchor="middle">ACID TX</text>
<path d="M 822 150 L 822 182 L 487 182 L 487 212" fill="none" stroke="#f87171" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="655.0" y="175.0" text-anchor="middle">webhook</text>
<line x1="805" y1="212" x2="850" y2="150" stroke="#94a3b8" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-slate)"/>
<text class="note" x="865.0" y="184.0" text-anchor="middle">status poll</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-label="Goroutines run on logical processors P bound to OS threads M; blocking network I/O parks G in the epoll/kqueue netpoller while M runs another G." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e2e8f0}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e2e8f0}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<text class="t" x="20" y="28">Go GMP Scheduler and Netpoller Lifecycle</text>
<rect x="20" y="55" width="160" height="80" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="l" x="100.0" y="83.0" text-anchor="middle">Local Run Queue</text>
<text class="l" x="100.0" y="99.0" text-anchor="middle">G1 · G2 · G3</text>
<text class="l" x="100.0" y="115.0" text-anchor="middle">owned by P</text>
<rect x="225" y="55" width="140" height="80" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="l" x="295.0" y="83.0" text-anchor="middle">Processor (P)</text>
<text class="l" x="295.0" y="99.0" text-anchor="middle">bound to OS</text>
<text class="l" x="295.0" y="115.0" text-anchor="middle">Thread (M)</text>
<rect x="410" y="55" width="130" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="l" x="475.0" y="83.0" text-anchor="middle">Global Queue</text>
<text class="l" x="475.0" y="99.0" text-anchor="middle">Work Stealing</text>
<text class="l" x="475.0" y="115.0" text-anchor="middle">from other P</text>
<rect x="575" y="55" width="125" height="80" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="l" x="637.5" y="83.0" text-anchor="middle">sysmon</text>
<text class="l" x="637.5" y="99.0" text-anchor="middle">Preempt &amp;</text>
<text class="l" x="637.5" y="115.0" text-anchor="middle">Netpoll</text>
<rect x="225" y="185" width="315" height="75" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="l" x="382.5" y="218.5" text-anchor="middle">OS Netpoller (epoll / kqueue)</text>
<text class="l" x="382.5" y="234.5" text-anchor="middle">Parks G on I/O wait; wakes G when socket ready</text>
<line x1="180" y1="95" x2="225" y2="95" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="202.5" y="89.0" text-anchor="middle">pop</text>
<line x1="410" y1="95" x2="365" y2="95" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="387.5" y="89.0" text-anchor="middle">steal</text>
<line x1="295" y1="135" x2="295" y2="185" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="295.0" y="154.0" text-anchor="middle">park G</text>
<line x1="345" y1="185" x2="345" y2="135" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="345.0" y="154.0" text-anchor="middle">ready</text>

</svg>
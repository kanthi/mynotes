<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Object storage architecture separating control plane metadata and atomic multipart commit from content-addressed chunk storage, SHA-256 verification, and background garbage collection." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">S3-Like Object Storage: Control Plane vs. Data Plane</text>
<text class="sub" x="20" y="45">Metadata and atomic manifests live in transactional SQL while immutable content-addressed chunks stream to disk/storage nodes</text>
<rect x="20" y="72" width="155" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="97.5" y="100.5" text-anchor="middle">Client PUT / GET</text>
<text class="note" x="97.5" y="115.0" text-anchor="middle">Presigned URL / Auth</text>
<text class="mono-m" x="97.5" y="129.5" text-anchor="middle">If-Match / Range</text>
<rect x="215" y="72" width="190" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="310.0" y="100.5" text-anchor="middle">API Gateway / Router</text>
<text class="mono-m" x="310.0" y="115.0" text-anchor="middle">Stream io.Reader -&gt; hash</text>
<text class="note" x="310.0" y="129.5" text-anchor="middle">Never buffer full object</text>
<rect x="445" y="72" width="220" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="555.0" y="100.5" text-anchor="middle">Data Plane (Chunk Store)</text>
<text class="note" x="555.0" y="115.0" text-anchor="middle">Write temp -&gt; fsync -&gt; rename</text>
<text class="mono-m" x="555.0" y="129.5" text-anchor="middle">Content-addressed SHA-256</text>
<rect x="705" y="72" width="235" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="822.5" y="100.5" text-anchor="middle">Control Plane (Metadata DB)</text>
<text class="mono-m" x="822.5" y="115.0" text-anchor="middle">buckets · objects · versions</text>
<text class="note" x="822.5" y="129.5" text-anchor="middle">Atomic manifest commit TX</text>
<rect x="20" y="212" width="290" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="165.0" y="241.5" text-anchor="middle">Multipart Upload Staging</text>
<text class="mono-m" x="165.0" y="256.0" text-anchor="middle">Create -&gt; UploadPart(1..N) -&gt; Complete</text>
<text class="note" x="165.0" y="270.5" text-anchor="middle">Staged parts invisible until Complete</text>
<rect x="350" y="212" width="275" height="80" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Durability &amp; Placement</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">3x Replication or Erasure Coding</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Scrubber verifies chunk checksums</text>
<rect x="665" y="212" width="275" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="802.5" y="241.5" text-anchor="middle">Async Garbage Collector</text>
<text class="note" x="802.5" y="256.0" text-anchor="middle">Sweeps aborted uploads &amp; deleted</text>
<text class="mono-m" x="802.5" y="270.5" text-anchor="middle">Grace period avoids read races</text>
<line x1="175" y1="111" x2="215" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="405" y1="111" x2="445" y2="111" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="425.0" y="103.0" text-anchor="middle">chunks</text>
<line x1="665" y1="111" x2="705" y2="111" stroke="#b45309" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="685.0" y="103.0" text-anchor="middle">commit</text>
<line x1="165" y1="212" x2="260" y2="150" stroke="#7c3aed" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-purple)"/>
<text class="note" x="190.0" y="178.0" text-anchor="middle">parts</text>
<line x1="555" y1="150" x2="500" y2="212" stroke="#64748b" stroke-width="1.55" marker-end="url(#ah-slate)"/>
<text class="note" x="558.0" y="184.0" text-anchor="middle">replicate</text>
<line x1="822" y1="150" x2="822" y2="212" stroke="#dc2626" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="858.0" y="184.0" text-anchor="middle">tombstones</text>
</svg>

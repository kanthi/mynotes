<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Search Autocomplete: Offline Trie Builder &amp; Lock-Free Read Path</text>
<text class="sub" x="20" y="45">Click logs aggregate into versioned immutable Trie snapshots swapped atomically via atomic.Pointer for sub-millisecond reads</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Client Search Box</text>
<text class="note" x="102.5" y="115.0" text-anchor="middle">Debounce 100-150ms</text>
<text class="mono-m" x="102.5" y="129.5" text-anchor="middle">GET /suggest?q=go</text>
<rect x="225" y="72" width="185" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="317.5" y="100.5" text-anchor="middle">Edge / CDN + API</text>
<text class="note" x="317.5" y="115.0" text-anchor="middle">Normalize UTF-8 / fold</text>
<text class="note" x="317.5" y="129.5" text-anchor="middle">Short prefix cache</text>
<rect x="450" y="72" width="225" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">Immutable Trie Snapshot</text>
<text class="mono-m" x="562.5" y="115.0" text-anchor="middle">atomic.Pointer[Snapshot]</text>
<text class="note" x="562.5" y="129.5" text-anchor="middle">Precomputed Top-K per node</text>
<rect x="715" y="72" width="225" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="827.5" y="100.5" text-anchor="middle">Response (p99 &lt; 5ms)</text>
<text class="note" x="827.5" y="115.0" text-anchor="middle">Zero DB calls on read path</text>
<text class="note" x="827.5" y="129.5" text-anchor="middle">Zero lock contention</text>
<rect x="20" y="212" width="250" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="145.0" y="241.5" text-anchor="middle">Search Query Logs (Kafka)</text>
<text class="note" x="145.0" y="256.0" text-anchor="middle">Sampled clicks + completions</text>
<text class="mono-m" x="145.0" y="270.5" text-anchor="middle">Time-decayed frequency weights</text>
<rect x="310" y="212" width="285" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="452.5" y="241.5" text-anchor="middle">Offline Snapshot Builder</text>
<text class="note" x="452.5" y="256.0" text-anchor="middle">Filter abuse/PII · build compact Trie</text>
<text class="note" x="452.5" y="270.5" text-anchor="middle">Pre-sort Top-K at every prefix node</text>
<rect x="635" y="212" width="305" height="80" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="787.5" y="241.5" text-anchor="middle">Artifact Store (S3) &amp; Rollout</text>
<text class="mono-m" x="787.5" y="256.0" text-anchor="middle">Versioned immutable blobs + checksum</text>
<text class="note" x="787.5" y="270.5" text-anchor="middle">Verify -&gt; Load -&gt; Atomic Pointer Swap</text>

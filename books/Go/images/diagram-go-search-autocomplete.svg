<line x1="410" y1="111" x2="450" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="430.0" y="103.0" text-anchor="middle">O(|prefix|)</text>
<line x1="675" y1="111" x2="715" y2="111" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<line x1="270" y1="252" x2="310" y2="252" stroke="#b45309" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
<line x1="595" y1="252" x2="635" y2="252" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>

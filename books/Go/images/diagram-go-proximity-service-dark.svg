<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Proximity service architecture separating high-QPS read path with Redis geohash cell cache and PostGIS read replicas from low-QPS business write path with asynchronous cache invalidation." color-scheme="dark">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#e2e8f0}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#e2e8f0}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#94a3b8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#e2e8f0}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#94a3b8}
</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text class="title" x="20" y="28">Read-Heavy Proximity Service (Nearby Places)</text>
<text class="sub" x="20" y="45">Geohash or PostGIS spatial index narrows candidates to neighboring cells before exact Haversine filtering and Redis cell caching</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Mobile / Web Client</text>
<text class="mono-m" x="102.5" y="115.0" text-anchor="middle">GET /nearby?lat&amp;lng&amp;r</text>
<text class="note" x="102.5" y="129.5" text-anchor="middle">Read-heavy (~99:1)</text>
<rect x="225" y="72" width="190" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="320.0" y="100.5" text-anchor="middle">Location API (Go)</text>
<text class="note" x="320.0" y="115.0" text-anchor="middle">Compute cell + 8 neighbors</text>
<text class="mono-m" x="320.0" y="129.5" text-anchor="middle">Exact Haversine filter</text>
<rect x="455" y="72" width="215" height="78" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">Redis Spatial Cache</text>
<text class="mono-m" x="562.5" y="115.0" text-anchor="middle">geohash -&gt; []business_id</text>
<text class="note" x="562.5" y="129.5" text-anchor="middle">business:{id} detail TTL</text>
<rect x="710" y="72" width="230" height="78" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="825.0" y="100.5" text-anchor="middle">PostGIS Read Replicas</text>
<text class="mono-m" x="825.0" y="115.0" text-anchor="middle">GIST index + ST_DWithin</text>
<text class="note" x="825.0" y="129.5" text-anchor="middle">Fallback on cache miss</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Business Admin Write API</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Create / edit / close venue</text>
<text class="note" x="162.5" y="270.5" text-anchor="middle">Low QPS · strict validation</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">PostgreSQL Primary (Source)</text>
<text class="mono-m" x="487.5" y="256.0" text-anchor="middle">businesses + geography(Point)</text>
<text class="note" x="487.5" y="270.5" text-anchor="middle">Async replication to replicas</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Index &amp; Cache Refresh</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Invalidate old + new geohash</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Rebuilds cleanly if Redis clears</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="415" y1="111" x2="455" y2="111" stroke="#f87171" stroke-width="1.55" marker-end="url(#ah-red)"/>
<text class="note" x="435.0" y="103.0" text-anchor="middle">hit ~1ms</text>
<line x1="670" y1="111" x2="710" y2="111" stroke="#4ade80" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-green)"/>
<text class="note" x="690.0" y="103.0" text-anchor="middle">miss</text>
<line x1="305" y1="252" x2="345" y2="252" stroke="#fbbf24" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="325.0" y="244.0" text-anchor="middle">TX write</text>
<line x1="630" y1="252" x2="670" y2="252" stroke="#94a3b8" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-slate)"/>
<text class="note" x="650.0" y="244.0" text-anchor="middle">CDC / event</text>
<path d="M 805 212 L 805 182 L 562 182 L 562 150" fill="none" stroke="#f87171" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="684.0" y="175.0" text-anchor="middle">evict cell</text>
</svg>

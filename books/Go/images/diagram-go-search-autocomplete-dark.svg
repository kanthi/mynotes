<text class="title" x="20" y="28">Search Autocomplete: Offline Trie Builder &amp; Lock-Free Read Path</text>
<text class="sub" x="20" y="45">Click logs aggregate into versioned immutable Trie snapshots swapped atomically via atomic.Pointer for sub-millisecond reads</text>

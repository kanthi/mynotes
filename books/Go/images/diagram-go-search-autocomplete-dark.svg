<text class="lbl" x="827.5" y="100.5" text-anchor="middle">Response (p99 &lt; 5ms)</text>
<text class="note" x="827.5" y="115.0" text-anchor="middle">Zero DB calls on read path</text>
<text class="note" x="827.5" y="129.5" text-anchor="middle">Zero lock contention</text>

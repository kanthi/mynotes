<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Client Search Box</text>
<text class="note" x="102.5" y="115.0" text-anchor="middle">Debounce 100-150ms</text>
<text class="mono-m" x="102.5" y="129.5" text-anchor="middle">GET /suggest?q=go</text>
<rect x="225" y="72" width="185" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="317.5" y="100.5" text-anchor="middle">Edge / CDN + API</text>
<text class="note" x="317.5" y="115.0" text-anchor="middle">Normalize UTF-8 / fold</text>
<text class="note" x="317.5" y="129.5" text-anchor="middle">Short prefix cache</text>
<rect x="450" y="72" width="225" height="78" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">Immutable Trie Snapshot</text>
<text class="mono-m" x="562.5" y="115.0" text-anchor="middle">atomic.Pointer[Snapshot]</text>
<text class="note" x="562.5" y="129.5" text-anchor="middle">Precomputed Top-K per node</text>

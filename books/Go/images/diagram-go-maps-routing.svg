<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Maps and routing architecture separating CDN-cached vector/raster map tiles from shortest-path routing engine (A* / Contraction Hierarchies), road graph snapshots, and live traffic speed overlays." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Maps &amp; Routing: Tile CDN, Road Graph &amp; Live Traffic ETA</text>
<text class="sub" x="20" y="45">Static map tiles serve from CDN while routing services run A* over weighted road-graph tiles updated by live traffic speeds</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Navigation Client</text>
<text class="note" x="102.5" y="115.0" text-anchor="middle">Origin + Destination</text>
<text class="mono-m" x="102.5" y="129.5" text-anchor="middle">Tile z/x/y + Route req</text>
<rect x="225" y="72" width="190" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="320.0" y="100.5" text-anchor="middle">Route Planner API</text>
<text class="note" x="320.0" y="115.0" text-anchor="middle">Snap GPS -&gt; road edge</text>
<text class="note" x="320.0" y="129.5" text-anchor="middle">Top-K routes + ETA</text>
<rect x="455" y="72" width="215" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="562.5" y="100.5" text-anchor="middle">Shortest-Path Engine</text>
<text class="note" x="562.5" y="115.0" text-anchor="middle">A* + Haversine heuristic</text>
<text class="mono-m" x="562.5" y="129.5" text-anchor="middle">Contraction Hierarchies</text>
<rect x="710" y="72" width="230" height="78" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="825.0" y="100.5" text-anchor="middle">ETA &amp; Reroute Service</text>
<text class="mono-m" x="825.0" y="115.0" text-anchor="middle">Edge weight = len / speed</text>
<text class="note" x="825.0" y="129.5" text-anchor="middle">Turn-by-turn maneuvers</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Map Tile CDN (S3 Origin)</text>
<text class="mono-m" x="162.5" y="256.0" text-anchor="middle">Pre-rendered /z/x/y vector tiles</text>
<text class="note" x="162.5" y="270.5" text-anchor="middle">Immutable cache + ETag</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Road Graph Partition Store</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">Nodes, directed edges, turn rules</text>
<text class="mono-m" x="487.5" y="270.5" text-anchor="middle">Versioned immutable graph tiles</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Live Traffic Speed Overlay</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Aggregated GPS probe speeds</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Overlays edge weights in RAM</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="205.0" y="103.0" text-anchor="middle">route</text>
<line x1="415" y1="111" x2="455" y2="111" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<line x1="670" y1="111" x2="710" y2="111" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="690.0" y="103.0" text-anchor="middle">path</text>
<line x1="102" y1="150" x2="102" y2="212" stroke="#64748b" stroke-width="1.55" marker-end="url(#ah-slate)"/>
<text class="note" x="138.0" y="184.0" text-anchor="middle">GET /tiles</text>
<line x1="487" y1="212" x2="520" y2="150" stroke="#b45309" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="536.0" y="184.0" text-anchor="middle">load graph</text>
<line x1="805" y1="212" x2="805" y2="150" stroke="#dc2626" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="844.0" y="184.0" text-anchor="middle">speed delta</text>
</svg>

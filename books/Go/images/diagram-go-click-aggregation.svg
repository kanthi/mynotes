<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Ad click event aggregation pipeline from ingestion API and Kafka log through deduplication, event-time tumbling window aggregator with watermarks, late-event side output, and rollup query store." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Ad Click Event-Time Aggregation &amp; Watermarks</text>
<text class="sub" x="20" y="45">Raw click events partition by ad_id in Kafka, aggregate in event-time tumbling windows with watermarks, and route late data cleanly</text>
<rect x="20" y="72" width="160" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="100.0" y="100.5" text-anchor="middle">Click Ingest API</text>
<text class="note" x="100.0" y="115.0" text-anchor="middle">Validate + event_id</text>
<text class="mono-m" x="100.0" y="129.5" text-anchor="middle">Reply 202 fast</text>
<rect x="215" y="72" width="175" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="302.5" y="100.5" text-anchor="middle">Kafka: ad-clicks</text>
<text class="mono-m" x="302.5" y="115.0" text-anchor="middle">Partition key = ad_id</text>
<text class="note" x="302.5" y="129.5" text-anchor="middle">Durable replayable log</text>
<rect x="425" y="72" width="215" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="532.5" y="100.5" text-anchor="middle">Event-Time Aggregator</text>
<text class="note" x="532.5" y="115.0" text-anchor="middle">Tumbling 1m windows</text>
<text class="mono-m" x="532.5" y="129.5" text-anchor="middle">Watermark = max_ts - lag</text>
<rect x="675" y="72" width="265" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="807.5" y="100.5" text-anchor="middle">Rollup Query Store (OLAP/PG)</text>
<text class="mono-m" x="807.5" y="115.0" text-anchor="middle">UPSERT (ad_id, win_start, cnt)</text>
<text class="note" x="807.5" y="129.5" text-anchor="middle">Idempotent per-window flush</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Click Deduplication Window</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Bounded event_id set per ad_id</text>
<text class="mono-m" x="162.5" y="270.5" text-anchor="middle">Drops duplicate retries &amp; bots</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Checkpoint &amp; Offset Commit</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">Flush rollup BEFORE Kafka commit</text>
<text class="mono-m" x="487.5" y="270.5" text-anchor="middle">Replay from raw log on bug/crash</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Late-Event Side Output</text>
<text class="mono-m" x="805.0" y="256.0" text-anchor="middle">event_ts &lt; watermark - grace</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Correction delta or audit log</text>
<line x1="180" y1="111" x2="215" y2="111" stroke="#b45309" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
<line x1="390" y1="111" x2="425" y2="111" stroke="#b45309" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
<text class="note" x="407.0" y="103.0" text-anchor="middle">consume</text>
<line x1="640" y1="111" x2="675" y2="111" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="657.0" y="103.0" text-anchor="middle">flush</text>
<line x1="460" y1="150" x2="240" y2="212" stroke="#7c3aed" stroke-width="1.55" marker-end="url(#ah-purple)"/>
<text class="note" x="335.0" y="176.0" text-anchor="middle">dedupe</text>
<line x1="532" y1="150" x2="500" y2="212" stroke="#64748b" stroke-width="1.55" marker-end="url(#ah-slate)"/>
<text class="note" x="550.0" y="184.0" text-anchor="middle">checkpoint</text>
<line x1="600" y1="150" x2="740" y2="212" stroke="#dc2626" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="698.0" y="178.0" text-anchor="middle">late &gt; grace</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Google Drive style file sync architecture with local watcher, content-defined chunking, block deduplication store, revision metadata service with CAS conflict detection, and delta notification stream." color-scheme="dark">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#e2e8f0}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#e2e8f0}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#94a3b8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#e2e8f0}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#94a3b8}
</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>

<text class="title" x="20" y="28">Block-Level File Synchronization &amp; Conflict Resolution</text>
<text class="sub" x="20" y="45">Clients chunk changed files by content hash, upload only missing blocks, commit compare-and-swap revisions, and pull delta feeds</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Desktop / Mobile</text>
<text class="note" x="102.5" y="115.0" text-anchor="middle">FS watcher + chunker</text>
<text class="mono-m" x="102.5" y="129.5" text-anchor="middle">4MB blocks + SHA-256</text>
<rect x="225" y="72" width="185" height="78" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="317.5" y="100.5" text-anchor="middle">Block Sync API</text>
<text class="mono-m" x="317.5" y="115.0" text-anchor="middle">POST /blocks/missing</text>
<text class="note" x="317.5" y="129.5" text-anchor="middle">Upload delta chunks only</text>
<rect x="450" y="72" width="215" height="78" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="557.5" y="100.5" text-anchor="middle">Metadata Service (PG)</text>
<text class="mono-m" x="557.5" y="115.0" text-anchor="middle">files · revisions · manifests</text>
<text class="note" x="557.5" y="129.5" text-anchor="middle">CAS: parent_rev == current</text>
<rect x="705" y="72" width="235" height="78" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="822.5" y="100.5" text-anchor="middle">Notification / Delta Feed</text>
<text class="mono-m" x="822.5" y="115.0" text-anchor="middle">GET /changes?cursor=seq</text>
<text class="note" x="822.5" y="129.5" text-anchor="middle">SSE/Long-poll wakes peers</text>
<rect x="20" y="212" width="285" height="80" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="lbl" x="162.5" y="241.5" text-anchor="middle">Immutable Block Store (S3)</text>
<text class="note" x="162.5" y="256.0" text-anchor="middle">Deduplicated encrypted chunks</text>
<text class="mono-m" x="162.5" y="270.5" text-anchor="middle">Content-addressed by SHA-256</text>
<rect x="345" y="212" width="285" height="80" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="487.5" y="241.5" text-anchor="middle">Conflict Policy (409 Conflict)</text>
<text class="note" x="487.5" y="256.0" text-anchor="middle">Never silently overwrite peer edits</text>
<text class="mono-m" x="487.5" y="270.5" text-anchor="middle">Fork conflict copy + preserve both</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Peer Devices (Pull Delta)</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Fetch changed manifests + blocks</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Atomic temp-file rename locally</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="205.0" y="103.0" text-anchor="middle">hashes</text>
<line x1="410" y1="111" x2="450" y2="111" stroke="#fbbf24" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="430.0" y="103.0" text-anchor="middle">commit rev</text>
<line x1="665" y1="111" x2="705" y2="111" stroke="#a78bfa" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-purple)"/>
<text class="note" x="685.0" y="103.0" text-anchor="middle">advance seq</text>
<line x1="317" y1="150" x2="190" y2="212" stroke="#4ade80" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="230.0" y="180.0" text-anchor="middle">put blocks</text>
<line x1="557" y1="150" x2="500" y2="212" stroke="#f87171" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="555.0" y="184.0" text-anchor="middle">stale rev</text>
<line x1="822" y1="150" x2="822" y2="212" stroke="#60a5fa" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="848.0" y="184.0" text-anchor="middle">notify</text>
</svg>

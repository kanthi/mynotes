<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Real-time gaming leaderboard architecture with match result ingestion, authoritative PostgreSQL score ledger, idempotency guard, Redis ZSET ranking projection, tie-breaking encoding, and snapshot rebuild." color-scheme="light">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<style>
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#1f2933}
.sub{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}
.lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:600;fill:#1f2933}
.note{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#52606d}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.8px;fill:#1f2933}
.mono-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#52606d}
</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text class="title" x="20" y="28">Real-Time Gaming Leaderboard: Authoritative Ledger + Redis ZSET</text>
<text class="sub" x="20" y="45">Match results persist idempotently in PostgreSQL while a Redis Sorted Set serves O(log N) Top-K and player-neighborhood queries</text>
<rect x="20" y="72" width="165" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="102.5" y="100.5" text-anchor="middle">Game Server</text>
<text class="mono-m" x="102.5" y="115.0" text-anchor="middle">POST /scores (signed)</text>
<text class="note" x="102.5" y="129.5" text-anchor="middle">match_id + player_id</text>
<rect x="225" y="72" width="195" height="78" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="322.5" y="100.5" text-anchor="middle">Score Service (Go)</text>
<text class="note" x="322.5" y="115.0" text-anchor="middle">Validate &amp; dedupe TX</text>
<text class="note" x="322.5" y="129.5" text-anchor="middle">Authoritative write</text>
<rect x="460" y="72" width="215" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text class="lbl" x="567.5" y="100.5" text-anchor="middle">Redis Sorted Set (ZSET)</text>
<text class="mono-m" x="567.5" y="115.0" text-anchor="middle">ZINCRBY / ZREVRANK</text>
<text class="note" x="567.5" y="129.5" text-anchor="middle">O(log N) rank &amp; Top-K</text>
<rect x="715" y="72" width="225" height="78" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="lbl" x="827.5" y="100.5" text-anchor="middle">Leaderboard Read API</text>
<text class="note" x="827.5" y="115.0" text-anchor="middle">Top 100 + ±5 around me</text>
<text class="note" x="827.5" y="129.5" text-anchor="middle">Hydrate profile names</text>
<rect x="20" y="212" width="290" height="80" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="lbl" x="165.0" y="241.5" text-anchor="middle">PostgreSQL Score Ledger</text>
<text class="mono-m" x="165.0" y="256.0" text-anchor="middle">score_events(match_id, player_id)</text>
<text class="note" x="165.0" y="270.5" text-anchor="middle">Source of truth for audits/rebuilds</text>
<rect x="350" y="212" width="280" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="lbl" x="490.0" y="241.5" text-anchor="middle">Tie-Breaking &amp; Seasons</text>
<text class="mono-m" x="490.0" y="256.0" text-anchor="middle">Composite score or (score, -ts)</text>
<text class="note" x="490.0" y="270.5" text-anchor="middle">Key per season: lb:2026-11</text>
<rect x="670" y="212" width="270" height="80" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="lbl" x="805.0" y="241.5" text-anchor="middle">Rebuild &amp; Drift Detector</text>
<text class="note" x="805.0" y="256.0" text-anchor="middle">Reconstruct ZSET from PG on loss</text>
<text class="note" x="805.0" y="270.5" text-anchor="middle">Compare top-K vs SQL nightly</text>
<line x1="185" y1="111" x2="225" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<line x1="420" y1="111" x2="460" y2="111" stroke="#dc2626" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
<text class="note" x="440.0" y="103.0" text-anchor="middle">project</text>
<line x1="675" y1="111" x2="715" y2="111" stroke="#2563eb" stroke-width="1.55" marker-end="url(#ah-blue)"/>
<text class="note" x="695.0" y="103.0" text-anchor="middle">ZREVRANGE</text>
<line x1="322" y1="150" x2="200" y2="212" stroke="#15803d" stroke-width="1.55" marker-end="url(#ah-green)"/>
<text class="note" x="238.0" y="178.0" text-anchor="middle">ACID TX</text>
<line x1="567" y1="150" x2="510" y2="212" stroke="#b45309" stroke-width="1.55" marker-end="url(#ah-amber)"/>
<text class="note" x="565.0" y="184.0" text-anchor="middle">score key</text>
<line x1="805" y1="212" x2="640" y2="150" stroke="#64748b" stroke-width="1.55" stroke-dasharray="5 3" marker-end="url(#ah-slate)"/>
<text class="note" x="748.0" y="180.0" text-anchor="middle">rebuild</text>
</svg>

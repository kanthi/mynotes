<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Pulumi dependency DAG showing VPC and RandomPassword created in parallel, feeding outputs into RDS Instance and SecurityGroup, which then feed Output.all to build a connection string export" color-scheme="light">
<rect width="820" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Outputs Build the Resource Dependency DAG</text>
<rect x="34" y="62" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="124" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">VPC (parallel)</text>
<text x="124" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">out: vpc.id</text>
<rect x="34" y="182" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="124" y="208" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">RandomPassword</text>
<text x="124" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">out: pwd.result [secret]</text>
<rect x="290" y="62" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="380" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">SecurityGroup</text>
<text x="380" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">in: vpc_id=vpc.id</text>
<rect x="290" y="182" width="180" height="64" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="380" y="208" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">RDS Database</text>
<text x="380" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">in: sg.id + pwd.result</text>
<rect x="556" y="120" width="230" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="671" y="148" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2a36">Output.all(...).apply()</text>
<text x="671" y="168" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">export db_url [secret]</text>
<line x1="214" y1="94" x2="288" y2="94" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="214" y1="214" x2="288" y2="214" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="380" y1="126" x2="380" y2="180" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="205" x2="554" y2="165" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="214" y1="230" x2="554" y2="176" stroke="#3b5b85" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="410" y="298" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">create follows edges left-to-right; destroy walks the exact reverse order</text>
</svg>

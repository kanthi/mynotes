<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Pulumi architecture showing a user program running in a language host communicating over gRPC with the deployment engine, which reads and writes stack state in a backend and invokes resource providers to call cloud APIs" color-scheme="light">
<rect width="820" height="340" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Pulumi Execution Architecture</text>
<rect x="28" y="64" width="165" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="110.5" y="94" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Your Program</text>
<text x="110.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Python / TS / Go / YAML</text>
<rect x="235" y="64" width="155" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="312.5" y="94" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Language Host</text>
<text x="312.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">executes SDK code</text>
<rect x="438" y="56" width="170" height="88" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="523" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Deployment Engine</text>
<text x="523" y="108" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">diffs desired vs state</text>
<text x="523" y="124" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">orders DAG in parallel</text>
<rect x="652" y="64" width="140" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="722" y="94" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Cloud APIs</text>
<text x="722" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">AWS / GCP / K8s</text>
<rect x="235" y="210" width="245" height="68" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="357.5" y="238" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">State Backend + Secrets</text>
<text x="357.5" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Pulumi Cloud / S3 / GCS / file://</text>
<rect x="520" y="210" width="272" height="68" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="656" y="238" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Resource Provider Plugins</text>
<text x="656" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Check / Diff / Create / Update / Delete</text>
<line x1="193" y1="100" x2="233" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="390" y1="100" x2="436" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="413" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">gRPC</text>
<line x1="485" y1="144" x2="405" y2="208" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="412" y="178" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">checkpoints</text>
<line x1="560" y1="144" x2="620" y2="208" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="615" y="178" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">gRPC</text>
<line x1="722" y1="210" x2="722" y2="138" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="766" y="178" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">HTTPS API</text>
<text x="410" y="316" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">SDK registers desired resources; engine reconciles state; providers mutate live infrastructure</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Pulumi unit testing architecture showing pytest running a Pulumi program against an in-memory Mocks monitor implementing new_resource and call instead of real cloud providers" color-scheme="light">
<rect width="820" height="320" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">In-Memory Unit Testing with Pulumi Mocks</text>
<rect x="28" y="68" width="160" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="108" y="96" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">pytest / unittest</text>
<text x="108" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">set_mocks() + runpy</text>
<rect x="228" y="68" width="176" height="72" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="316" y="96" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Pulumi Program</text>
<text x="316" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Resources + Invokes</text>
<rect x="444" y="58" width="196" height="92" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="542" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Mock Monitor (RAM)</text>
<text x="542" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">new_resource() -> [id, state]</text>
<text x="542" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">call() -> {result}</text>
<rect x="676" y="68" width="118" height="72" rx="8" fill="#f4f7fb" stroke="#5a6b7d" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="735" y="96" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#5a6b7d">Cloud APIs</text>
<text x="735" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">bypassed</text>
<rect x="228" y="198" width="412" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="434" y="224" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1f2a36">@pulumi.runtime.test -> output.apply(assert)</text>
<text x="434" y="244" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a6b7d">verifies tags, CIDR rules, encryption, IAM invariants in milliseconds</text>
<line x1="188" y1="104" x2="226" y2="104" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="404" y1="104" x2="442" y2="104" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="104" x2="674" y2="104" stroke="#5a6b7d" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="542" y1="150" x2="490" y2="196" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="565" y="178" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">synthetic Output[T]</text>
<text x="410" y="294" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">zero cloud credentials, zero CLI daemon, sub-second CI feedback</text>
</svg>

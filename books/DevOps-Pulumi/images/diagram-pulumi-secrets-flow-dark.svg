<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Pulumi secrets lifecycle showing plaintext encrypted by a secrets provider into ciphertext in Pulumi.stack.yaml, decrypted in memory during deployment, propagated as tainted secret outputs, and re-encrypted in stack state" color-scheme="dark">
<rect width="820" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">How Pulumi Encrypts and Propagates Secrets</text>
<rect x="26" y="64" width="180" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="116" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#e6edf5">config set --secret</text>
<text x="116" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">plaintext input</text>
<rect x="252" y="58" width="188" height="80" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="346" y="88" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Secrets Provider</text>
<text x="346" y="106" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Pulumi Cloud / KMS</text>
<text x="346" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Vault / Passphrase</text>
<rect x="488" y="64" width="150" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="563" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#e6edf5">Pulumi.prod.yaml</text>
<text x="563" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">safe to commit</text>
<rect x="668" y="64" width="128" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="732" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e6edf5">Git Repo</text>
<text x="732" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">secure: AAAB...</text>
<rect x="120" y="196" width="250" height="72" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="245" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Program Runtime (in-memory)</text>
<text x="245" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">require_secret() -> Output[secret]</text>
<rect x="430" y="196" width="280" height="72" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
<text x="570" y="224" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Derived Outputs + State File</text>
<text x="570" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">tainted secret -> encrypted at rest</text>
<line x1="206" y1="98" x2="250" y2="98" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="440" y1="98" x2="486" y2="98" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="638" y1="98" x2="666" y2="98" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="320" y1="138" x2="265" y2="194" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="248" y="170" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">decrypt on up</text>
<line x1="370" y1="232" x2="428" y2="232" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="399" y="222" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">apply</text>
<text x="410" y="302" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">secret tainting follows Output.apply/all; resource IDs stay plaintext</text>
</svg>

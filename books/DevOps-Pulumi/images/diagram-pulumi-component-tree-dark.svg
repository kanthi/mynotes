<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Pulumi ComponentResource hierarchy showing Stack root parenting acme:index:ServiceCredentials which parents RandomPet and RandomPassword with parent=self and exposes outputs via register_outputs" color-scheme="dark">
<rect width="820" height="340" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">ComponentResource Ownership &amp; URN Hierarchy</text>
<rect x="260" y="52" width="300" height="48" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="410" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi:pulumi:Stack (my-app-dev)</text>
<text x="410" y="90" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">root node in state checkpoint</text>
<rect x="190" y="132" width="440" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="410" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">acme:index:ServiceCredentials ("api")</text>
<text x="410" y="178" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">inherits providers, protect, aliases, transforms -> register_outputs()</text>
<rect x="70" y="232" width="300" height="62" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="220" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">random:RandomPet ("api-user")</text>
<text x="220" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">opts=ResourceOptions(parent=self)</text>
<rect x="450" y="232" width="300" height="62" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="600" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">random:RandomPassword ("api-password")</text>
<text x="600" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">opts=ResourceOptions(parent=self)</text>
<line x1="410" y1="100" x2="410" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="192" x2="235" y2="230" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="192" x2="585" y2="230" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="322" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">child URN embeds parent type: ...::acme:index:ServiceCredentials$random:index/randomPet:RandomPet::api-user</text>
</svg>

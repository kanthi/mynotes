<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-label="Pulumi stack deployment lifecycle showing pulumi new, pulumi preview dry-run diff, pulumi up applying changes to live infrastructure and state, pulumi refresh reconciling external drift, and pulumi destroy tearing down resources" color-scheme="dark">
<rect width="820" height="310" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="410" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Pulumi Infrastructure Lifecycle</text>
<rect x="24" y="72" width="132" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="90" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi new</text>
<text x="90" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">scaffold project</text>
<rect x="188" y="72" width="136" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="256" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi preview</text>
<text x="256" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">dry-run diff only</text>
<rect x="356" y="68" width="136" height="76" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="424" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi up</text>
<text x="424" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">create / update</text>
<text x="424" y="135" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">+ write state</text>
<rect x="524" y="72" width="132" height="68" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="590" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi refresh</text>
<text x="590" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">sync live drift</text>
<rect x="684" y="72" width="116" height="68" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="1.8"/>
<text x="742" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#e6edf5">pulumi destroy</text>
<text x="742" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#9fb0c3">reverse teardown</text>
<rect x="230" y="198" width="380" height="58" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="420" y="223" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Stack State Checkpoint (Backend)</text>
<text x="420" y="242" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">URNs, provider IDs, inputs, encrypted secrets, exports</text>
<line x1="156" y1="106" x2="186" y2="106" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="324" y1="106" x2="354" y2="106" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="492" y1="106" x2="522" y2="106" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="656" y1="106" x2="682" y2="106" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="256" y1="198" x2="256" y2="142" stroke="#7fa7d9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="225" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">reads</text>
<line x1="424" y1="144" x2="424" y2="196" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="456" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">writes</text>
<line x1="590" y1="140" x2="550" y2="196" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="605" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">reconciles</text>
<text x="410" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">preview never mutates; up converges cloud to code; refresh converges state to cloud</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="3-2-1 backup architecture from consistent snapshot through encrypted deduplicated archive to verified restore drill" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Production Linux Backup Pipeline: Snapshot, Deduplicate, Encrypt, Restore-Test</text>
  <rect x="25" y="70" width="165" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="107.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">1. Snapshot</text>
  <text x="107.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">LVM / Btrfs / ZFS</text>
  <text x="107.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">or pg_dump</text>
  <text x="107.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Crash-consistent</text>
  <rect x="225" y="70" width="175" height="100" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="312.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">2. Dedupe + Crypt</text>
  <text x="312.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">restic / borgbackup</text>
  <text x="312.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Content-chunked</text>
  <text x="312.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Client-side AEAD</text>
  <rect x="435" y="70" width="165" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="517.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">3. Offsite Copy</text>
  <text x="517.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">3 copies, 2 media,</text>
  <text x="517.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">1 immutable offsite</text>
  <text x="517.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">(Object Lock)</text>
  <rect x="635" y="70" width="160" height="100" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="715.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">4. Restore Drill</text>
  <text x="715.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Automated verify</text>
  <text x="715.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Checksums + boot</text>
  <text x="715.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Untested != backup</text>
  <line x1="190" y1="120" x2="225" y2="120" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
  <line x1="400" y1="120" x2="435" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="417" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>
  <line x1="600" y1="120" x2="635" y2="120" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="617" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
</svg>

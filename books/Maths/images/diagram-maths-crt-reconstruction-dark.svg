<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Chinese Remainder Theorem splitting modulo pq into parallel mod p and mod q computations" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Chinese Remainder Theorem (CRT): Parallel Residue Arithmetic mod p and mod q</text>
  <rect x="30" y="70" width="185" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="122.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Input x mod (p*q)</text>
  <text x="122.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Large modulus N</text>
  <text x="122.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">gcd(p, q) = 1</text>
  <rect x="265" y="45" width="220" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="375.0" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Branch 1: x1 = x mod p</text>
  <text x="375.0" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Half bit-width -&gt; 4x faster</text>
  <rect x="265" y="125" width="220" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="375.0" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Branch 2: x2 = x mod q</text>
  <text x="375.0" y="169" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Computed in parallel</text>
  <rect x="545" y="70" width="245" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="667.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Garner / CRT Recombine</text>
  <text x="667.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Unique x in [0, p*q - 1]</text>
  <text x="667.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Used in RSA signing (~4x)</text>
  <line x1="215" y1="100" x2="265" y2="75" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="238" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">mod p</text>
  <line x1="215" y1="140" x2="265" y2="155" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="238" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">mod q</text>
  <line x1="485" y1="75" x2="545" y2="105" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">recombine</text>
  <line x1="485" y1="155" x2="545" y2="135" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
</svg>

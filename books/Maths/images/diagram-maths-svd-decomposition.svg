<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Singular Value Decomposition A = U Sigma V^T geometric action on vectors" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">Singular Value Decomposition (A = U Sigma V^T): Rotate, Stretch, Rotate</text>
  <rect x="25" y="70" width="165" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="107.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Input Vector x</text>
  <text x="107.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Unit sphere in R^n</text>
  <rect x="225" y="70" width="165" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="307.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">V^T (Orthogonal)</text>
  <text x="307.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Aligns with right</text>
  <text x="307.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">singular basis</text>
  <rect x="425" y="70" width="170" height="100" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="510.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Sigma (Diagonal)</text>
  <text x="510.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Scales axes by</text>
  <text x="510.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">sigma_1 &gt;= sigma_2..</text>
  <rect x="630" y="70" width="165" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="712.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">U (Orthogonal)</text>
  <text x="712.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Rotates into output</text>
  <text x="712.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">column space R^m</text>
  <line x1="190" y1="120" x2="225" y2="120" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
  <line x1="390" y1="120" x2="425" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="407" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>
  <line x1="595" y1="120" x2="630" y2="120" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
</svg>

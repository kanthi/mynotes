<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 353" role="img" aria-label="Local bridge forwarding changes to a VXLAN tunnel after a VM move. Controller updates travel separately." color-scheme="light">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d0d9e4" stroke-width=".65"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#25699f"/></marker></defs>
<rect width="760" height="353" rx="12" fill="#eef2f7"/><rect width="760" height="353" rx="12" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif" fill="#2a3542">
<text x="32" y="38" text-anchor="start" font-size="21" font-weight="650" fill="#2a3542">The same guest destination, before and after a move</text>
<text x="32" y="79" text-anchor="start" font-size="16" font-weight="650" fill="#25699f">Before</text>
<rect x="144" y="55" width="160" height="52" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="224.0" y="86.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">VM A on H1</text>
<rect x="448" y="55" width="160" height="52" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="528.0" y="86.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">VM B on H1</text>
<line x1="304" y1="81" x2="446" y2="81" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="374" y="68" text-anchor="middle" font-size="14" font-weight="400" fill="#2a3542">H1 bridge</text>
<text x="32" y="141" text-anchor="start" font-size="16" font-weight="650" fill="#25699f">After</text>
<rect x="124" y="154" width="182" height="62" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="215.0" y="182.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">H1 · 192.0.2.11</text>
<text x="215.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">VM A attached</text>
<rect x="448" y="154" width="188" height="62" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="542.0" y="182.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">H2 · 192.0.2.12</text>
<text x="542.0" y="204.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">VM B attached</text>
<line x1="306" y1="185" x2="446" y2="185" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="376" y="174" text-anchor="middle" font-size="14" font-weight="400" fill="#2a3542">VXLAN / IP</text>
<rect x="267" y="258" width="220" height="48" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="377.0" y="287.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Controller</text>
<line x1="290" y1="258" x2="222" y2="217" stroke="#25699f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="464" y1="258" x2="531" y2="217" stroke="#25699f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="380" y="333" text-anchor="middle" font-size="15" font-weight="400" fill="#2a3542">Dashed arrows install mappings. Guest frames follow the solid path.</text>
</g></svg>

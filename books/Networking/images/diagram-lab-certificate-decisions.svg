<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Change only the service name or only the trusted root to obtain independent certificate verification failures." color-scheme="light">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d0d9e4" stroke-width=".65"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#25699f"/></marker></defs>
<rect width="760" height="320" rx="12" fill="#eef2f7"/><rect width="760" height="320" rx="12" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif" fill="#2a3542">
<text x="28" y="36" text-anchor="start" font-size="21" font-weight="650" fill="#2a3542">Verify the same leaf certificate three times</text>
<rect x="125" y="55" width="510" height="55" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="380.0" y="79.5" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Leaf SAN · inventory.example</text>
<text x="380.0" y="101.5" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">Issued by Inventory Lab CA</text>
<line x1="380" y1="110" x2="130" y2="160" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="380" y1="110" x2="380" y2="160" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="380" y1="110" x2="630" y2="160" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="22" y="163" width="216" height="70" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="130.0" y="195.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Inventory Lab CA</text>
<text x="130.0" y="217.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">inventory.example</text>
<text x="130" y="263" text-anchor="middle" font-size="16" font-weight="650" fill="#25699f">Verification succeeds</text>
<rect x="272" y="163" width="216" height="70" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="380.0" y="195.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Inventory Lab CA</text>
<text x="380.0" y="217.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">reports.example</text>
<text x="380" y="263" text-anchor="middle" font-size="16" font-weight="650" fill="#25699f">Name mismatch</text>
<rect x="522" y="163" width="216" height="70" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="630.0" y="195.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Other Lab CA</text>
<text x="630.0" y="217.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">inventory.example</text>
<text x="630" y="263" text-anchor="middle" font-size="16" font-weight="650" fill="#25699f">No trusted path</text>
<text x="380" y="299" text-anchor="middle" font-size="15" font-weight="400" fill="#2a3542">Each box gives the trusted root and the name the client intends to reach.</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Network forensics pipeline from TAP or SPAN mirror through packet capture to Zeek and Suricata, SIEM correlation, and triage and containment" color-scheme="dark">
  <defs>
    <pattern id="grid-fp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow-fp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .flow { fill: none; stroke: #60a5fa; stroke-width: 1.8; stroke-linecap: round; marker-end: url(#arrow-fp); }
      .dash { fill: none; stroke: #60a5fa; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="820" height="340" rx="16" fill="#1c2129"/>
  <rect width="820" height="340" rx="16" fill="url(#grid-fp)"/>
  <rect x="8" y="8" width="804" height="324" rx="12" fill="none" stroke="#3a4452"/>

  <text x="410" y="32" text-anchor="middle" class="title">Network Forensics &amp; PCAP Triage Pipeline</text>
  <text x="410" y="48" text-anchor="middle" class="muted">Passive wire acquisition → lossless ring-buffer capture → parallel metadata &amp; signature analysis → correlated timeline</text>

  <!-- Stage 1: TAP / SPAN -->
  <g>
    <rect x="26" y="130" width="124" height="72" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <text x="88" y="154" text-anchor="middle" class="label">Network TAP</text>
    <text x="88" y="169" text-anchor="middle" class="label">/ SPAN</text>
    <text x="88" y="188" text-anchor="middle" class="mono">passive mirror</text>
  </g>

  <!-- Stage 2: Packet Capture -->
  <g>
    <rect x="186" y="130" width="134" height="72" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <text x="253" y="154" text-anchor="middle" class="label">Packet Capture</text>
    <text x="253" y="171" text-anchor="middle" class="mono">tcpdump / AF_PACKET</text>
    <text x="253" y="188" text-anchor="middle" class="muted">ring-buffer PCAPs</text>
  </g>

  <!-- Stage 3a: Zeek -->
  <g>
    <rect x="362" y="78" width="144" height="74" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <text x="434" y="101" text-anchor="middle" class="label">Zeek</text>
    <text x="434" y="117" text-anchor="middle" class="muted">protocol metadata logs</text>
    <text x="434" y="135" text-anchor="middle" class="mono">conn · dns · ssl · http</text>
  </g>

  <!-- Stage 3b: Suricata -->
  <g>
    <rect x="362" y="180" width="144" height="74" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <text x="434" y="203" text-anchor="middle" class="label">Suricata</text>
    <text x="434" y="219" text-anchor="middle" class="muted">IDS alerts &amp; signatures</text>
    <text x="434" y="237" text-anchor="middle" class="mono">eve.json · fast.log</text>
  </g>

  <!-- Stage 4: SIEM / Correlation -->
  <g>
    <rect x="546" y="130" width="118" height="72" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <text x="605" y="154" text-anchor="middle" class="label">SIEM /</text>
    <text x="605" y="169" text-anchor="middle" class="label">Correlation</text>
    <text x="605" y="188" text-anchor="middle" class="mono">5-tuple · uid join</text>
  </g>

  <!-- Stage 5: Triage & Containment -->
  <g>
    <rect x="698" y="130" width="98" height="72" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="747" y="154" text-anchor="middle" class="label">Triage &amp;</text>
    <text x="747" y="169" text-anchor="middle" class="label">Containment</text>
    <text x="747" y="188" text-anchor="middle" class="mono">timeline · IOCs</text>
  </g>

  <!-- Arrows -->
  <path class="flow" d="M150,166 H182"/>
  <path class="flow" d="M320,156 C340,156 340,115 358,115"/>
  <path class="flow" d="M320,176 C340,176 340,217 358,217"/>
  <path class="flow" d="M506,115 C524,115 524,156 542,156"/>
  <path class="flow" d="M506,217 C524,217 524,176 542,176"/>
  <path class="flow" d="M664,166 H694"/>

  <!-- Bottom role chips / evidence trail -->
  <g>
    <rect x="26" y="276" width="124" height="32" rx="16" fill="#332a42" stroke="#8b7aa8"/>
    <text x="88" y="296" text-anchor="middle" class="mono">1 · Acquire</text>
  </g>
  <g>
    <rect x="186" y="276" width="134" height="32" rx="16" fill="#332a42" stroke="#8b7aa8"/>
    <text x="253" y="296" text-anchor="middle" class="mono">2 · Preserve (SHA-256)</text>
  </g>
  <g>
    <rect x="362" y="276" width="144" height="32" rx="16" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="434" y="296" text-anchor="middle" class="mono">3 · Parse &amp; Detect</text>
  </g>
  <g>
    <rect x="546" y="276" width="250" height="32" rx="16" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="671" y="296" text-anchor="middle" class="mono">4 · Pivot (tshark) &amp; Contain</text>
  </g>

  <path class="dash" d="M88,202 V276"/>
  <path class="dash" d="M253,202 V276"/>
  <path class="dash" d="M434,254 V276"/>
  <path class="dash" d="M605,202 V276"/>
</svg>

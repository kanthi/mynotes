<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-label="Two Kubernetes clusters connected by Cilium ClusterMesh WireGuard/VXLAN tunnels with global services, CiliumNetworkPolicy enforcement, and Hubble eBPF flow telemetry." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e2e8f0}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e2e8f0}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#94a3b8}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<text class="t" x="20" y="28">Cilium ClusterMesh and Hubble eBPF Observability</text>
<rect x="20" y="55" width="280" height="110" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.4"/>
<text class="l" x="160.0" y="90.0" text-anchor="middle">Cluster A (10.1.0.0/16)</text>
<text class="l" x="160.0" y="106.0" text-anchor="middle">Pod -&gt; eBPF sockops (no kube-proxy)</text>
<text class="l" x="160.0" y="122.0" text-anchor="middle">CiliumNetworkPolicy L3/L4/L7</text>
<text class="l" x="160.0" y="138.0" text-anchor="middle">Service: api.prod (global: true)</text>
<rect x="420" y="55" width="280" height="110" rx="8" fill="#143524" stroke="#4ade80" stroke-width="1.4"/>
<text class="l" x="560.0" y="90.0" text-anchor="middle">Cluster B (10.2.0.0/16)</text>
<text class="l" x="560.0" y="106.0" text-anchor="middle">api.prod Endpoints (Ready)</text>
<text class="l" x="560.0" y="122.0" text-anchor="middle">CiliumNetworkPolicy Enforced</text>
<text class="l" x="560.0" y="138.0" text-anchor="middle">Local Endpoint Failover</text>
<rect x="200" y="195" width="320" height="70" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="1.4"/>
<text class="l" x="360.0" y="226.0" text-anchor="middle">Hubble Relay &amp; UI (eBPF Ring Buffer)</text>
<text class="l" x="360.0" y="242.0" text-anchor="middle">Live DNS, HTTP, and DROPPED verdict telemetry</text>
<line x1="300" y1="100" x2="420" y2="100" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="360.0" y="94.0" text-anchor="middle">ClusterMesh</text>
<line x1="420" y1="125" x2="300" y2="125" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="360.0" y="119.0" text-anchor="middle">WireGuard</text>
<line x1="160" y1="165" x2="270" y2="195" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="215.0" y="174.0" text-anchor="middle">flows</text>
<line x1="560" y1="165" x2="450" y2="195" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="505.0" y="174.0" text-anchor="middle">flows</text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="SD-WAN multipath application steering and XOR Forward Error Correction over dual WAN links" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">SD-WAN Multipath Steering &amp; Forward Error Correction (FEC)</text>
  <rect x="30" y="70" width="190" height="105" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="125.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Branch Edge</text>
  <text x="125.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SLA probes (loss/jitter)</text>
  <text x="125.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Voice -&gt; MPLS + FEC</text>
  <text x="125.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Bulk -&gt; Broadband</text>
  <rect x="285" y="45" width="225" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="397.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">WAN 1 (MPLS / Fiber)</text>
  <text x="397.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">RTT 18ms, 0.0% loss -&gt; Active</text>
  <rect x="285" y="130" width="225" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="397.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">WAN 2 (5G / Cable)</text>
  <text x="397.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">RTT 45ms, 2.5% loss -&gt; Parity FEC</text>
  <rect x="575" y="70" width="215" height="105" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="682.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Hub Gateway</text>
  <text x="682.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Reorders packets</text>
  <text x="682.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">XOR-recovers lost frame</text>
  <text x="682.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero TCP retransmit</text>
  <line x1="220" y1="100" x2="285" y2="75" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9">data</text>
  <line x1="220" y1="140" x2="285" y2="155" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="252" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b">parity</text>
  <line x1="510" y1="75" x2="575" y2="105" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="542" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
  <line x1="510" y1="155" x2="575" y2="135" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="542" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b"></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-label="Linux kernel ingress packet path from NIC RX ring through XDP hook actions DROP, TX, REDIRECT, PASS, then sk_buff allocation, TC-BPF ingress, Netfilter nftables, and userspace socket">
  <defs>
    <pattern id="grid-xdp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.6px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #3d4f5f; }
      .flow { fill: none; stroke: #3b82c4; stroke-width: 2; marker-end: url(#arr-b); }
      .drop { fill: none; stroke: #dc2626; stroke-width: 1.8; marker-end: url(#arr-r); }
      .tx { fill: none; stroke: #d97706; stroke-width: 1.8; marker-end: url(#arr-a); }
      .redir { fill: none; stroke: #7c3aed; stroke-width: 1.8; marker-end: url(#arr-p); }
    </style>
  </defs>

  <rect width="840" height="380" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="380" rx="16" fill="url(#grid-xdp)"/>
  <rect x="8" y="8" width="824" height="364" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">Linux Kernel Packet Path: NIC -&gt; XDP -&gt; TC-BPF -&gt; Netfilter -&gt; Socket</text>
  <text x="420" y="46" text-anchor="middle" class="muted">XDP runs inside the NIC driver before sk_buff allocation, enabling line-rate drops, hairpins, and redirects</text>

  <!-- Main horizontal pipeline -->
  <!-- 1. NIC RX Ring -->
  <rect x="26" y="96" width="106" height="72" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="79" y="122" text-anchor="middle" class="label">NIC RX Ring</text>
  <text x="79" y="138" text-anchor="middle" class="mono">DMA buffer</text>
  <text x="79" y="153" text-anchor="middle" class="muted">Raw frame</text>

  <!-- 2. XDP Hook -->
  <rect x="162" y="88" width="128" height="88" rx="10" fill="#dbeafe" stroke="#3b82c4" stroke-width="1.8"/>
  <text x="226" y="114" text-anchor="middle" class="label">XDP Hook</text>
  <text x="226" y="131" text-anchor="middle" class="mono">xdp_buff</text>
  <text x="226" y="147" text-anchor="middle" class="muted">Pre-sk_buff</text>
  <text x="226" y="162" text-anchor="middle" class="muted">Native / Offload</text>

  <!-- 3. sk_buff alloc -->
  <rect x="330" y="96" width="104" height="72" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="382" y="122" text-anchor="middle" class="label">sk_buff</text>
  <text x="382" y="138" text-anchor="middle" class="mono">alloc + GRO</text>
  <text x="382" y="153" text-anchor="middle" class="muted">Kernel metadata</text>

  <!-- 4. TC-BPF -->
  <rect x="462" y="96" width="110" height="72" rx="10" fill="#efe6f6" stroke="#c4b0d8" stroke-width="1.5"/>
  <text x="517" y="122" text-anchor="middle" class="label">TC-BPF</text>
  <text x="517" y="138" text-anchor="middle" class="mono">clsact ingress</text>
  <text x="517" y="153" text-anchor="middle" class="muted">NAT / Policy</text>

  <!-- 5. Netfilter / nftables -->
  <rect x="600" y="96" width="110" height="72" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="655" y="122" text-anchor="middle" class="label">Netfilter</text>
  <text x="655" y="138" text-anchor="middle" class="mono">nftables / IP</text>
  <text x="655" y="153" text-anchor="middle" class="muted">Routing + CT</text>

  <!-- 6. Socket / App -->
  <rect x="736" y="96" width="80" height="72" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="776" y="122" text-anchor="middle" class="label">Socket</text>
  <text x="776" y="138" text-anchor="middle" class="mono">TCP/UDP</text>
  <text x="776" y="153" text-anchor="middle" class="muted">Userspace</text>

  <!-- Main arrows -->
  <path class="flow" d="M132,132 H160"/>
  <path class="flow" d="M290,132 H328"/>
  <text x="309" y="123" text-anchor="middle" class="mono">PASS</text>
  <path class="flow" d="M434,132 H460"/>
  <path class="flow" d="M572,132 H598"/>
  <path class="flow" d="M710,132 H734"/>

  <!-- XDP Fast-Path Branches -->
  <!-- XDP_DROP -->
  <path class="drop" d="M196,176 V236"/>
  <rect x="132" y="238" width="126" height="58" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="195" y="259" text-anchor="middle" class="label">XDP_DROP</text>
  <text x="195" y="275" text-anchor="middle" class="mono">Recycle RX page</text>
  <text x="195" y="289" text-anchor="middle" class="muted">DDoS mitigation</text>

  <!-- XDP_TX -->
  <path class="tx" d="M226,176 V210 H79 V170"/>
  <rect x="26" y="238" width="94" height="58" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="73" y="259" text-anchor="middle" class="label">XDP_TX</text>
  <text x="73" y="275" text-anchor="middle" class="mono">Same NIC TX</text>
  <text x="73" y="289" text-anchor="middle" class="muted">L4 DSR hairpin</text>

  <!-- XDP_REDIRECT -->
  <path class="redir" d="M262,176 V214 H360 V236"/>
  <rect x="282" y="238" width="178" height="58" rx="8" fill="#efe6f6" stroke="#c4b0d8" stroke-width="1.4"/>
  <text x="371" y="259" text-anchor="middle" class="label">XDP_REDIRECT</text>
  <text x="371" y="275" text-anchor="middle" class="mono">Other NIC / veth / AF_XDP</text>
  <text x="371" y="289" text-anchor="middle" class="muted">DEVMAP · CPUMAP · XSKMAP</text>

  <!-- Cost / Visibility callout box -->
  <rect x="490" y="238" width="326" height="58" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.2"/>
  <text x="506" y="258" class="label">Performance vs Kernel Context</text>
  <text x="506" y="274" class="muted">Left (XDP): lowest CPU cost, zero sk_buff, raw L2-L4 bytes</text>
  <text x="506" y="288" class="muted">Right (TC/NF): full sk_buff, conntrack, routing, L7 sockets</text>

  <!-- Footer legend -->
  <text x="420" y="342" text-anchor="middle" class="muted">Tip: tcpdump taps at AF_PACKET after XDP; packets dropped or redirected by XDP never appear in tcpdump.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="Multicast RPF and PIM-SM failure exercise topology with source src, routers r1 (RP), r2, r3, r4, VLAN 20 bridge, and receivers h1 and h2">
  <defs>
    <pattern id="grid-mcast" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.4px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.8px; fill: #3d4f5f; }
      .badge-b { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 8.8px; font-weight: 700; fill: #3b82c4; }
      .badge-g { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 8.8px; font-weight: 700; fill: #15803d; }
      .badge-r { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 8.8px; font-weight: 700; fill: #b91c1c; }
      .flow-pri { fill: none; stroke: #3b82c4; stroke-width: 2.2; marker-end: url(#arr-blue); }
      .flow-rx { fill: none; stroke: #15803d; stroke-width: 2; marker-end: url(#arr-green); }
      .flow-alt { fill: none; stroke: #b91c1c; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#arr-red); }
      .link-idle { fill: none; stroke: #8b9bb0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-mcast)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">Multicast PIM-SM &amp; RPF Failure Exercise Topology</text>
  <text x="420" y="46" text-anchor="middle" class="muted">OSPF Area 0 + PIM-SM across r1 (RP), r2, r3, and r4; Drill 3 shifts r2 RPF toward r4 to trigger wrong-IIF drops</text>

  <!-- Source src -->
  <rect x="24" y="138" width="118" height="100" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="83" y="158" text-anchor="middle" class="label">Source (src)</text>
  <text x="83" y="175" text-anchor="middle" class="mono">192.0.2.10/24</text>
  <text x="83" y="191" text-anchor="middle" class="mono">ASM: 239.1.1.1</text>
  <text x="83" y="206" text-anchor="middle" class="mono">SSM: 232.1.1.1</text>
  <text x="83" y="224" text-anchor="middle" class="muted">UDP TTL=16</text>

  <!-- Router r1 (RP) -->
  <rect x="180" y="128" width="124" height="120" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="242" y="148" text-anchor="middle" class="label">r1 (FRR · RP)</text>
  <rect x="192" y="155" width="100" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="242" y="167" text-anchor="middle" class="badge-b">RP 192.0.2.1</text>
  <text x="192" y="188" class="mono">e1: 192.0.2.1/24</text>
  <text x="192" y="203" class="mono">e2: 10.1.12.1/30</text>
  <text x="192" y="218" class="mono">e3: 10.1.14.1/30</text>
  <text x="192" y="235" class="muted">First-hop + RP</text>

  <!-- Router r2 -->
  <rect x="356" y="84" width="130" height="106" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="421" y="104" text-anchor="middle" class="label">r2 (FRR · Core)</text>
  <text x="368" y="122" class="mono">lo: 10.0.0.2/32</text>
  <text x="368" y="137" class="mono">e1: 10.1.12.2 (IIF)</text>
  <text x="368" y="152" class="mono">e2: 10.1.23.1 (OIL)</text>
  <text x="368" y="167" class="mono">e3: 10.1.24.1 (alt)</text>
  <text x="368" y="182" class="muted">RPF check point</text>

  <!-- Router r4 (Alternate path) -->
  <rect x="356" y="256" width="130" height="94" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="421" y="276" text-anchor="middle" class="label">r4 (FRR · Alt)</text>
  <text x="368" y="294" class="mono">lo: 10.0.0.4/32</text>
  <text x="368" y="309" class="mono">e1: 10.1.14.2/30</text>
  <text x="368" y="324" class="mono">e2: 10.1.24.2/30</text>
  <text x="368" y="340" class="badge-r">OSPF cost 100</text>

  <!-- Router r3 (Last-hop) -->
  <rect x="536" y="84" width="128" height="106" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="600" y="104" text-anchor="middle" class="label">r3 (FRR · LHR)</text>
  <text x="548" y="122" class="mono">lo: 10.0.0.3/32</text>
  <text x="548" y="137" class="mono">e1: 10.1.23.2 (IIF)</text>
  <text x="548" y="152" class="mono">e2: 10.20.0.1/24</text>
  <text x="548" y="168" class="badge-g">IGMPv3 Querier</text>
  <text x="548" y="182" class="muted">Last-hop PIM DR</text>

  <!-- VLAN 20 Bridge / Switch -->
  <rect x="536" y="232" width="128" height="58" rx="8" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="600" y="252" text-anchor="middle" class="label">sw1 (VLAN 20)</text>
  <text x="600" y="268" text-anchor="middle" class="mono">Linux br0 · 10.20.0.0/24</text>
  <text x="600" y="282" text-anchor="middle" class="muted">IGMP snooping on</text>

  <!-- Receiver h1 -->
  <rect x="702" y="176" width="114" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="759" y="196" text-anchor="middle" class="label">h1 (Receiver)</text>
  <text x="759" y="213" text-anchor="middle" class="mono">10.20.0.11/24</text>
  <text x="759" y="230" text-anchor="middle" class="badge-g">Joins 239.1.1.1</text>

  <!-- Receiver h2 -->
  <rect x="702" y="274" width="114" height="72" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="759" y="294" text-anchor="middle" class="label">h2 (Control)</text>
  <text x="759" y="311" text-anchor="middle" class="mono">10.20.0.12/24</text>
  <text x="759" y="328" text-anchor="middle" class="muted">Not joined initially</text>

  <!-- Primary Multicast Path Arrows -->
  <path class="flow-pri" d="M142,188 H178"/>
  <path class="flow-pri" d="M304,164 L354,136"/>
  <text x="316" y="133" class="mono">cost 10</text>
  <path class="flow-pri" d="M486,136 H534"/>
  <path class="flow-rx" d="M600,190 V230"/>
  <path class="flow-rx" d="M664,248 L700,214"/>
  <path class="link-idle" d="M664,274 L700,308"/>

  <!-- Alternate Path (RPF Drill 3) -->
  <path class="flow-alt" d="M304,218 L354,286"/>
  <path class="flow-alt" d="M421,256 V192"/>
  <text x="428" y="228" class="badge-r">Drill 3: RPF via r4</text>

  <!-- Legend footer -->
  <line x1="30" y1="404" x2="64" y2="404" stroke="#3b82c4" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="72" y="407" class="muted">Baseline PIM-SM tree (S,G)</text>
  <line x1="250" y1="404" x2="284" y2="404" stroke="#15803d" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="292" y="407" class="muted">IGMPv3 joined receiver delivery</text>
  <line x1="496" y1="404" x2="530" y2="404" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
  <text x="538" y="407" class="muted">Alternate path (RPF asymmetry drill)</text>
</svg>

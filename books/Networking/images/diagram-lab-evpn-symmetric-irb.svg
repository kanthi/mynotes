<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="Lab 59 EVPN-VXLAN Symmetric IRB and Type-5 fabric topology with spine1, spine2, leaf1, leaf2, border1, ext1, h1 on VLAN 10, and h2 on VLAN 20 routing through L3VNI 10099 in VRF TENANT-A">
  <defs>
    <pattern id="grid-59" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #3d4f5f; }
      .badge-green { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.8px; font-weight: 700; fill: #15803d; }
      .badge-amber { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.8px; font-weight: 700; fill: #b45309; }
      .underlay { fill: none; stroke: #8b9bb0; stroke-width: 1.5; }
      .l3vni { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arr-green); }
      .type5 { fill: none; stroke: #b45309; stroke-width: 2; marker-end: url(#arr-amber); }
      .access { fill: none; stroke: #3b82c4; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-59)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="29" text-anchor="middle" class="title">Lab 59: EVPN-VXLAN Symmetric IRB (L3VNI 10099) &amp; Border-Leaf Type-5 Fabric</text>
  <text x="420" y="45" text-anchor="middle" class="muted">2-Spine / 2-Leaf / 1-Border-Leaf eBGP fabric: VRF TENANT-A routes VLAN 10 &lt;-&gt; VLAN 20 and exports ext1 via Type-5</text>

  <!-- Underlay Clos links (drawn behind nodes) -->
  <line class="underlay" x1="270" y1="126" x2="150" y2="196"/>
  <line class="underlay" x1="270" y1="126" x2="420" y2="196"/>
  <line class="underlay" x1="270" y1="126" x2="690" y2="196"/>
  <line class="underlay" x1="570" y1="126" x2="150" y2="196"/>
  <line class="underlay" x1="570" y1="126" x2="420" y2="196"/>
  <line class="underlay" x1="570" y1="126" x2="690" y2="196"/>

  <!-- Spine 1 -->
  <rect x="180" y="66" width="180" height="60" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="270" y="86" text-anchor="middle" class="label">spine1 (AS 65000)</text>
  <text x="270" y="101" text-anchor="middle" class="mono">Lo0: 10.255.0.101/32</text>
  <text x="270" y="116" text-anchor="middle" class="muted">eBGP Underlay + EVPN RS</text>

  <!-- Spine 2 -->
  <rect x="480" y="66" width="180" height="60" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="570" y="86" text-anchor="middle" class="label">spine2 (AS 65000)</text>
  <text x="570" y="101" text-anchor="middle" class="mono">Lo0: 10.255.0.102/32</text>
  <text x="570" y="116" text-anchor="middle" class="muted">eBGP Underlay + EVPN RS</text>

  <!-- Leaf 1 -->
  <rect x="38" y="196" width="224" height="92" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="150" y="215" text-anchor="middle" class="label">leaf1 (AS 65001)</text>
  <text x="150" y="230" text-anchor="middle" class="mono">VTEP: 10.255.0.1/32</text>
  <text x="150" y="245" text-anchor="middle" class="mono">VLAN 10 / L2VNI 10010</text>
  <text x="150" y="260" text-anchor="middle" class="mono">Anycast GW: 10.10.10.1/24</text>
  <text x="150" y="276" text-anchor="middle" class="badge-green">VRF TENANT-A · L3VNI 10099</text>

  <!-- Leaf 2 -->
  <rect x="308" y="196" width="224" height="92" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="420" y="215" text-anchor="middle" class="label">leaf2 (AS 65002)</text>
  <text x="420" y="230" text-anchor="middle" class="mono">VTEP: 10.255.0.2/32</text>
  <text x="420" y="245" text-anchor="middle" class="mono">VLAN 20 / L2VNI 10020</text>
  <text x="420" y="260" text-anchor="middle" class="mono">Anycast GW: 10.10.20.1/24</text>
  <text x="420" y="276" text-anchor="middle" class="badge-green">VRF TENANT-A · L3VNI 10099</text>

  <!-- Border 1 -->
  <rect x="578" y="196" width="224" height="92" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="690" y="215" text-anchor="middle" class="label">border1 (AS 65003)</text>
  <text x="690" y="230" text-anchor="middle" class="mono">VTEP: 10.255.0.3/32</text>
  <text x="690" y="245" text-anchor="middle" class="mono">eBGP -&gt; ext1 (172.16.99.0/30)</text>
  <text x="690" y="260" text-anchor="middle" class="badge-amber">EVPN Type-5: 198.51.100.0/24</text>
  <text x="690" y="276" text-anchor="middle" class="badge-green">VRF TENANT-A · L3VNI 10099</text>

  <!-- Overlay L3VNI tunnel indicator between leaf1, leaf2, border1 -->
  <path class="l3vni" d="M262,242 H306"/>
  <path class="type5" d="M578,242 H534"/>

  <!-- Access links -->
  <line class="access" x1="150" y1="288" x2="150" y2="322"/>
  <line class="access" x1="420" y1="288" x2="420" y2="322"/>
  <line class="type5" x1="690" y1="322" x2="690" y2="290"/>

  <!-- Host h1 -->
  <rect x="64" y="322" width="172" height="54" rx="8" fill="#dbeafe" stroke="#3b82c4" stroke-width="1.3"/>
  <text x="150" y="342" text-anchor="middle" class="label">h1 (VLAN 10)</text>
  <text x="150" y="357" text-anchor="middle" class="mono">10.10.10.11/24 · gw .10.1</text>

  <!-- Host h2 -->
  <rect x="334" y="322" width="172" height="54" rx="8" fill="#dbeafe" stroke="#3b82c4" stroke-width="1.3"/>
  <text x="420" y="342" text-anchor="middle" class="label">h2 (VLAN 20)</text>
  <text x="420" y="357" text-anchor="middle" class="mono">10.10.20.12/24 · gw .20.1</text>

  <!-- External Router ext1 -->
  <rect x="604" y="322" width="172" height="54" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="690" y="342" text-anchor="middle" class="label">ext1 (AS 65099)</text>
  <text x="690" y="357" text-anchor="middle" class="mono">Lo0: 198.51.100.1/24</text>

  <!-- Legend footer -->
  <line x1="34" y1="406" x2="64" y2="406" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="72" y="409" class="muted">eBGP Clos underlay (ECMP)</text>
  <line x1="246" y1="406" x2="276" y2="406" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="284" y="409" class="muted">Symmetric IRB VXLAN (L3VNI 10099 + RMAC)</text>
  <line x1="566" y1="406" x2="596" y2="406" stroke="#b45309" stroke-width="2"/>
  <text x="604" y="409" class="muted">EVPN Type-5 external prefix</text>
</svg>

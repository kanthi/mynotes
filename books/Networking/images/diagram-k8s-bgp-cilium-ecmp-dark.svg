<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="Kubernetes BGP ECMP ingress and Cilium Egress Gateway architecture showing FRR Top-of-Rack switches peering eBGP with worker nodes for LoadBalancer VIP 203.0.113.10/32 and routing outbound pod traffic through a static egress gateway node" color-scheme="dark">
  <defs>
    <pattern id="grid-kbgp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.6px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #c5d0dc; }
      .ingress { fill: none; stroke: #60a5fa; stroke-width: 2; marker-end: url(#arr-blue); }
      .egress { fill: none; stroke: #fbbf24; stroke-width: 2; marker-end: url(#arr-amber); }
      .bgp { fill: none; stroke: #a78bfa; stroke-width: 1.5; stroke-dasharray: 4 4; marker-end: url(#arr-purple); }
    </style>
  </defs>

  <rect width="860" height="440" rx="16" fill="#1c2129"/>
  <rect width="860" height="440" rx="16" fill="url(#grid-kbgp)"/>
  <rect x="8" y="8" width="844" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="430" y="30" text-anchor="middle" class="title">Kubernetes BGP ECMP Ingress &amp; Cilium Egress Gateway</text>
  <text x="430" y="46" text-anchor="middle" class="muted">eBGP advertises LoadBalancer /32 VIPs (externalTrafficPolicy: Local) while Egress Gateway SNATs outbound Pod flows</text>

  <!-- External Network / ToR Leaf -->
  <rect x="190" y="64" width="480" height="68" rx="10" fill="#232a35" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="208" y="84" class="label">Top-of-Rack FRR Leaf Switch (ASN 65000)</text>
  <text x="652" y="84" text-anchor="end" class="mono">10.0.10.1/24</text>
  <text x="208" y="102" class="mono">ECMP FIB: 203.0.113.10/32 -&gt; [10.0.10.11, 10.0.10.12] (only nodes with ready local Pods)</text>
  <text x="208" y="118" class="mono">Pod CIDRs: 10.244.1.0/24 -&gt; .11  |  10.244.2.0/24 -&gt; .12  |  Firewall allows 198.51.100.50</text>

  <!-- Worker Node 1 -->
  <rect x="28" y="182" width="248" height="202" rx="12" fill="#232a35" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="44" y="202" class="label">Worker Node 1</text>
  <text x="260" y="202" text-anchor="end" class="mono">10.0.10.11 | AS 65100</text>

  <rect x="42" y="214" width="220" height="46" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="54" y="232" class="label">Cilium BGP / MetalLB</text>
  <text x="54" y="248" class="mono">Adv: 203.0.113.10/32 + 10.244.1.0/24</text>

  <rect x="42" y="272" width="220" height="46" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.3"/>
  <text x="54" y="290" class="label">App Pod A (Local Backend)</text>
  <text x="54" y="306" class="mono">10.244.1.8 | sees real client IP</text>

  <rect x="42" y="330" width="220" height="40" rx="8" fill="#3f3119" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="54" y="348" class="label">Egress Policy Match</text>
  <text x="54" y="362" class="mono">VXLAN/Geneve -&gt; Egress GW Node</text>

  <!-- Worker Node 2 -->
  <rect x="306" y="182" width="248" height="202" rx="12" fill="#232a35" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="322" y="202" class="label">Worker Node 2</text>
  <text x="538" y="202" text-anchor="end" class="mono">10.0.10.12 | AS 65100</text>

  <rect x="320" y="214" width="220" height="46" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="332" y="232" class="label">Cilium BGP / MetalLB</text>
  <text x="332" y="248" class="mono">Adv: 203.0.113.10/32 + 10.244.2.0/24</text>

  <rect x="320" y="272" width="220" height="46" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.3"/>
  <text x="332" y="290" class="label">App Pod B (Local Backend)</text>
  <text x="332" y="306" class="mono">10.244.2.14 | sees real client IP</text>

  <rect x="320" y="330" width="220" height="40" rx="8" fill="#1b3a2d" stroke="#4ade80" stroke-width="1.2"/>
  <text x="332" y="348" class="label">No Cross-Node Hop</text>
  <text x="332" y="362" class="mono">externalTrafficPolicy: Local</text>

  <!-- Egress Gateway Node -->
  <rect x="584" y="182" width="248" height="202" rx="12" fill="#232a35" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="600" y="202" class="label">Egress Gateway Node</text>
  <text x="816" y="202" text-anchor="end" class="mono">10.0.10.20</text>

  <rect x="598" y="214" width="220" height="54" rx="8" fill="#3f3119" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="610" y="232" class="label">Cilium Egress Gateway</text>
  <text x="610" y="248" class="mono">SNAT: 10.244.1.8 -&gt; 198.51.100.50</text>
  <text x="610" y="261" class="muted">Deterministic IP for external ACLs</text>

  <rect x="598" y="282" width="220" height="88" rx="8" fill="#332a42" stroke="#8b7aa8" stroke-width="1.3"/>
  <text x="610" y="300" class="label">Multi-Cluster Extension</text>
  <text x="610" y="316" class="mono">ClusterMesh: shared etcd/CRD</text>
  <text x="610" y="330" class="mono">Native Pod routing or IPsec</text>
  <text x="610" y="344" class="mono">Global Services across clusters</text>
  <text x="610" y="358" class="muted">Non-overlapping Pod CIDRs</text>

  <!-- Ingress ECMP arrows from ToR -->
  <path class="ingress" d="M310,132 L152,180"/>
  <path class="ingress" d="M430,132 L430,180"/>

  <!-- BGP control arrows up -->
  <path class="bgp" d="M182,182 L338,134"/>
  <path class="bgp" d="M454,182 L454,134"/>

  <!-- Egress flow from Worker 1 -> Egress GW -> ToR -->
  <path class="egress" d="M262,350 C420,398 520,398 596,246"/>
  <path class="egress" d="M708,182 L580,134"/>

  <!-- Footer Legend -->
  <line x1="36" y1="414" x2="68" y2="414" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="76" y="417" class="muted">ECMP Ingress to VIP 203.0.113.10</text>
  <line x1="290" y1="414" x2="322" y2="414" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-purple)"/>
  <text x="330" y="417" class="muted">eBGP /32 VIP + Pod CIDR routes</text>
  <line x1="546" y1="414" x2="578" y2="414" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="586" y="417" class="muted">Egress Gateway SNAT (198.51.100.50)</text>
</svg>

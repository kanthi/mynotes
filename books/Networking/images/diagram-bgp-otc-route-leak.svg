<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="RFC 9234 BGP Roles and Only-to-Customer attribute preventing a valley route leak between Provider A, Customer B, and Provider C">
  <defs>
    <pattern id="grid-otc" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.6px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.1px; fill: #3d4f5f; }
      .step { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .badge-b { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #3b82c4; }
      .badge-r { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #b91c1c; }
      .badge-a { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #b45309; }
      .flow-dn { fill: none; stroke: #3b82c4; stroke-width: 2.2; marker-end: url(#arr-blue); }
      .flow-lk { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-dasharray: 6 4; marker-end: url(#arr-red); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-otc)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">RFC 9234 BGP Roles &amp; Only-to-Customer (OTC) Route Leak Prevention</text>
  <text x="420" y="46" text-anchor="middle" class="muted">Provider A stamps OTC=64501 on egress to Customer B; Provider C rejects the leaked prefix on ingress from Customer B</text>

  <!-- Provider A -->
  <rect x="30" y="76" width="234" height="122" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="44" y="96" class="label">Provider A (AS64501)</text>
  <text x="44" y="113" class="mono">BGP Role: Provider</text>
  <text x="44" y="129" class="mono">Route: 203.0.113.0/24</text>
  <text x="44" y="145" class="muted">Egress to Customer:</text>
  <rect x="44" y="155" width="206" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="147" y="173" text-anchor="middle" class="badge-b">Set OTC = 64501 (Attr 35)</text>

  <!-- RFC 9234 Rules Summary Box -->
  <rect x="294" y="76" width="252" height="106" rx="10" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="420" y="96" text-anchor="middle" class="label">RFC 9234 Enforcement Rules</text>
  <text x="308" y="116" class="mono">Egress (P-&gt;C, Peer, RS-&gt;Client):</text>
  <text x="308" y="131" class="muted">Add OTC=local_AS if not present</text>
  <text x="308" y="150" class="mono">Ingress (from C, Peer, RS-Client):</text>
  <text x="308" y="165" class="muted">If OTC is present -&gt; REJECT UPDATE</text>

  <!-- Provider C -->
  <rect x="576" y="76" width="234" height="136" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="590" y="96" class="label">Provider C (AS64503)</text>
  <text x="590" y="113" class="mono">BGP Role: Provider</text>
  <text x="590" y="129" class="mono">Ingress from Customer B:</text>
  <text x="590" y="145" class="mono">Sees OTC = 64501 present!</text>
  <rect x="590" y="158" width="206" height="38" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="693" y="174" text-anchor="middle" class="badge-r">REJECT ROUTE LEAK</text>
  <text x="693" y="188" text-anchor="middle" class="muted">Dropped before Loc-RIB</text>

  <!-- Customer B -->
  <rect x="266" y="256" width="308" height="114" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="282" y="276" class="label">Multi-Homed Customer B (AS64502)</text>
  <text x="282" y="293" class="mono">BGP Role: Customer (to both A &amp; C)</text>
  <text x="282" y="310" class="muted">Misconfigured export policy leaks Provider A's</text>
  <text x="282" y="324" class="muted">route toward Provider C (Type-1 valley leak)</text>
  <rect x="282" y="334" width="276" height="24" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="420" y="350" text-anchor="middle" class="badge-a">Optional transitive OTC=64501 stays attached</text>

  <!-- Step 1 Arrow: Provider A -> Customer B -->
  <path class="flow-dn" d="M147,198 V312 H264"/>
  <circle cx="147" cy="248" r="9" fill="#3b82c4"/>
  <text x="147" y="251" text-anchor="middle" class="step">1</text>
  <text x="162" y="244" class="mono">203.0.113.0/24</text>
  <text x="162" y="258" class="mono">OTC: 64501</text>

  <!-- Step 2 Arrow: Customer B -> Provider C -->
  <path class="flow-lk" d="M574,312 H693 V215"/>
  <circle cx="693" cy="264" r="9" fill="#b91c1c"/>
  <text x="693" y="267" text-anchor="middle" class="step">2</text>
  <text x="708" y="260" class="mono">Leaked route</text>
  <text x="708" y="274" class="mono">OTC: 64501</text>

  <!-- Legend footer -->
  <line x1="36" y1="404" x2="72" y2="404" stroke="#3b82c4" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="80" y="407" class="muted">Step 1: Provider A advertises route downward and stamps OTC=64501</text>
  <line x1="452" y1="404" x2="488" y2="404" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-red)"/>
  <text x="496" y="407" class="muted">Step 2: Customer B leaks upward; Provider C drops on OTC</text>
</svg>

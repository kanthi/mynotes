<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" role="img" aria-label="Comparison of Linux kernel dataplane, FRR routing daemon, Arista EOS Sysdb, and Nokia SR Linux gNMI/YANG management plane." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Network OS Planes: Linux, FRR, Arista EOS &amp; Nokia SR Linux</text>
<rect x="20" y="55" width="155" height="110" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="97.5" y="90.0" text-anchor="middle">Linux Host</text>
<text class="l" x="97.5" y="106.0" text-anchor="middle">iproute2 / nftables</text>
<text class="l" x="97.5" y="122.0" text-anchor="middle">Kernel FIB &amp; netns</text>
<text class="l" x="97.5" y="138.0" text-anchor="middle">ss / tcpdump</text>
<rect x="195" y="55" width="155" height="110" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="272.5" y="90.0" text-anchor="middle">FRR (vtysh)</text>
<text class="l" x="272.5" y="106.0" text-anchor="middle">bgpd / ospfd / zebra</text>
<text class="l" x="272.5" y="122.0" text-anchor="middle">Programs Linux FIB</text>
<text class="l" x="272.5" y="138.0" text-anchor="middle">via Netlink</text>
<rect x="370" y="55" width="160" height="110" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="450.0" y="90.0" text-anchor="middle">Arista EOS / cEOS</text>
<text class="l" x="450.0" y="106.0" text-anchor="middle">Cli / eAPI / gNMI</text>
<text class="l" x="450.0" y="122.0" text-anchor="middle">Sysdb state store</text>
<text class="l" x="450.0" y="138.0" text-anchor="middle">show ip bgp / route</text>
<rect x="550" y="55" width="150" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="l" x="625.0" y="90.0" text-anchor="middle">Nokia SR Linux</text>
<text class="l" x="625.0" y="106.0" text-anchor="middle">sr_cli / YANG / gNMI</text>
<text class="l" x="625.0" y="122.0" text-anchor="middle">NetOps-native</text>
<text class="l" x="625.0" y="138.0" text-anchor="middle">info from state</text>
<rect x="110" y="195" width="500" height="60" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="360.0" y="229.0" text-anchor="middle">Shared Verification Goal: Control Plane (RIB/BGP) == Data Plane (FIB/Hardware)</text>

</svg>
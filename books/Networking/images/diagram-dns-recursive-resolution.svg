<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="DNS recursive resolution and iterative referral chain from Stub Resolver to Recursive Resolver cache check through Root, TLD, and Authoritative servers with numbered steps and TTL caching">
  <defs>
    <pattern id="grid-dns" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.2px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #3d4f5f; }
      .step { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .flow-q { fill: none; stroke: #3b82c4; stroke-width: 1.9; marker-end: url(#arr-blue); }
      .flow-a { fill: none; stroke: #15803d; stroke-width: 1.8; stroke-dasharray: 5 3; marker-end: url(#arr-green); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-dns)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">DNS Recursive Resolution &amp; Iterative Referral Chain</text>
  <text x="420" y="46" text-anchor="middle" class="sub">Stub asks Recursive Resolver (RD=1); on cache miss, resolver iteratively walks Root -&gt; TLD -&gt; Authoritative (RD=0) and caches by TTL</text>

  <!-- Stub Resolver -->
  <rect x="26" y="148" width="136" height="122" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="94" y="170" text-anchor="middle" class="label">Stub Resolver</text>
  <text x="94" y="185" text-anchor="middle" class="mono">/etc/resolv.conf</text>
  <rect x="38" y="198" width="112" height="58" rx="6" fill="#eef3f9" stroke="#d9e2ec"/>
  <text x="94" y="214" text-anchor="middle" class="mono">App lookup:</text>
  <text x="94" y="229" text-anchor="middle" class="mono">www.example.com</text>
  <text x="94" y="245" text-anchor="middle" class="small">Type A · RD=1</text>

  <!-- Recursive Resolver -->
  <rect x="252" y="72" width="174" height="278" rx="12" fill="#eef3f9" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="339" y="94" text-anchor="middle" class="label">Recursive Resolver</text>
  <text x="339" y="109" text-anchor="middle" class="mono">Unbound / 8.8.8.8</text>

  <!-- Cache Check Box -->
  <rect x="268" y="124" width="142" height="78" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="339" y="143" text-anchor="middle" class="label">1. TTL Cache Check</text>
  <text x="339" y="159" text-anchor="middle" class="small">HIT -&gt; reply immediately</text>
  <text x="339" y="173" text-anchor="middle" class="small">(AA=0, remaining TTL)</text>
  <text x="339" y="190" text-anchor="middle" class="mono">MISS -&gt; iterate (RD=0)</text>

  <!-- Cache Store Box -->
  <rect x="268" y="222" width="142" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.3"/>
  <text x="339" y="241" text-anchor="middle" class="label">2. Cache Populate</text>
  <text x="339" y="258" text-anchor="middle" class="mono">.com NS (TTL 172800s)</text>
  <text x="339" y="274" text-anchor="middle" class="mono">example.com NS + glue</text>
  <text x="339" y="290" text-anchor="middle" class="mono">www A 93.184.216.34</text>
  <text x="339" y="306" text-anchor="middle" class="small">Cached for TTL=300s</text>
  <text x="339" y="321" text-anchor="middle" class="small">Next clients skip 2-7</text>

  <!-- Right Column: Authoritative Hierarchy -->
  <!-- Root -->
  <rect x="598" y="72" width="216" height="78" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="612" y="92" class="label">Root Server (.)</text>
  <text x="800" y="92" text-anchor="end" class="mono">a-m.root-servers</text>
  <text x="612" y="110" class="mono">Knows TLD NS delegations</text>
  <text x="612" y="126" class="small">Refers to .com NS + glue IPs</text>
  <text x="612" y="140" class="small">Never recurses for clients</text>

  <!-- TLD -->
  <rect x="598" y="172" width="216" height="78" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="612" y="192" class="label">TLD Server (.com)</text>
  <text x="800" y="192" text-anchor="end" class="mono">gtld-servers.net</text>
  <text x="612" y="210" class="mono">Knows domain NS records</text>
  <text x="612" y="226" class="small">Refers to ns1.example.com</text>
  <text x="612" y="240" class="small">Supplies glue if in-bailiwick</text>

  <!-- Authoritative -->
  <rect x="598" y="272" width="216" height="78" rx="10" fill="#dbeafe" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="612" y="292" class="label">Authoritative Server</text>
  <text x="800" y="292" text-anchor="end" class="mono">ns1.example.com</text>
  <text x="612" y="310" class="mono">Zone owner: example.com</text>
  <text x="612" y="326" class="mono">A 93.184.216.34 (TTL 300)</text>
  <text x="612" y="340" class="small">Flags: AA=1 (Authoritative)</text>

  <!-- Arrows: Stub <-> Recursive -->
  <path class="flow-q" d="M162,180 H248"/>
  <circle cx="180" cy="170" r="8" fill="#3b82c4"/><text x="180" y="173" text-anchor="middle" class="step">1</text>
  <text x="208" y="173" text-anchor="middle" class="mono">RD=1?</text>

  <path class="flow-a" d="M252,238 H166"/>
  <circle cx="234" cy="252" r="8" fill="#15803d"/><text x="234" y="255" text-anchor="middle" class="step">8</text>
  <text x="200" y="255" text-anchor="middle" class="mono">A + TTL</text>

  <!-- Arrows: Recursive <-> Root -->
  <path class="flow-q" d="M426,98 H594"/>
  <circle cx="446" cy="88" r="8" fill="#3b82c4"/><text x="446" y="91" text-anchor="middle" class="step">2</text>
  <text x="524" y="91" text-anchor="middle" class="mono">Q: www.example.com?</text>

  <path class="flow-a" d="M598,124 H430"/>
  <circle cx="576" cy="136" r="8" fill="#15803d"/><text x="576" y="139" text-anchor="middle" class="step">3</text>
  <text x="502" y="139" text-anchor="middle" class="mono">Ref: .com NS + glue</text>

  <!-- Arrows: Recursive <-> TLD -->
  <path class="flow-q" d="M426,198 H594"/>
  <circle cx="446" cy="188" r="8" fill="#3b82c4"/><text x="446" y="191" text-anchor="middle" class="step">4</text>
  <text x="524" y="191" text-anchor="middle" class="mono">Q: www.example.com?</text>

  <path class="flow-a" d="M598,224 H430"/>
  <circle cx="576" cy="236" r="8" fill="#15803d"/><text x="576" y="239" text-anchor="middle" class="step">5</text>
  <text x="502" y="239" text-anchor="middle" class="mono">Ref: ns1.example.com</text>

  <!-- Arrows: Recursive <-> Auth -->
  <path class="flow-q" d="M426,298 H594"/>
  <circle cx="446" cy="288" r="8" fill="#3b82c4"/><text x="446" y="291" text-anchor="middle" class="step">6</text>
  <text x="524" y="291" text-anchor="middle" class="mono">Q: www.example.com?</text>

  <path class="flow-a" d="M598,324 H430"/>
  <circle cx="576" cy="336" r="8" fill="#15803d"/><text x="576" y="339" text-anchor="middle" class="step">7</text>
  <text x="502" y="339" text-anchor="middle" class="mono">93.184.216.34 (AA=1)</text>

  <!-- Bottom Summary Banner -->
  <rect x="26" y="366" width="788" height="32" rx="8" fill="#eef3f9" stroke="#d9e2ec"/>
  <text x="420" y="385" text-anchor="middle" class="mono">Cache HIT path: Steps 1 -&gt; 8 only (sub-ms)  |  Cache MISS path: Steps 1 -&gt; 2..7 -&gt; 8 (cached per record TTL)</text>

  <!-- Footer Legend -->
  <line x1="36" y1="416" x2="64" y2="416" stroke="#3b82c4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="72" y="419" class="sub">DNS Query (RD=1 stub / RD=0 iterative)</text>
  <line x1="316" y1="416" x2="344" y2="416" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="352" y="419" class="sub">Referral or Answer Response</text>
  <rect x="546" y="410" width="14" height="10" rx="2" fill="#dcfce7" stroke="#86efac"/>
  <text x="566" y="419" class="sub">TTL Cache Layer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="dark" aria-label="Forged-origin Type-1 BGP hijack bypassing RPKI ROV: Attacker AS64599 appends Victim AS64512 to AS_PATH, causing Observer AS64530 to evaluate the forged announcement as ROV Valid">
  <defs>
    <pattern id="grid-forged" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#f87171"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.6px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.1px; fill: #c5d0dc; }
      .badge-g { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #4ade80; }
      .badge-r { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #f87171; }
      .badge-a { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #fbbf24; }
      .flow-ok { fill: none; stroke: #4ade80; stroke-width: 2; marker-end: url(#arr-green); }
      .flow-bad { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arr-red); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#1c2129"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-forged)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="420" y="30" text-anchor="middle" class="title">Forged-Origin (Type-1) BGP Hijack Bypassing RPKI ROV</text>
  <text x="420" y="46" text-anchor="middle" class="muted">Attacker appends the victim ASN as origin; ROV checks only the rightmost ASN and marks the forged path Valid</text>

  <!-- Victim AS64512 -->
  <rect x="28" y="74" width="212" height="106" rx="10" fill="#2a3140" stroke="#4ade80" stroke-width="1.6"/>
  <text x="42" y="94" class="label">Victim AS64512</text>
  <text x="42" y="111" class="mono">Prefix: 198.51.100.0/24</text>
  <text x="42" y="126" class="mono">AS_PATH: [64512]</text>
  <rect x="42" y="138" width="184" height="28" rx="6" fill="#1b3a2d" stroke="#4ade80" stroke-width="1"/>
  <text x="134" y="156" text-anchor="middle" class="badge-g">ROA: /24, maxLen 24, AS64512</text>

  <!-- Attacker AS64599 -->
  <rect x="28" y="236" width="212" height="118" rx="10" fill="#2a3140" stroke="#f87171" stroke-width="1.6"/>
  <text x="42" y="256" class="label">Attacker AS64599</text>
  <text x="42" y="273" class="mono">Forged: 198.51.100.0/24</text>
  <text x="42" y="288" class="mono">AS_PATH: [64599, 64512]</text>
  <text x="42" y="304" class="muted">Synthesizes fake link to 64512</text>
  <rect x="42" y="314" width="184" height="28" rx="6" fill="#3f1d24" stroke="#f87171" stroke-width="1"/>
  <text x="134" y="332" text-anchor="middle" class="badge-r">No peering with AS64512</text>

  <!-- Legitimate Transit AS64520 -->
  <rect x="304" y="84" width="206" height="86" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="318" y="104" class="label">Legit Transit AS64520</text>
  <text x="318" y="122" class="mono">198.51.100.0/24</text>
  <text x="318" y="138" class="mono">AS_PATH: [64520, 64512]</text>
  <text x="318" y="156" class="muted">Normal provider propagation</text>

  <!-- Permissive Upstream AS64550 -->
  <rect x="304" y="248" width="206" height="94" rx="10" fill="#2a3140" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="318" y="268" class="label">Upstream AS64550</text>
  <text x="318" y="286" class="mono">198.51.100.0/24</text>
  <text x="318" y="302" class="mono">AS_PATH: [64550, 64599, 64512]</text>
  <rect x="318" y="312" width="178" height="20" rx="5" fill="#3f3119" stroke="#fbbf24" stroke-width="1"/>
  <text x="407" y="325" text-anchor="middle" class="badge-a">Missing ASPA / IRR filter</text>

  <!-- Observer / Relying Party AS64530 -->
  <rect x="572" y="74" width="240" height="280" rx="12" fill="#232a35" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="588" y="96" class="label">Observer Network AS64530</text>
  <text x="588" y="111" class="muted">Enforces RPKI ROV (Drop Invalid)</text>

  <!-- RPKI ROV Check -->
  <rect x="588" y="124" width="208" height="108" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.3"/>
  <text x="600" y="142" class="label">1. RPKI ROV Lookup</text>
  <text x="600" y="159" class="mono">VRP: 198.51.100.0/24 -&gt; 64512</text>
  <text x="600" y="175" class="mono">Rightmost ASN: 64512 (match)</text>
  <text x="600" y="191" class="mono">Prefix length: /24 &lt;= 24</text>
  <rect x="600" y="200" width="184" height="22" rx="5" fill="#3f3119" stroke="#fbbf24" stroke-width="1"/>
  <text x="692" y="214" text-anchor="middle" class="badge-a">Forged route = ROV VALID</text>

  <!-- Best Path Result -->
  <rect x="588" y="246" width="208" height="94" rx="8" fill="#2a3140" stroke="#f87171" stroke-width="1.3"/>
  <text x="600" y="264" class="label">2. BGP Best-Path Selection</text>
  <text x="600" y="281" class="muted">ROV cannot distinguish forged path</text>
  <text x="600" y="296" class="muted">Higher LocalPref or shorter path</text>
  <text x="600" y="311" class="muted">selects attacker route</text>
  <text x="600" y="328" class="badge-r">Traffic hijacked to AS64599</text>

  <!-- Arrows -->
  <path class="flow-ok" d="M240,127 H302"/>
  <text x="271" y="119" text-anchor="middle" class="mono">[64512]</text>

  <path class="flow-ok" d="M510,127 H570"/>
  <text x="540" y="119" text-anchor="middle" class="mono">Valid</text>

  <path class="flow-bad" d="M240,295 H302"/>
  <text x="271" y="287" text-anchor="middle" class="mono">Forged</text>

  <path class="flow-bad" d="M510,295 H570"/>
  <text x="540" y="287" text-anchor="middle" class="mono">Valid!</text>

  <!-- Legend footer -->
  <line x1="36" y1="398" x2="72" y2="398" stroke="#4ade80" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="80" y="401" class="muted">Legitimate BGP UPDATE (AS64512 -&gt; AS64520 -&gt; AS64530)</text>
  <line x1="420" y1="398" x2="456" y2="398" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-red)"/>
  <text x="464" y="401" class="muted">Forged-origin UPDATE (bypasses ROV; needs ASPA / Peerlock)</text>
</svg>

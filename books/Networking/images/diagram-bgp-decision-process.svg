<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="BGP Best-Path Selection pipeline from Weight and LOCAL_PREF through Locally Originated, AS_PATH length, Origin, MED, eBGP over iBGP, IGP cost to Next-Hop, and Router ID showing router-local, AS-wide, and inter-AS attribute scopes">
  <defs>
    <pattern id="grid-bgp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.2px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #3d4f5f; }
      .num { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .pill { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 8.6px; font-weight: 700; fill: #2f3b4a; }
      .flow { fill: none; stroke: #3b82c4; stroke-width: 1.8; marker-end: url(#arr-blue); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-bgp)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">BGP Best-Path Selection Pipeline (Top-to-Bottom Tie-Breakers)</text>
  <text x="420" y="46" text-anchor="middle" class="sub">Evaluated in strict order per prefix; first criterion that differs selects the best path (policy attributes beat shortest path)</text>

  <!-- Pre-check banner -->
  <rect x="28" y="58" width="784" height="28" rx="7" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="420" y="76" text-anchor="middle" class="mono">Pre-check: Ignore paths with unreachable NEXT_HOP, AS_PATH loop (own ASN), or inbound policy deny</text>

  <!-- Left Column: Steps 1 to 5 -->
  <!-- Step 1 -->
  <rect x="28" y="98" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="46" cy="123" r="10" fill="#b45309"/><text x="46" y="126" text-anchor="middle" class="num">1</text>
  <text x="64" y="117" class="label">Highest Weight</text>
  <rect x="304" y="104" width="86" height="17" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="347" y="116" text-anchor="middle" class="pill">Router-Local</text>
  <text x="64" y="135" class="small">Cisco/FRR local knob (default 0; local orig 32768); never advertised</text>

  <!-- Step 2 -->
  <rect x="28" y="158" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="46" cy="183" r="10" fill="#3b82c4"/><text x="46" y="186" text-anchor="middle" class="num">2</text>
  <text x="64" y="177" class="label">Highest LOCAL_PREF</text>
  <rect x="304" y="164" width="86" height="17" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="347" y="176" text-anchor="middle" class="pill">AS-Wide (iBGP)</text>
  <text x="64" y="195" class="small">Default 100; primary knob for steering outbound traffic across an AS</text>

  <!-- Step 3 -->
  <rect x="28" y="218" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="46" cy="243" r="10" fill="#b45309"/><text x="46" y="246" text-anchor="middle" class="num">3</text>
  <text x="64" y="237" class="label">Locally Originated Route</text>
  <rect x="304" y="224" width="86" height="17" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="347" y="236" text-anchor="middle" class="pill">Router-Local</text>
  <text x="64" y="255" class="small">Prefer routes injected via network / aggregate / redistribute (0.0.0.0)</text>

  <!-- Step 4 -->
  <rect x="28" y="278" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="46" cy="303" r="10" fill="#15803d"/><text x="46" y="306" text-anchor="middle" class="num">4</text>
  <text x="64" y="297" class="label">Shortest AS_PATH Length</text>
  <rect x="304" y="284" width="86" height="17" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="347" y="296" text-anchor="middle" class="pill">Inter-AS</text>
  <text x="64" y="315" class="small">Fewest AS hops; AS-path prepending makes a path less preferred</text>

  <!-- Step 5 -->
  <rect x="28" y="338" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="46" cy="363" r="10" fill="#15803d"/><text x="46" y="366" text-anchor="middle" class="num">5</text>
  <text x="64" y="357" class="label">Lowest Origin Code</text>
  <rect x="304" y="344" width="86" height="17" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="347" y="356" text-anchor="middle" class="pill">Inter-AS</text>
  <text x="64" y="375" class="mono">IGP (i) &lt; EGP (e) &lt; Incomplete (?)</text>

  <!-- Right Column: Steps 6 to 9 + Winner -->
  <!-- Step 6 -->
  <rect x="440" y="98" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="458" cy="123" r="10" fill="#15803d"/><text x="458" y="126" text-anchor="middle" class="num">6</text>
  <text x="476" y="117" class="label">Lowest MED (Multi-Exit Discriminator)</text>
  <rect x="716" y="104" width="86" height="17" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="759" y="116" text-anchor="middle" class="pill">Inter-AS</text>
  <text x="476" y="135" class="small">Compared only for routes from same neighbor AS (unless always-compare)</text>

  <!-- Step 7 -->
  <rect x="440" y="158" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="458" cy="183" r="10" fill="#3b82c4"/><text x="458" y="186" text-anchor="middle" class="num">7</text>
  <text x="476" y="177" class="label">eBGP over iBGP</text>
  <rect x="716" y="164" width="86" height="17" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="759" y="176" text-anchor="middle" class="pill">AS-Wide</text>
  <text x="476" y="195" class="small">Hot-potato routing: exit local AS as soon as possible via eBGP peer</text>

  <!-- Step 8 -->
  <rect x="440" y="218" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="458" cy="243" r="10" fill="#3b82c4"/><text x="458" y="246" text-anchor="middle" class="num">8</text>
  <text x="476" y="237" class="label">Lowest IGP Cost to NEXT_HOP</text>
  <rect x="716" y="224" width="86" height="17" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="759" y="236" text-anchor="middle" class="pill">AS-Wide (IGP)</text>
  <text x="476" y="255" class="small">Closest border router by OSPF/IS-IS cost (ECMP multipath stops here)</text>

  <!-- Step 9 -->
  <rect x="440" y="278" width="372" height="50" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <circle cx="458" cy="303" r="10" fill="#b45309"/><text x="458" y="306" text-anchor="middle" class="num">9</text>
  <text x="476" y="297" class="label">Lowest Router ID / Peer IP</text>
  <rect x="716" y="284" width="86" height="17" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="759" y="296" text-anchor="middle" class="pill">Deterministic</text>
  <text x="476" y="315" class="small">Oldest eBGP path, then lowest BGP Router ID, then lowest neighbor IP</text>

  <!-- Winner Box -->
  <rect x="440" y="338" width="372" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="626" y="358" text-anchor="middle" class="label">Best Path Selected -&gt; Loc-RIB &amp; FIB</text>
  <text x="626" y="375" text-anchor="middle" class="small">Installed for forwarding and advertised to eligible BGP neighbors</text>

  <!-- Vertical Connectors Left -->
  <path class="flow" d="M214,86 V96"/>
  <path class="flow" d="M214,148 V156"/>
  <path class="flow" d="M214,208 V216"/>
  <path class="flow" d="M214,268 V276"/>
  <path class="flow" d="M214,328 V336"/>

  <!-- S-Connector from Step 5 to Step 6 -->
  <path class="flow" d="M400,363 H420 V123 H438"/>

  <!-- Vertical Connectors Right -->
  <path class="flow" d="M626,148 V156"/>
  <path class="flow" d="M626,208 V216"/>
  <path class="flow" d="M626,268 V276"/>
  <path class="flow" d="M626,328 V336"/>

  <!-- Footer Legend -->
  <rect x="28" y="408" width="14" height="10" rx="2" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="48" y="416" class="sub">Router-Local (Weight, Originated, ID)</text>
  <rect x="266" y="408" width="14" height="10" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="286" y="416" class="sub">AS-Wide Scope (LOCAL_PREF, eBGP/iBGP, IGP)</text>
  <rect x="546" y="408" width="14" height="10" rx="2" fill="#dcfce7" stroke="#86efac"/>
  <text x="566" y="416" class="sub">Inter-AS Scope (AS_PATH, Origin, MED)</text>
</svg>

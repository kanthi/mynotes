<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="TCP connection lifecycle showing three-way handshake, ESTABLISHED data transfer, four-way FIN close with TIME_WAIT 2xMSL, RST abort, compared with stateless UDP datagram delivery">
  <defs>
    <pattern id="grid-tcp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.4px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #3d4f5f; }
      .state { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.6px; font-weight: 700; fill: #2f3b4a; }
      .badge-txt { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .flow-blue { fill: none; stroke: #3b82c4; stroke-width: 1.9; marker-end: url(#arr-blue); }
      .flow-amber { fill: none; stroke: #b45309; stroke-width: 1.9; marker-end: url(#arr-amber); }
      .flow-red { fill: none; stroke: #b91c1c; stroke-width: 1.9; marker-end: url(#arr-red); }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 1.8; marker-end: url(#arr-green); }
      .flow-drop { fill: none; stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-tcp)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">TCP Connection Lifecycle vs UDP Stateless Delivery</text>
  <text x="420" y="46" text-anchor="middle" class="sub">TCP tracks state through 3-way handshake, full-duplex transfer, and 4-way FIN close (TIME_WAIT 2xMSL); UDP sends datagrams with zero state</text>

  <!-- Left Panel: TCP -->
  <rect x="24" y="60" width="546" height="338" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="40" y="79" class="label">TCP (Stateful Connection)</text>
  <text x="554" y="79" text-anchor="end" class="mono">Reliable · Ordered · Flow Control</text>

  <!-- Client / Server Headers -->
  <rect x="108" y="88" width="96" height="24" rx="6" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="156" y="104" text-anchor="middle" class="label">Client</text>

  <rect x="390" y="88" width="96" height="24" rx="6" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="438" y="104" text-anchor="middle" class="label">Server</text>

  <!-- Lifelines -->
  <line x1="156" y1="112" x2="156" y2="386" stroke="#8b9bb0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="438" y1="112" x2="438" y2="386" stroke="#8b9bb0" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- Phase 1: 3-Way Handshake -->
  <rect x="36" y="118" width="92" height="20" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="82" y="131" text-anchor="middle" class="state">SYN_SENT</text>

  <rect x="466" y="114" width="92" height="20" rx="5" fill="#ffffff" stroke="#8b9bb0"/>
  <text x="512" y="127" text-anchor="middle" class="state">LISTEN</text>

  <path class="flow-blue" d="M160,126 L432,140"/>
  <text x="296" y="128" text-anchor="middle" class="mono">1. SYN (seq=x)</text>

  <rect x="466" y="142" width="92" height="20" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="512" y="155" text-anchor="middle" class="state">SYN_RECV</text>

  <path class="flow-blue" d="M434,154 L162,168"/>
  <text x="296" y="156" text-anchor="middle" class="mono">2. SYN-ACK (seq=y, ack=x+1)</text>

  <path class="flow-blue" d="M160,180 L432,192"/>
  <text x="296" y="182" text-anchor="middle" class="mono">3. ACK (ack=y+1)</text>

  <!-- Phase 2: ESTABLISHED -->
  <rect x="112" y="202" width="370" height="30" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <text x="297" y="216" text-anchor="middle" class="label">ESTABLISHED — Full-Duplex Byte Stream</text>
  <text x="297" y="228" text-anchor="middle" class="small">Sliding window · ACKs · Retransmission · Congestion control</text>

  <!-- Phase 3: 4-Way FIN Close -->
  <rect x="36" y="242" width="92" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="82" y="255" text-anchor="middle" class="state">FIN_WAIT_1</text>

  <path class="flow-amber" d="M160,250 L432,262"/>
  <text x="296" y="251" text-anchor="middle" class="mono">4. FIN (seq=u)</text>

  <rect x="466" y="254" width="92" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="512" y="267" text-anchor="middle" class="state">CLOSE_WAIT</text>

  <path class="flow-amber" d="M434,274 L162,286"/>
  <text x="296" y="275" text-anchor="middle" class="mono">5. ACK (ack=u+1)</text>

  <rect x="36" y="280" width="92" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="82" y="293" text-anchor="middle" class="state">FIN_WAIT_2</text>

  <path class="flow-amber" d="M434,298 L162,310"/>
  <text x="296" y="299" text-anchor="middle" class="mono">6. FIN (seq=v)</text>

  <rect x="466" y="290" width="92" height="20" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="512" y="303" text-anchor="middle" class="state">LAST_ACK</text>

  <path class="flow-amber" d="M160,322 L432,334"/>
  <text x="296" y="323" text-anchor="middle" class="mono">7. ACK (ack=v+1)</text>

  <rect x="36" y="316" width="106" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <text x="89" y="328" text-anchor="middle" class="state">TIME_WAIT</text>
  <text x="89" y="339" text-anchor="middle" class="small">2xMSL (60s Linux)</text>

  <rect x="466" y="326" width="92" height="20" rx="5" fill="#ffffff" stroke="#8b9bb0"/>
  <text x="512" y="339" text-anchor="middle" class="state">CLOSED</text>

  <!-- Phase 4: RST Abort -->
  <rect x="112" y="354" width="370" height="32" rx="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.3"/>
  <path class="flow-red" d="M168,369 L422,369"/>
  <text x="297" y="365" text-anchor="middle" class="mono">RST (Abort) — Immediate teardown</text>
  <text x="297" y="380" text-anchor="middle" class="small">Skips FIN &amp; TIME_WAIT (closed port, firewall reset, app crash)</text>

  <!-- Right Panel: UDP -->
  <rect x="584" y="60" width="232" height="338" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="600" y="79" class="label">UDP (Stateless)</text>
  <text x="800" y="79" text-anchor="end" class="mono">0-RTT · 8B hdr</text>

  <rect x="600" y="92" width="76" height="24" rx="6" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="638" y="108" text-anchor="middle" class="label">Sender</text>

  <rect x="724" y="92" width="76" height="24" rx="6" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="762" y="108" text-anchor="middle" class="label">Receiver</text>

  <line x1="638" y1="116" x2="638" y2="222" stroke="#8b9bb0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="762" y1="116" x2="762" y2="222" stroke="#8b9bb0" stroke-width="1.4" stroke-dasharray="4 3"/>

  <path class="flow-green" d="M642,134 L756,144"/>
  <text x="700" y="132" text-anchor="middle" class="mono">Datagram 1</text>

  <path class="flow-drop" d="M642,164 L710,170"/>
  <text x="719" y="174" text-anchor="middle" class="label" fill="#b91c1c">X</text>
  <text x="700" y="160" text-anchor="middle" class="small">Lost (no retry)</text>

  <path class="flow-green" d="M758,196 L644,206"/>
  <text x="700" y="194" text-anchor="middle" class="mono">Reply (optional)</text>

  <!-- UDP Summary Cards -->
  <rect x="598" y="232" width="204" height="44" rx="7" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.2"/>
  <text x="610" y="249" class="label">No Connection State</text>
  <text x="610" y="264" class="small">No handshake, no FIN, no TIME_WAIT</text>

  <rect x="598" y="284" width="204" height="44" rx="7" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.2"/>
  <text x="610" y="301" class="label">Best-Effort Datagrams</text>
  <text x="610" y="316" class="small">App handles loss/order (e.g. QUIC)</text>

  <rect x="598" y="336" width="204" height="48" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="610" y="353" class="label">Common Workloads</text>
  <text x="610" y="368" class="mono">DNS · DHCP · VXLAN · WireGuard</text>
  <text x="610" y="379" class="mono">RTP/WebRTC · Telemetry</text>

  <!-- Footer Legend -->
  <line x1="36" y1="416" x2="62" y2="416" stroke="#3b82c4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="70" y="419" class="sub">3-Way Handshake</text>
  <rect x="174" y="410" width="14" height="10" rx="2" fill="#dcfce7" stroke="#86efac"/>
  <text x="194" y="419" class="sub">Established Data</text>
  <line x1="296" y1="416" x2="322" y2="416" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="330" y="419" class="sub">4-Way Close / TIME_WAIT</text>
  <line x1="472" y1="416" x2="498" y2="416" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="506" y="419" class="sub">RST Abort</text>
  <line x1="584" y1="416" x2="610" y2="416" stroke="#15803d" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="618" y="419" class="sub">Stateless UDP Datagram</text>
</svg>

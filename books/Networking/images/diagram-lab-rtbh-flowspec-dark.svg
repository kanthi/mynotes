<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="dark" aria-label="RTBH and BGP FlowSpec mitigation lab topology showing attacker behind isp1 AS 65001 sending UDP 123 flood and HTTP port 80 traffic to edge1 AS 65100, controlled by trigger DDoS controller via iBGP community 65100:666 and ipv4 flowspec to protect victim 203.0.113.50/32">
  <defs>
    <pattern id="grid-65" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#f87171"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #c5d0dc; }
      .badge { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #0f172a; }
      .atk { fill: none; stroke: #f87171; stroke-width: 2.2; marker-end: url(#arr-red); }
      .legit { fill: none; stroke: #4ade80; stroke-width: 2; marker-end: url(#arr-green); }
      .ctrl { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arr-blue); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#1c2129"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-65)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="420" y="30" text-anchor="middle" class="title">Lab 65: Destination RTBH vs. Surgical BGP FlowSpec Mitigation</text>
  <text x="420" y="46" text-anchor="middle" class="muted">Compare coarse community 65100:666 blackholing (192.0.2.66) against FlowSpec UDP/123 rate-limit 0 preserving TCP/80</text>

  <!-- Attacker -->
  <rect x="28" y="96" width="154" height="106" rx="10" fill="#2a3140" stroke="#f87171" stroke-width="1.6"/>
  <text x="105" y="116" text-anchor="middle" class="label">attacker</text>
  <text x="105" y="132" text-anchor="middle" class="mono">198.51.100.99/24</text>
  <text x="42" y="152" class="mono">Flood: UDP 53/123</text>
  <text x="42" y="167" class="mono">Legit: HTTP TCP/80</text>
  <text x="42" y="185" class="muted">hping3 / curl probes</text>

  <!-- Transit ISP -->
  <rect x="224" y="96" width="144" height="106" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="296" y="116" text-anchor="middle" class="label">isp1 (Transit)</text>
  <text x="296" y="131" text-anchor="middle" class="mono">AS 65001</text>
  <text x="236" y="152" class="mono">eth1: 198.51.100.1</text>
  <text x="236" y="167" class="mono">eth2: 172.16.0.1/30</text>
  <text x="236" y="185" class="muted">eBGP peer to edge1</text>

  <!-- Edge Router -->
  <rect x="420" y="82" width="196" height="136" rx="10" fill="#232a35" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="518" y="102" text-anchor="middle" class="label">edge1 (FRR bgpd + pbrd)</text>
  <text x="518" y="117" text-anchor="middle" class="mono">AS 65100 · lo 10.0.0.1</text>
  <text x="432" y="135" class="mono">eth1: 172.16.0.2/30 (isp1)</text>
  <text x="432" y="150" class="mono">eth2: 203.0.113.1/24 (LAN)</text>
  <text x="432" y="165" class="mono">eth3: 10.99.0.1/30 (ctrl)</text>
  <rect x="432" y="176" width="172" height="32" rx="6" fill="#3f3119" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="518" y="190" text-anchor="middle" class="mono">RTBH: 192.0.2.66 -&gt; blackhole</text>
  <text x="518" y="202" text-anchor="middle" class="mono">FlowSpec: iptables DROP UDP/123</text>

  <!-- Victim -->
  <rect x="664" y="96" width="148" height="106" rx="10" fill="#2a3140" stroke="#4ade80" stroke-width="1.6"/>
  <text x="738" y="116" text-anchor="middle" class="label">victim</text>
  <text x="738" y="132" text-anchor="middle" class="mono">203.0.113.50/24</text>
  <text x="676" y="152" class="mono">TCP/80:  HTTP alive</text>
  <text x="676" y="167" class="mono">UDP/123: Flood target</text>
  <text x="676" y="185" class="muted">GW: 203.0.113.1</text>

  <!-- Trigger Controller -->
  <rect x="378" y="268" width="280" height="96" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="518" y="288" text-anchor="middle" class="label">trigger (ExaBGP / DDoS Controller)</text>
  <text x="518" y="303" text-anchor="middle" class="mono">AS 65100 · eth1 10.99.0.2/30 (iBGP)</text>
  <text x="392" y="323" class="mono">Drill 1 (RTBH):     203.0.113.50/32 comm 65100:666</text>
  <text x="392" y="339" class="mono">Drill 2 (FlowSpec): dst 203.0.113.50/32 udp/123 drop</text>
  <text x="392" y="354" class="muted">Injects &amp; withdraws mitigations via BGP NLRI</text>

  <!-- Traffic Arrows -->
  <path class="atk" d="M182,134 H222"/>
  <path class="legit" d="M182,162 H222"/>
  <path class="atk" d="M368,134 H418"/>
  <path class="legit" d="M368,162 H418"/>

  <!-- Drop marker for UDP/123 on edge1 -->
  <rect x="616" y="112" width="44" height="18" rx="9" fill="#f87171"/>
  <text x="638" y="124" text-anchor="middle" class="badge">DROP</text>
  <path class="legit" d="M616,162 H662"/>

  <!-- Control plane arrow from trigger to edge1 -->
  <path class="ctrl" d="M518,268 V220"/>
  <rect x="528" y="232" width="132" height="22" rx="6" fill="#2a3140" stroke="#60a5fa"/>
  <text x="594" y="246" text-anchor="middle" class="mono">iBGP Unicast + FlowSpec</text>

  <!-- Legend Footer -->
  <line x1="40" y1="398" x2="72" y2="398" stroke="#f87171" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <text x="80" y="401" class="muted">UDP/123 flood (dropped at edge1)</text>
  <line x1="308" y1="398" x2="340" y2="398" stroke="#4ade80" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="348" y="401" class="muted">TCP/80 HTTP (survives FlowSpec, dies under RTBH)</text>
  <line x1="654" y1="398" x2="686" y2="398" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="694" y="401" class="muted">BGP Mitigation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-label="Kubernetes Pod-to-Service-to-Pod packet path across two nodes showing veth, CNI eBPF DNAT from Service VIP to backend Pod IP, underlay transport, and destination Pod delivery">
  <defs>
    <pattern id="grid-k8s" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #3d4f5f; }
      .step { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .flow { fill: none; stroke: #3b82c4; stroke-width: 2; marker-end: url(#arr-blue); }
      .flow-ret { fill: none; stroke: #15803d; stroke-width: 1.7; stroke-dasharray: 5 4; marker-end: url(#arr-green); }
    </style>
  </defs>

  <rect width="820" height="430" rx="16" fill="#f4f7fb"/>
  <rect width="820" height="430" rx="16" fill="url(#grid-k8s)"/>
  <rect x="8" y="8" width="804" height="414" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="410" y="30" text-anchor="middle" class="title">Kubernetes Pod-to-Service-to-Pod Packet Path (Cross-Node)</text>
  <text x="410" y="46" text-anchor="middle" class="muted">Service VIP (10.96.0.10:80) is DNATed on Node A before leaving eth0; conntrack reverses NAT on return</text>

  <!-- Node A -->
  <rect x="28" y="64" width="334" height="314" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="44" y="84" class="label">Worker Node A</text>
  <text x="346" y="84" text-anchor="end" class="mono">192.168.10.11</text>

  <!-- Pod A -->
  <rect x="48" y="98" width="294" height="62" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="62" y="117" class="label">Client Pod A (netns)</text>
  <text x="328" y="117" text-anchor="end" class="mono">10.244.1.5</text>
  <text x="62" y="135" class="mono">eth0 -&gt; dst 10.96.0.10:80 (ClusterIP)</text>
  <text x="62" y="150" class="muted">App connects to Service VIP; unaware of Pod B IP</text>

  <!-- veth A -->
  <rect x="130" y="176" width="130" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="195" y="194" text-anchor="middle" class="mono">veth / lxc-a1b2</text>

  <!-- CNI / eBPF / kube-proxy on Node A -->
  <rect x="48" y="220" width="294" height="72" rx="8" fill="#efe6f6" stroke="#c4b0d8" stroke-width="1.4"/>
  <text x="62" y="239" class="label">Root netns: CNI + Service Dataplane</text>
  <text x="62" y="256" class="mono">eBPF cgroup/TC or nftables/IPVS DNAT</text>
  <text x="62" y="272" class="mono">10.96.0.10:80  -&gt;  10.244.2.9:8080</text>
  <text x="62" y="285" class="muted">Conntrack / BPF CT stores reverse mapping</text>

  <!-- Node A NIC -->
  <rect x="115" y="314" width="160" height="46" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="195" y="334" text-anchor="middle" class="label">Node NIC (eth0)</text>
  <text x="195" y="349" text-anchor="middle" class="mono">VXLAN/Geneve or Native L3</text>

  <!-- Node B -->
  <rect x="458" y="64" width="334" height="314" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.5"/>
  <text x="474" y="84" class="label">Worker Node B</text>
  <text x="776" y="84" text-anchor="end" class="mono">192.168.10.12</text>

  <!-- Pod B -->
  <rect x="478" y="98" width="294" height="62" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="492" y="117" class="label">Backend Pod B (netns)</text>
  <text x="758" y="117" text-anchor="end" class="mono">10.244.2.9:8080</text>
  <text x="492" y="135" class="mono">sees src 10.244.1.5 -&gt; dst 10.244.2.9</text>
  <text x="492" y="150" class="muted">Processes request and replies to 10.244.1.5</text>

  <!-- veth B -->
  <rect x="560" y="176" width="130" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="625" y="194" text-anchor="middle" class="mono">veth / lxc-c3d4</text>

  <!-- CNI / Policy on Node B -->
  <rect x="478" y="220" width="294" height="72" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <text x="492" y="239" class="label">Root netns: CNI Routing + Policy</text>
  <text x="492" y="256" class="mono">Decap (if overlay) · NetworkPolicy check</text>
  <text x="492" y="272" class="mono">Route 10.244.2.9/32 -&gt; lxc-c3d4</text>
  <text x="492" y="285" class="muted">Enforces ingress policy before Pod B netns</text>

  <!-- Node B NIC -->
  <rect x="545" y="314" width="160" height="46" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="625" y="334" text-anchor="middle" class="label">Node NIC (eth0)</text>
  <text x="625" y="349" text-anchor="middle" class="mono">Underlay / VPC fabric</text>

  <!-- Forward path arrows -->
  <path class="flow" d="M195,160 V174"/>
  <path class="flow" d="M195,204 V218"/>
  <path class="flow" d="M195,292 V312"/>
  <path class="flow" d="M275,332 H543"/>
  <path class="flow" d="M625,314 V294"/>
  <path class="flow" d="M625,220 V206"/>
  <path class="flow" d="M625,176 V162"/>

  <!-- Return path arrow across fabric -->
  <path class="flow-ret" d="M545,348 H277"/>

  <!-- Fabric label -->
  <rect x="372" y="303" width="76" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="410" y="317" text-anchor="middle" class="mono">Underlay</text>
  <text x="410" y="365" text-anchor="middle" class="muted">Return: rev-DNAT on Node A</text>

  <!-- Step badges -->
  <circle cx="172" cy="168" r="8" fill="#3b82c4"/><text x="172" y="171" text-anchor="middle" class="step">1</text>
  <circle cx="172" cy="212" r="8" fill="#3b82c4"/><text x="172" y="215" text-anchor="middle" class="step">2</text>
  <circle cx="410" cy="332" r="8" fill="#3b82c4"/><text x="410" y="335" text-anchor="middle" class="step">3</text>
  <circle cx="648" cy="212" r="8" fill="#3b82c4"/><text x="648" y="215" text-anchor="middle" class="step">4</text>

  <!-- Legend footer -->
  <line x1="48" y1="400" x2="78" y2="400" stroke="#3b82c4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="86" y="403" class="muted">Request: 10.244.1.5 -&gt; 10.96.0.10:80 (DNATed to 10.244.2.9:8080)</text>
  <line x1="470" y1="400" x2="500" y2="400" stroke="#15803d" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>
  <text x="508" y="403" class="muted">Reply: 10.244.2.9 -&gt; 10.244.1.5 (rev-DNAT to 10.96.0.10)</text>
</svg>

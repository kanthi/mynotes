<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="Lab 58 BGP ADD-PATH topology in AS 65100 showing route reflector rr1 reflecting both border exit paths from br1 and br2 for prefix 203.0.113.0/24 with distinct Path-IDs to clients c1 and c2 for iBGP ECMP">
  <defs>
    <pattern id="grid-58" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #3d4f5f; }
      .badge-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #3b82c4; }
      .badge-green { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #15803d; }
      .badge-amber { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #b45309; }
      .path1 { fill: none; stroke: #3b82c4; stroke-width: 2; marker-end: url(#arr-blue); }
      .path2 { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arr-green); }
      .underlay { fill: none; stroke: #8b9bb0; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-58)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">Lab 58: BGP ADD-PATH (RFC 7911) on an iBGP Route Reflector</text>
  <text x="420" y="46" text-anchor="middle" class="muted">rr1 advertises both Path-ID 1 (via br1) and Path-ID 2 (via br2) for 203.0.113.0/24 so c1 &amp; c2 install 2-way ECMP</text>

  <!-- AS 65100 Frame -->
  <rect x="24" y="64" width="792" height="314" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="40" y="84" class="label">AS 65100 (OSPF Area 0 Underlay + iBGP Route Reflection)</text>
  <text x="800" y="84" text-anchor="end" class="mono">prefix: 203.0.113.0/24</text>

  <!-- Clients -->
  <rect x="42" y="108" width="174" height="104" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="129" y="128" text-anchor="middle" class="label">c1 (RR Client)</text>
  <text x="129" y="143" text-anchor="middle" class="mono">Lo0: 10.255.0.11/32</text>
  <text x="129" y="158" text-anchor="middle" class="mono">maximum-paths ibgp 2</text>
  <rect x="54" y="168" width="150" height="34" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="129" y="182" text-anchor="middle" class="badge-green">FIB: 2-way ECMP</text>
  <text x="129" y="195" text-anchor="middle" class="mono">nh: br1 + br2</text>

  <rect x="42" y="246" width="174" height="104" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="129" y="266" text-anchor="middle" class="label">c2 (RR Client)</text>
  <text x="129" y="281" text-anchor="middle" class="mono">Lo0: 10.255.0.12/32</text>
  <text x="129" y="296" text-anchor="middle" class="mono">maximum-paths ibgp 2</text>
  <rect x="54" y="306" width="150" height="34" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="129" y="320" text-anchor="middle" class="badge-green">FIB: 2-way ECMP</text>
  <text x="129" y="333" text-anchor="middle" class="mono">nh: br1 + br2</text>

  <!-- Route Reflector rr1 -->
  <rect x="304" y="120" width="232" height="218" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="420" y="142" text-anchor="middle" class="label">rr1 (Route Reflector)</text>
  <text x="420" y="157" text-anchor="middle" class="mono">Lo0: 10.255.0.1/32 · Cluster 1</text>

  <rect x="318" y="170" width="204" height="62" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="328" y="186" class="badge-amber">Drill 1: Default (Path Hiding)</text>
  <text x="328" y="201" class="mono">Reflects best path ONLY</text>
  <text x="328" y="216" class="mono">br2 hidden -&gt; no ECMP on c1/c2</text>

  <rect x="318" y="244" width="204" height="78" rx="6" fill="#dbeafe" stroke="#3b82c4" stroke-width="1.1"/>
  <text x="328" y="260" class="badge-blue">Drill 2: RFC 7911 ADD-PATH</text>
  <text x="328" y="275" class="mono">addpath-tx-all-paths</text>
  <text x="328" y="290" class="mono">Path-ID 1 -&gt; nh 10.255.0.21</text>
  <text x="328" y="305" class="mono">Path-ID 2 -&gt; nh 10.255.0.22</text>

  <!-- Border Exits -->
  <rect x="624" y="108" width="174" height="104" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="711" y="128" text-anchor="middle" class="label">br1 (Border Exit 1)</text>
  <text x="711" y="143" text-anchor="middle" class="mono">Lo0: 10.255.0.21/32</text>
  <text x="711" y="158" text-anchor="middle" class="mono">adv: 203.0.113.0/24</text>
  <rect x="636" y="168" width="150" height="34" rx="5" fill="#dbeafe" stroke="#3b82c4" stroke-width="1"/>
  <text x="711" y="182" text-anchor="middle" class="badge-blue">Path-ID 1 (MED 0)</text>
  <text x="711" y="195" text-anchor="middle" class="mono">Drill 3: Withdraw</text>

  <rect x="624" y="246" width="174" height="104" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="711" y="266" text-anchor="middle" class="label">br2 (Border Exit 2)</text>
  <text x="711" y="281" text-anchor="middle" class="mono">Lo0: 10.255.0.22/32</text>
  <text x="711" y="296" text-anchor="middle" class="mono">adv: 203.0.113.0/24</text>
  <rect x="636" y="306" width="150" height="34" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="711" y="320" text-anchor="middle" class="badge-green">Path-ID 2 (MED 0)</text>
  <text x="711" y="333" text-anchor="middle" class="mono">Pre-installed backup</text>

  <!-- Paths br -> rr1 -->
  <path class="path1" d="M624,160 L538,195"/>
  <path class="path2" d="M624,298 L538,263"/>
  <text x="580" y="164" text-anchor="middle" class="badge-blue">Path 1</text>
  <text x="580" y="296" text-anchor="middle" class="badge-green">Path 2</text>

  <!-- Dual paths rr1 -> c1 -->
  <path class="path1" d="M304,192 L218,150"/>
  <path class="path2" d="M304,206 L218,166"/>

  <!-- Dual paths rr1 -> c2 -->
  <path class="path1" d="M304,254 L218,288"/>
  <path class="path2" d="M304,268 L218,304"/>

  <text x="260" y="148" text-anchor="middle" class="mono">ID 1 + ID 2</text>
  <text x="260" y="318" text-anchor="middle" class="mono">ID 1 + ID 2</text>

  <!-- Legend footer -->
  <line x1="34" y1="404" x2="66" y2="404" stroke="#3b82c4" stroke-width="2"/>
  <text x="74" y="407" class="muted">ADD-PATH Path-ID 1 (next-hop br1: 10.255.0.21)</text>
  <line x1="378" y1="404" x2="410" y2="404" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="418" y="407" class="muted">ADD-PATH Path-ID 2 (next-hop br2: 10.255.0.22)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 301" role="img" aria-label="An introduction reaches the onion service separately from application data on two circuits joined at the rendezvous relay." color-scheme="dark">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#344454" stroke-width=".65"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#83bff0"/></marker></defs>
<rect width="760" height="301" rx="12" fill="#182332"/><rect width="760" height="301" rx="12" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif" fill="#e3edf6">
<text x="28" y="36" text-anchor="start" font-size="21" font-weight="650" fill="#e3edf6">Introduction and data follow different circuits</text>
<text x="32" y="84" text-anchor="start" font-size="16" font-weight="650" fill="#83bff0">Contact</text>
<text x="32" y="180" text-anchor="start" font-size="16" font-weight="650" fill="#d4a9ed">Stream</text>
<rect x="34" y="100" width="150" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="109.0" y="129.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Client</text>
<rect x="275" y="100" width="210" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="380.0" y="129.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Introduction point</text>
<rect x="576" y="100" width="150" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="651.0" y="129.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Onion service</text>
<rect x="34" y="196" width="150" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="109.0" y="225.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Client</text>
<rect x="275" y="196" width="210" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="380.0" y="225.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Rendezvous relay</text>
<rect x="576" y="196" width="150" height="48" rx="8" fill="#233346" stroke="#839ab1" stroke-width="1.5"/>
<text x="651.0" y="225.0" text-anchor="middle" font-size="16" font-weight="650" fill="#e3edf6">Onion service</text>
<line x1="184" y1="124" x2="273" y2="124" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="485" y1="124" x2="574" y2="124" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="184" y1="212" x2="273" y2="212" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="273" y1="227" x2="184" y2="227" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="485" y1="212" x2="574" y2="212" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="574" y1="227" x2="485" y2="227" stroke="#83bff0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380" y="277" text-anchor="middle" font-size="15" font-weight="400" fill="#e3edf6">Each span represents a Tor circuit. The lower pair carries application data.</text>
</g></svg>

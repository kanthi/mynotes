<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="light" aria-label="Comparison of standard BGP Route Reflector path hiding versus RFC 7911 ADD-PATH reflecting multiple paths with distinct 32-bit Path IDs for ECMP and fast failover">
  <defs>
    <pattern id="grid-addpath" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82c4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #2f3b4a; }
      .panel-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.6px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #3d4f5f; }
      .badge-red { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #b91c1c; }
      .badge-green { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #15803d; }
      .flow-blue { fill: none; stroke: #3b82c4; stroke-width: 1.9; marker-end: url(#arr-blue); }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 1.9; marker-end: url(#arr-green); }
      .flow-hidden { fill: none; stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 4 3; marker-end: url(#arr-red); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#f4f7fb"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-addpath)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="420" y="30" text-anchor="middle" class="title">BGP Route Reflector Path Hiding vs RFC 7911 ADD-PATH</text>
  <text x="420" y="46" text-anchor="middle" class="muted">Standard RR reflects only its single best path; ADD-PATH tags each path with a unique 32-bit Path ID</text>

  <!-- Left Panel: Standard RR -->
  <rect x="24" y="60" width="386" height="328" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="40" y="80" class="panel-title">Standard Route Reflector (Path Hiding)</text>

  <!-- Left Edge R1 & R2 -->
  <rect x="42" y="94" width="160" height="52" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="122" y="112" text-anchor="middle" class="label">Edge R1 (Exit A)</text>
  <text x="122" y="126" text-anchor="middle" class="mono">203.0.113.0/24</text>
  <text x="122" y="139" text-anchor="middle" class="mono">NH 10.0.0.1</text>

  <rect x="232" y="94" width="160" height="52" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="312" y="112" text-anchor="middle" class="label">Edge R2 (Exit B)</text>
  <text x="312" y="126" text-anchor="middle" class="mono">203.0.113.0/24</text>
  <text x="312" y="139" text-anchor="middle" class="mono">NH 10.0.0.2</text>

  <!-- Left RR -->
  <rect x="92" y="186" width="250" height="66" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="217" y="204" text-anchor="middle" class="label">Route Reflector (No ADD-PATH)</text>
  <text x="217" y="219" text-anchor="middle" class="mono">Best-path picks R1 (lower RID)</text>
  <text x="217" y="233" text-anchor="middle" class="badge-red">Path via R2 is suppressed (hidden)</text>
  <text x="217" y="245" text-anchor="middle" class="muted">Advertises 1 path per prefix</text>

  <!-- Left Client R3 -->
  <rect x="82" y="302" width="270" height="68" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="217" y="320" text-anchor="middle" class="label">RR Client R3</text>
  <text x="217" y="336" text-anchor="middle" class="mono">RIB: 203.0.113.0/24 -&gt; 10.0.0.1 only</text>
  <text x="217" y="351" text-anchor="middle" class="badge-red">No ECMP · Blackhole until RR reconverges</text>
  <text x="217" y="364" text-anchor="middle" class="muted">Unaware of R2 backup exit</text>

  <!-- Left Arrows -->
  <path class="flow-blue" d="M122,146 L175,184"/>
  <path class="flow-hidden" d="M312,146 L259,184"/>
  <path class="flow-blue" d="M217,252 V300"/>
  <rect x="148" y="266" width="138" height="20" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="217" y="279" text-anchor="middle" class="mono">Only NH 10.0.0.1</text>

  <!-- Right Panel: ADD-PATH -->
  <rect x="430" y="60" width="386" height="328" rx="12" fill="#eef3f9" stroke="#8b9bb0" stroke-width="1.4"/>
  <text x="446" y="80" class="panel-title">RFC 7911 ADD-PATH (Multi-Path Visibility)</text>

  <!-- Right Edge R1 & R2 -->
  <rect x="448" y="94" width="160" height="52" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="528" y="112" text-anchor="middle" class="label">Edge R1 (Exit A)</text>
  <text x="528" y="126" text-anchor="middle" class="mono">203.0.113.0/24</text>
  <text x="528" y="139" text-anchor="middle" class="mono">NH 10.0.0.1</text>

  <rect x="638" y="94" width="160" height="52" rx="8" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.3"/>
  <text x="718" y="112" text-anchor="middle" class="label">Edge R2 (Exit B)</text>
  <text x="718" y="126" text-anchor="middle" class="mono">203.0.113.0/24</text>
  <text x="718" y="139" text-anchor="middle" class="mono">NH 10.0.0.2</text>

  <!-- Right RR -->
  <rect x="498" y="186" width="250" height="66" rx="8" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="623" y="204" text-anchor="middle" class="label">Route Reflector (ADD-PATH TX)</text>
  <text x="623" y="219" text-anchor="middle" class="mono">Path-ID 1: 203.0.113.0/24 -&gt; .1</text>
  <text x="623" y="233" text-anchor="middle" class="mono">Path-ID 2: 203.0.113.0/24 -&gt; .2</text>
  <text x="623" y="245" text-anchor="middle" class="muted">Cap 69 TX: bestpath-per-AS / all</text>

  <!-- Right Client R3 -->
  <rect x="488" y="302" width="270" height="68" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="623" y="320" text-anchor="middle" class="label">RR Client R3 (ADD-PATH RX)</text>
  <text x="623" y="336" text-anchor="middle" class="mono">RIB: ID 1 (10.0.0.1) + ID 2 (10.0.0.2)</text>
  <text x="623" y="351" text-anchor="middle" class="badge-green">iBGP ECMP Active · Fast PIC Backup</text>
  <text x="623" y="364" text-anchor="middle" class="muted">Withdraw ID 1 keeps ID 2 forwarding</text>

  <!-- Right Arrows -->
  <path class="flow-blue" d="M528,146 L581,184"/>
  <path class="flow-green" d="M718,146 L665,184"/>
  <path class="flow-blue" d="M582,252 V300"/>
  <path class="flow-green" d="M664,252 V300"/>
  <rect x="514" y="266" width="100" height="20" rx="6" fill="#dbeafe" stroke="#3b82c4" stroke-width="1"/>
  <text x="564" y="279" text-anchor="middle" class="mono">ID 1: .1</text>
  <rect x="632" y="266" width="100" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="682" y="279" text-anchor="middle" class="mono">ID 2: .2</text>

  <!-- Footer Legend -->
  <line x1="36" y1="410" x2="66" y2="410" stroke="#3b82c4" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="74" y="413" class="muted">Advertised best path (Path-ID 1)</text>
  <line x1="276" y1="410" x2="306" y2="410" stroke="#15803d" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="314" y="413" class="muted">Additional path via ADD-PATH (Path-ID 2)</text>
  <line x1="556" y1="410" x2="586" y2="410" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="594" y="413" class="muted">Hidden alternate path (not reflected)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Ansible network automation architecture from control node through persistent connection plugins to multi-vendor devices">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; }
      .box-ctrl { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .box-conn { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
      .box-dev { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .title { font: 700 14px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .sub { font: 500 11.5px system-ui, -apple-system, sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .line { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect x="6" y="6" width="848" height="308" rx="12" class="bg"/>
  <text x="26" y="34" class="title">Ansible Control-Node Execution for Network Devices</text>

  <rect x="28" y="60" width="210" height="226" rx="10" class="box-ctrl"/>
  <text x="133" y="88" text-anchor="middle" class="title">Control Node</text>
  <text x="133" y="108" text-anchor="middle" class="sub">Linux / macOS / AWX EE</text>
  <rect x="44" y="124" width="178" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="133" y="145" text-anchor="middle" class="mono">Inventory + group_vars</text>
  <rect x="44" y="168" width="178" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="133" y="189" text-anchor="middle" class="mono">Playbooks + Roles + J2</text>
  <rect x="44" y="212" width="178" height="54" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="133" y="234" text-anchor="middle" class="mono">Modules Run Locally</text>
  <text x="133" y="252" text-anchor="middle" class="sub">(No Python on device)</text>

  <rect x="308" y="60" width="214" height="62" rx="10" class="box-conn"/>
  <text x="415" y="86" text-anchor="middle" class="mono">network_cli (SSH :22)</text>
  <text x="415" y="106" text-anchor="middle" class="sub">Persistent PTY + cliconf</text>

  <rect x="308" y="142" width="214" height="62" rx="10" class="box-conn"/>
  <text x="415" y="168" text-anchor="middle" class="mono">netconf (SSH :830)</text>
  <text x="415" y="188" text-anchor="middle" class="sub">XML / YANG + commit</text>

  <rect x="308" y="224" width="214" height="62" rx="10" class="box-conn"/>
  <text x="415" y="250" text-anchor="middle" class="mono">httpapi (HTTPS :443)</text>
  <text x="415" y="270" text-anchor="middle" class="sub">REST / JSON-RPC API</text>

  <rect x="596" y="60" width="236" height="62" rx="10" class="box-dev"/>
  <text x="714" y="86" text-anchor="middle" class="title">Cisco IOS-XE / NX-OS / EOS</text>
  <text x="714" y="106" text-anchor="middle" class="sub">Campus, Core &amp; DC Switches</text>

  <rect x="596" y="142" width="236" height="62" rx="10" class="box-dev"/>
  <text x="714" y="168" text-anchor="middle" class="title">Juniper Junos / IOS-XR</text>
  <text x="714" y="188" text-anchor="middle" class="sub">WAN Edge &amp; Service Provider</text>

  <rect x="596" y="224" width="236" height="62" rx="10" class="box-dev"/>
  <text x="714" y="250" text-anchor="middle" class="title">Fortinet FortiOS / eAPI</text>
  <text x="714" y="270" text-anchor="middle" class="sub">Perimeter Firewalls &amp; APIs</text>

  <path d="M 238 140 L 304 91" class="line"/>
  <path d="M 238 173 L 304 173" class="line"/>
  <path d="M 238 206 L 304 255" class="line"/>
  <path d="M 522 91 L 592 91" class="line"/>
  <path d="M 522 173 L 592 173" class="line"/>
  <path d="M 522 255 L 592 255" class="line"/>
</svg>

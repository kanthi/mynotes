<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="Cloud transit gateway hub-and-spoke routing versus PrivateLink unidirectional service endpoint" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">Cloud Interconnect: Transit Gateway (L3 Routed) vs. PrivateLink (L4 Endpoint)</text>
  <rect x="30" y="65" width="360" height="145" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="210.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">Transit Gateway / Hub-and-Spoke (L3)</text>
  <text x="210.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Connects many VPCs + Direct Connect/VPN</text>
  <text x="210.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Requires non-overlapping CIDR blocks</text>
  <text x="210.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Full bidirectional IP routing &amp; BGP</text>
  <text x="210.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Ideal for internal east-west mesh</text>
  <rect x="430" y="65" width="360" height="145" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="610.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">PrivateLink / Private Service Connect (L4)</text>
  <text x="610.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Exposes one service via ENI in consumer VPC</text>
  <text x="610.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Works even with overlapping CIDRs!</text>
  <text x="610.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Strictly unidirectional (consumer -&gt; provider)</text>
  <text x="610.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Zero internet traversal; SaaS B2B gold standard</text>
</svg>

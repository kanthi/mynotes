<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" role="img" aria-label="Step-by-step sequence: Link up, DHCP DORA lease, ARP for default gateway MAC, DNS UDP/53 query, TCP SYN/SYN-ACK/ACK, TLS 1.3 handshake, and HTTP GET." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;fill:#52606d}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">End-to-End Sequence: How a Host Gets Online</text>
<rect x="20" y="50" width="150" height="75" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="95.0" y="75.5" text-anchor="middle">1. Link + DHCP</text>
<text class="l" x="95.0" y="91.5" text-anchor="middle">DORA -&gt; IP, Mask,</text>
<text class="l" x="95.0" y="107.5" text-anchor="middle">Gateway, DNS</text>
<rect x="195" y="50" width="150" height="75" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="l" x="270.0" y="75.5" text-anchor="middle">2. ARP / ND</text>
<text class="l" x="270.0" y="91.5" text-anchor="middle">Who has 10.0.0.1?</text>
<text class="l" x="270.0" y="107.5" text-anchor="middle">Gateway MAC resolved</text>
<rect x="370" y="50" width="150" height="75" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="445.0" y="75.5" text-anchor="middle">3. DNS Query</text>
<text class="l" x="445.0" y="91.5" text-anchor="middle">UDP/53 -&gt; A/AAAA</text>
<text class="l" x="445.0" y="107.5" text-anchor="middle">93.184.216.34</text>
<rect x="545" y="50" width="155" height="75" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="622.5" y="75.5" text-anchor="middle">4. TCP 3-Way</text>
<text class="l" x="622.5" y="91.5" text-anchor="middle">SYN -&gt; SYN-ACK -&gt;</text>
<text class="l" x="622.5" y="107.5" text-anchor="middle">ACK (RTT = 1)</text>
<rect x="120" y="175" width="220" height="75" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text class="l" x="230.0" y="200.5" text-anchor="middle">5. TLS 1.3 Handshake</text>
<text class="l" x="230.0" y="216.5" text-anchor="middle">ClientHello + KeyShare (1 RTT)</text>
<text class="l" x="230.0" y="232.5" text-anchor="middle">Verified X.509 Chain</text>
<rect x="390" y="175" width="220" height="75" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="500.0" y="200.5" text-anchor="middle">6. HTTP/2 Request</text>
<text class="l" x="500.0" y="216.5" text-anchor="middle">GET /index.html</text>
<text class="l" x="500.0" y="232.5" text-anchor="middle">200 OK + HTML Stream</text>
<line x1="170" y1="87" x2="195" y2="87" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="345" y1="87" x2="370" y2="87" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="520" y1="87" x2="545" y2="87" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="620" y1="125" x2="230" y2="175" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340" y1="212" x2="390" y2="212" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>

</svg>
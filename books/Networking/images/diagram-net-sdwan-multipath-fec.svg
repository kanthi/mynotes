<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" role="img" aria-label="SD-WAN multipath application steering and XOR Forward Error Correction over dual WAN links" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="235" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">SD-WAN Multipath Steering &amp; Forward Error Correction (FEC)</text>
  <rect x="30" y="70" width="190" height="105" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="125.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Branch Edge</text>
  <text x="125.0" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SLA probes (loss/jitter)</text>
  <text x="125.0" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Voice -&gt; MPLS + FEC</text>
  <text x="125.0" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Bulk -&gt; Broadband</text>
  <rect x="285" y="45" width="225" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="397.5" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">WAN 1 (MPLS / Fiber)</text>
  <text x="397.5" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">RTT 18ms, 0.0% loss -&gt; Active</text>
  <rect x="285" y="130" width="225" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="397.5" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">WAN 2 (5G / Cable)</text>
  <text x="397.5" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">RTT 45ms, 2.5% loss -&gt; Parity FEC</text>
  <rect x="575" y="70" width="215" height="105" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="682.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Hub Gateway</text>
  <text x="682.5" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Reorders packets</text>
  <text x="682.5" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">XOR-recovers lost frame</text>
  <text x="682.5" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Zero TCP retransmit</text>
  <line x1="220" y1="100" x2="285" y2="75" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="76" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85">data</text>
  <line x1="220" y1="140" x2="285" y2="155" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="252" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b">parity</text>
  <line x1="510" y1="75" x2="575" y2="105" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="542" y="78" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
  <line x1="510" y1="155" x2="575" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="542" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>
</svg>

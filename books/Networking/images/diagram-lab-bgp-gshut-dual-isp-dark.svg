<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="dark" aria-label="Lab 56 dual-ISP eBGP topology showing lan-host connected to edge1 in AS 65100 peering with isp-a in AS 65001 and isp-b in AS 65002 with RFC 8326 GRACEFUL_SHUTDOWN, Large Communities, and maximum-prefix circuit breaker">
  <defs>
    <pattern id="grid-56-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.8px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.2px; fill: #c5d0dc; }
      .badge-amber { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #fbbf24; }
      .badge-green { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #4ade80; }
      .badge-red { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 700; fill: #f87171; }
      .link-lan { fill: none; stroke: #60a5fa; stroke-width: 2; }
      .link-drain { fill: none; stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arr-amber); }
      .link-active { fill: none; stroke: #4ade80; stroke-width: 2.2; marker-end: url(#arr-green); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#1c2129"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-56-dark)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="420" y="30" text-anchor="middle" class="title">Lab 56: Dual-ISP eBGP Graceful Shutdown (RFC 8326) &amp; Prefix Circuit-Breaker</text>
  <text x="420" y="46" text-anchor="middle" class="muted">edge1 (AS 65100) drains isp-a via 65535:0 (LOCAL_PREF 0), tags Large Communities, and enforces max-prefix 50</text>

  <!-- Enterprise LAN Zone -->
  <rect x="26" y="72" width="168" height="292" rx="12" fill="#232a35" stroke="#6b7c90" stroke-width="1.3"/>
  <text x="40" y="92" class="label">Enterprise LAN</text>
  <text x="40" y="106" class="mono">10.100.0.0/24</text>

  <!-- lan-host -->
  <rect x="42" y="168" width="136" height="96" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.5"/>
  <text x="110" y="190" text-anchor="middle" class="label">lan-host</text>
  <text x="110" y="206" text-anchor="middle" class="mono">eth1: 10.100.0.10/24</text>
  <text x="110" y="222" text-anchor="middle" class="mono">gw: 10.100.0.1</text>
  <text x="110" y="242" text-anchor="middle" class="muted">Probe -&gt; 192.0.2.1</text>
  <text x="110" y="255" text-anchor="middle" class="muted">(continuous ping)</text>

  <!-- edge1 router -->
  <rect x="252" y="96" width="248" height="248" rx="10" fill="#2a3140" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="376" y="118" text-anchor="middle" class="label">edge1 (FRR 10.3.1)</text>
  <text x="376" y="133" text-anchor="middle" class="mono">AS 65100 · Lo0 10.255.0.1/32</text>

  <!-- Policy panels inside edge1 -->
  <rect x="266" y="146" width="220" height="54" rx="6" fill="#3f3119" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="276" y="163" class="badge-amber">RFC 8326 GSHUT Policy</text>
  <text x="276" y="178" class="mono">match 65535:0 -&gt; local-pref 0</text>
  <text x="276" y="192" class="mono">egress drain -&gt; add 65535:0</text>

  <rect x="266" y="210" width="220" height="54" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="276" y="227" class="label">RFC 8092 Large Communities</text>
  <text x="276" y="242" class="mono">in: 65100:100:1 (pri) / :2 (bkp)</text>
  <text x="276" y="256" class="mono">out: scrub 65100:*:* at egress</text>

  <rect x="266" y="274" width="220" height="54" rx="6" fill="#3f1d24" stroke="#f87171" stroke-width="1.1"/>
  <text x="276" y="291" class="badge-red">Prefix Circuit-Breaker</text>
  <text x="276" y="306" class="mono">maximum-prefix 50</text>
  <text x="276" y="320" class="mono">warning-only -&gt; hard restart 1</text>

  <!-- isp-a -->
  <rect x="598" y="82" width="214" height="122" rx="10" fill="#2a3140" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="705" y="103" text-anchor="middle" class="label">isp-a (Primary Transit)</text>
  <text x="705" y="118" text-anchor="middle" class="mono">AS 65001 · Lo0 192.0.2.1/32</text>
  <text x="705" y="134" text-anchor="middle" class="mono">eth1: 198.51.100.2/30</text>
  <rect x="614" y="146" width="182" height="44" rx="6" fill="#3f3119" stroke="#fbbf24" stroke-width="1"/>
  <text x="705" y="163" text-anchor="middle" class="badge-amber">Drill 1: Hitless Drain</text>
  <text x="705" y="179" text-anchor="middle" class="mono">LP 200 -&gt; GSHUT 65535:0 (LP 0)</text>

  <!-- isp-b -->
  <rect x="598" y="236" width="214" height="126" rx="10" fill="#2a3140" stroke="#4ade80" stroke-width="1.6"/>
  <text x="705" y="257" text-anchor="middle" class="label">isp-b (Backup Transit)</text>
  <text x="705" y="272" text-anchor="middle" class="mono">AS 65002 · Lo0 192.0.2.1/32</text>
  <text x="705" y="288" text-anchor="middle" class="mono">eth1: 203.0.113.2/30</text>
  <rect x="614" y="300" width="182" height="48" rx="6" fill="#1b3a2d" stroke="#4ade80" stroke-width="1"/>
  <text x="705" y="317" text-anchor="middle" class="badge-green">Active on Drain (LP 100)</text>
  <text x="705" y="333" text-anchor="middle" class="mono">Drill 2: Inject 60 prefixes</text>
  <text x="705" y="344" text-anchor="middle" class="muted">trips max-prefix 50 guard</text>

  <!-- Links -->
  <path class="link-lan" d="M178,216 H252"/>
  <text x="215" y="208" text-anchor="middle" class="mono">eth3</text>
  <text x="215" y="229" text-anchor="middle" class="mono">.0.1</text>

  <path class="link-drain" d="M500,148 H596"/>
  <text x="548" y="138" text-anchor="middle" class="mono">198.51.100.0/30</text>
  <text x="548" y="164" text-anchor="middle" class="badge-amber">eth1: .1 &lt;-&gt; .2</text>

  <path class="link-active" d="M500,294 H596"/>
  <text x="548" y="284" text-anchor="middle" class="mono">203.0.113.0/30</text>
  <text x="548" y="310" text-anchor="middle" class="badge-green">eth2: .1 &lt;-&gt; .2</text>

  <!-- Legend footer -->
  <line x1="34" y1="398" x2="66" y2="398" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="74" y="401" class="muted">Drained primary eBGP (65535:0, LP 0)</text>
  <line x1="312" y1="398" x2="344" y2="398" stroke="#4ade80" stroke-width="2.2"/>
  <text x="352" y="401" class="muted">Active backup eBGP (LP 100, takes zero-loss failover)</text>
  <line x1="646" y1="398" x2="678" y2="398" stroke="#60a5fa" stroke-width="2"/>
  <text x="686" y="401" class="muted">Enterprise LAN</text>
</svg>

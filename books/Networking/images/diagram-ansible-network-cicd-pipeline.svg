<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="Network CI/CD pipeline from Git pull request through linting, virtual lab verification, approval gate, and canary production rollout">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; }
      .ci { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .gate { fill: #fef3c7; stroke: #d97706; stroke-width: 1.8; }
      .cd { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .t { font: 700 13px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .m { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .s { font: 500 11px system-ui, -apple-system, sans-serif; fill: #475569; }
      .l { stroke: #059669; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect x="6" y="6" width="868" height="238" rx="12" class="bg"/>
  <text x="24" y="34" class="t">CI/CD Workflow for Network Configuration</text>

  <rect x="24" y="62" width="148" height="142" rx="10" class="ci"/>
  <text x="98" y="90" text-anchor="middle" class="t">Git PR</text>
  <text x="98" y="114" text-anchor="middle" class="m">feat/chg-4210</text>
  <text x="98" y="138" text-anchor="middle" class="s">Data + template</text>
  <text x="98" y="156" text-anchor="middle" class="s">changes</text>

  <rect x="198" y="62" width="166" height="142" rx="10" class="ci"/>
  <text x="281" y="90" text-anchor="middle" class="t">CI Lint &amp; Lab</text>
  <text x="281" y="114" text-anchor="middle" class="m">yamllint + lint</text>
  <text x="281" y="136" text-anchor="middle" class="m">Containerlab</text>
  <text x="281" y="158" text-anchor="middle" class="s">Idempotency +</text>
  <text x="281" y="176" text-anchor="middle" class="s">Batfish verify</text>

  <rect x="390" y="62" width="148" height="142" rx="10" class="gate"/>
  <text x="464" y="90" text-anchor="middle" class="t">Approval Gate</text>
  <text x="464" y="114" text-anchor="middle" class="m">CAB / Peer PR</text>
  <text x="464" y="138" text-anchor="middle" class="s">Inspect rendered</text>
  <text x="464" y="156" text-anchor="middle" class="s">config diff</text>

  <rect x="564" y="62" width="142" height="142" rx="10" class="cd"/>
  <text x="635" y="90" text-anchor="middle" class="t">Canary Rollout</text>
  <text x="635" y="114" text-anchor="middle" class="m">serial: [1, 5]</text>
  <text x="635" y="138" text-anchor="middle" class="s">Self-hosted</text>
  <text x="635" y="156" text-anchor="middle" class="s">runner / AWX</text>

  <rect x="732" y="62" width="124" height="142" rx="10" class="cd"/>
  <text x="794" y="90" text-anchor="middle" class="t">Post-Check</text>
  <text x="794" y="114" text-anchor="middle" class="m">validate.yml</text>
  <text x="794" y="138" text-anchor="middle" class="s">BGP / OSPF</text>
  <text x="794" y="156" text-anchor="middle" class="s">or Rollback</text>

  <path d="M 172 133 L 194 133" class="l"/>
  <path d="M 364 133 L 386 133" class="l"/>
  <path d="M 538 133 L 560 133" class="l"/>
  <path d="M 706 133 L 728 133" class="l"/>
</svg>

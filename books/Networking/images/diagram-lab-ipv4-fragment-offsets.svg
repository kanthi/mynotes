<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 307" role="img" aria-label="A 1,480-byte IP payload is divided into fragment payloads of 976 and 504 bytes with wire offsets 0 and 122." color-scheme="light">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d0d9e4" stroke-width=".65"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#25699f"/></marker></defs>
<rect width="760" height="307" rx="12" fill="#eef2f7"/><rect width="760" height="307" rx="12" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif" fill="#2a3542">
<text x="26" y="36" text-anchor="start" font-size="21" font-weight="650" fill="#2a3542">One UDP datagram on a 1,000-byte IPv4 link</text>
<rect x="34" y="62" width="692" height="52" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="380.0" y="85.0" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Original IP payload · 1,480 bytes</text>
<text x="380.0" y="107.0" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">8 bytes of UDP header + 1,472 bytes of application data</text>
<line x1="245" y1="114" x2="245" y2="152" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="114" x2="610" y2="152" stroke="#25699f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="34" y="155" width="448" height="65" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="258.0" y="184.5" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Original bytes 0–975</text>
<text x="258.0" y="206.5" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">976 bytes of IP payload + 20-byte IPv4 header</text>
<rect x="490" y="155" width="236" height="65" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
<text x="608.0" y="184.5" text-anchor="middle" font-size="16" font-weight="650" fill="#2a3542">Original bytes 976–1,479</text>
<text x="608.0" y="206.5" text-anchor="middle" font-size="14" font-weight="400" fill="#43566a">504 bytes + 20-byte IPv4 header</text>
<text x="257" y="248" text-anchor="middle" font-size="16" font-weight="650" fill="#25699f">MF = 1   ·   wire offset = 0</text>
<text x="608" y="248" text-anchor="middle" font-size="16" font-weight="650" fill="#25699f">MF = 0   ·   wire offset = 122</text>
<text x="380" y="286" text-anchor="middle" font-size="17" font-weight="650" fill="#76578e">The second fragment begins at 122 × 8 = 976 bytes.</text>
</g></svg>

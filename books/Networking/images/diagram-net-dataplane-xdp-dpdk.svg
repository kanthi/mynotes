<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Packet dataplane latency comparison across Linux kernel sk_buff, XDP eBPF, and DPDK kernel bypass" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">High-Speed Dataplanes: Kernel sk_buff vs. XDP (eBPF) vs. DPDK Bypass</text>
  <rect x="30" y="65" width="225" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="142.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">Standard Kernel Stack</text>
  <text x="142.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">NIC -&gt; sk_buff -&gt; netfilter</text>
  <text x="142.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Full TCP/IP + iptables</text>
  <text x="142.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">~1-3 Mpps per core</text>
  <text x="142.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Best compatibility</text>
  <rect x="295" y="65" width="230" height="125" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="410.0" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">XDP (eBPF in Driver)</text>
  <text x="410.0" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Runs BEFORE sk_buff alloc</text>
  <text x="410.0" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">XDP_DROP / XDP_TX / REDIRECT</text>
  <text x="410.0" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">~15-24 Mpps per core</text>
  <text x="410.0" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Coexists with Linux stack</text>
  <rect x="565" y="65" width="225" height="125" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="677.5" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">DPDK (Userspace Poll)</text>
  <text x="677.5" y="109" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Bypasses kernel completely</text>
  <text x="677.5" y="125" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Poll-mode driver (100% CPU)</text>
  <text x="677.5" y="141" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">40-100+ Mpps line rate</text>
  <text x="677.5" y="157" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Dedicated NIC required</text>
</svg>

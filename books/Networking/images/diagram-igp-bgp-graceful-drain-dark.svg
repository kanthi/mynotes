<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" color-scheme="dark" aria-label="Zero-loss router maintenance sequence showing traffic shifting from draining Core R1 to healthy Core R2 via BGP GSHUT, OSPF max-metric or IS-IS overload bit, verification, and ordered undrain">
  <defs>
    <pattern id="grid-drain" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #c5d0dc; }
      .step-num { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0f172a; }
      .badge-amber { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #fbbf24; }
      .badge-green { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #4ade80; }
      .flow-active { fill: none; stroke: #4ade80; stroke-width: 2.3; marker-end: url(#arr-green); }
      .flow-drained { fill: none; stroke: #fbbf24; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#arr-amber); }
      .flow-step { fill: none; stroke: #60a5fa; stroke-width: 1.8; marker-end: url(#arr-blue); }
    </style>
  </defs>

  <rect width="840" height="440" rx="16" fill="#1c2129"/>
  <rect width="840" height="440" rx="16" fill="url(#grid-drain)"/>
  <rect x="8" y="8" width="824" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="420" y="30" text-anchor="middle" class="title">Zero-Loss Planned Maintenance: BGP GSHUT + IGP Cost-Out</text>
  <text x="420" y="46" text-anchor="middle" class="muted">Drain BGP first (RFC 8326), then cost-out IGP transit (RFC 6987 / IS-IS OL=1), verify 0 data pps, then reload</text>

  <!-- Topology Panel -->
  <rect x="24" y="60" width="792" height="164" rx="12" fill="#232a35" stroke="#6b7c90" stroke-width="1.3"/>

  <!-- PE-A -->
  <rect x="44" y="112" width="146" height="60" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.4"/>
  <text x="117" y="132" text-anchor="middle" class="label">Ingress PE-A</text>
  <text x="117" y="147" text-anchor="middle" class="mono">GSHUT -&gt; LP 0</text>
  <text x="117" y="161" text-anchor="middle" class="muted">Selects Core R2</text>

  <!-- Core R1 (Draining) -->
  <rect x="310" y="72" width="220" height="62" rx="8" fill="#2a3140" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="420" y="90" text-anchor="middle" class="label">Core R1 (Draining for Maintenance)</text>
  <text x="420" y="105" text-anchor="middle" class="mono">BGP 65535:0 · OSPF 65535 / IS-IS OL=1</text>
  <text x="420" y="121" text-anchor="middle" class="badge-amber">0 transit pps · Stub/Mgmt still up</text>

  <!-- Core R2 (Active) -->
  <rect x="310" y="150" width="220" height="62" rx="8" fill="#2a3140" stroke="#4ade80" stroke-width="1.6"/>
  <text x="420" y="168" text-anchor="middle" class="label">Core R2 (Healthy Active)</text>
  <text x="420" y="183" text-anchor="middle" class="mono">BGP LP 100 · IGP metric 10</text>
  <text x="420" y="199" text-anchor="middle" class="badge-green">Carries 100% of transit traffic</text>

  <!-- PE-B -->
  <rect x="650" y="112" width="146" height="60" rx="8" fill="#2a3140" stroke="#6b7c90" stroke-width="1.4"/>
  <text x="723" y="132" text-anchor="middle" class="label">Egress PE-B</text>
  <text x="723" y="147" text-anchor="middle" class="mono">NH via Core R2</text>
  <text x="723" y="161" text-anchor="middle" class="muted">Zero packet loss</text>

  <!-- Topology Arrows -->
  <path class="flow-drained" d="M190,128 L308,103"/>
  <path class="flow-drained" d="M530,103 L648,128"/>
  <path class="flow-active" d="M190,156 L308,181"/>
  <path class="flow-active" d="M530,181 L648,156"/>

  <!-- 4-Step Sequence Cards -->
  <!-- Step 1 -->
  <rect x="24" y="246" width="182" height="134" rx="10" fill="#2a3140" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="44" cy="266" r="10" fill="#60a5fa"/>
  <text x="44" y="270" text-anchor="middle" class="step-num">1</text>
  <text x="60" y="270" class="label">Drain BGP First</text>
  <text x="36" y="294" class="mono">bgp graceful-shutdown</text>
  <text x="36" y="311" class="muted">Sends community 65535:0</text>
  <text x="36" y="326" class="muted">Peers lower LOCAL_PREF 0</text>
  <text x="36" y="341" class="muted">BGP traffic shifts to R2</text>
  <text x="36" y="366" class="mono">Wait 15-30s</text>

  <!-- Step 2 -->
  <rect x="228" y="246" width="182" height="134" rx="10" fill="#2a3140" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="248" cy="266" r="10" fill="#fbbf24"/>
  <text x="248" y="270" text-anchor="middle" class="step-num">2</text>
  <text x="264" y="270" class="label">Cost-Out IGP</text>
  <text x="240" y="294" class="mono">max-metric 65535</text>
  <text x="240" y="311" class="mono">or set-overload-bit</text>
  <text x="240" y="326" class="muted">Transit SPF avoids R1</text>
  <text x="240" y="341" class="muted">Loopbacks stay reachable</text>
  <text x="240" y="366" class="mono">Wait 10s</text>

  <!-- Step 3 -->
  <rect x="432" y="246" width="182" height="134" rx="10" fill="#2a3140" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="452" cy="266" r="10" fill="#f87171"/>
  <text x="452" y="270" text-anchor="middle" class="step-num">3</text>
  <text x="468" y="270" class="label">Verify &amp; Reload</text>
  <text x="444" y="294" class="mono">show int counters</text>
  <text x="444" y="311" class="muted">Confirm ~0 transit pps</text>
  <text x="444" y="326" class="muted">Upgrade / reload Core R1</text>
  <text x="444" y="341" class="muted">on-startup guards boot</text>
  <text x="444" y="366" class="mono">Wait for BGP full</text>

  <!-- Step 4 -->
  <rect x="636" y="246" width="180" height="134" rx="10" fill="#2a3140" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="656" cy="266" r="10" fill="#4ade80"/>
  <text x="656" y="270" text-anchor="middle" class="step-num">4</text>
  <text x="672" y="270" class="label">Ordered Undrain</text>
  <text x="648" y="294" class="mono">1) Clear IGP overload</text>
  <text x="648" y="311" class="mono">2) Remove BGP GSHUT</text>
  <text x="648" y="326" class="muted">IGP converges first</text>
  <text x="648" y="341" class="muted">BGP restores ECMP</text>
  <text x="648" y="366" class="mono">Verify balanced pps</text>

  <!-- Arrows between steps -->
  <path class="flow-step" d="M206,313 H226"/>
  <path class="flow-step" d="M410,313 H430"/>
  <path class="flow-step" d="M614,313 H634"/>

  <!-- Footer Legend -->
  <line x1="36" y1="410" x2="66" y2="410" stroke="#4ade80" stroke-width="2.3" marker-end="url(#arr-green)"/>
  <text x="74" y="413" class="muted">Active forwarding path (100% traffic)</text>
  <line x1="304" y1="410" x2="334" y2="410" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>
  <text x="342" y="413" class="muted">Drained path (last-resort fallback only; ~0 data pps)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="POSIX C TCP server socket lifecycle from socket() through bind, listen, accept, and epoll" style="color-scheme:dark">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7fa7d9"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b6b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#11161d" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf5">POSIX C TCP Server Lifecycle: socket() to Non-Blocking Event Loop</text>
  <rect x="25" y="75" width="130" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="90.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">socket()</text>
  <text x="90.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">AF_INET</text>
  <text x="90.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SOCK_STREAM</text>
  <text x="90.0" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SO_REUSEADDR</text>
  <rect x="185" y="75" width="130" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="250.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">bind()</text>
  <text x="250.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">IP + Port</text>
  <text x="250.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">struct sockaddr</text>
  <rect x="345" y="75" width="130" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="410.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">listen()</text>
  <text x="410.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SYN backlog</text>
  <text x="410.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">SOMAXCONN</text>
  <rect x="505" y="75" width="135" height="95" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2"/>
  <text x="572.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">epoll / kqueue</text>
  <text x="572.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">O_NONBLOCK</text>
  <text x="572.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Wait ready FDs</text>
  <rect x="670" y="75" width="125" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="2"/>
  <text x="732.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf5">accept/read</text>
  <text x="732.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">Handle loop</text>
  <text x="732.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#9fb0c3">close(fd)</text>
  <line x1="155" y1="122" x2="185" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
  <line x1="315" y1="122" x2="345" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
  <line x1="475" y1="122" x2="505" y2="122" stroke="#ff7b6b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="490" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#ff7b6b"></text>
  <line x1="640" y1="122" x2="670" y2="122" stroke="#7fa7d9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7fa7d9"></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="POSIX C TCP server socket lifecycle from socket() through bind, listen, accept, and epoll" style="color-scheme:light">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#3b5b85"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="230" fill="#ffffff" rx="8"/>
  <text x="410.0" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f2a36">POSIX C TCP Server Lifecycle: socket() to Non-Blocking Event Loop</text>
  <rect x="25" y="75" width="130" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="90.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">socket()</text>
  <text x="90.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">AF_INET</text>
  <text x="90.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SOCK_STREAM</text>
  <text x="90.0" y="151" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SO_REUSEADDR</text>
  <rect x="185" y="75" width="130" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="250.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">bind()</text>
  <text x="250.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">IP + Port</text>
  <text x="250.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">struct sockaddr</text>
  <rect x="345" y="75" width="130" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="410.0" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">listen()</text>
  <text x="410.0" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SYN backlog</text>
  <text x="410.0" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">SOMAXCONN</text>
  <rect x="505" y="75" width="135" height="95" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/>
  <text x="572.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">epoll / kqueue</text>
  <text x="572.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">O_NONBLOCK</text>
  <text x="572.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Wait ready FDs</text>
  <rect x="670" y="75" width="125" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="2"/>
  <text x="732.5" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1f2a36">accept/read</text>
  <text x="732.5" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">Handle loop</text>
  <text x="732.5" y="135" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5a6b7d">close(fd)</text>
  <line x1="155" y1="122" x2="185" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
  <line x1="315" y1="122" x2="345" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
  <line x1="475" y1="122" x2="505" y2="122" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="490" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#c0392b"></text>
  <line x1="640" y1="122" x2="670" y2="122" stroke="#3b5b85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3b5b85"></text>
</svg>
